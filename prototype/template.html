<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="数理图谱" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>数理知识图谱 · 动态视图引擎</title>
  <!-- 在线时自动加载 KaTeX 渲染出版级数学公式；离线时无缝回退到内置原生公式渲染器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.__katexReady && window.__katexReady()"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-subtle: #f1f4f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --upstream: #d97706;
      --upstream-soft: #fffbeb;
      --upstream-border: #fcd34d;
      --downstream: #059669;
      --downstream-soft: #ecfdf5;
      --downstream-border: #6ee7b7;
      --equiv: #7c3aed;
      --equiv-soft: #f5f3ff;
      --equiv-border: #c4b5fd;
      --counter: #e11d48;
      --counter-soft: #fff1f2;
      --counter-border: #fda4af;
      --pitfall-bg: #fff7ed;
      --pitfall-border: #fdba74;
      --pitfall-ink: #9a3412;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 13px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    }
    .app { display: flex; flex-direction: column; width: 100%; height: 100dvh; overflow: hidden; }

    /* 1. 两层结构化顶栏（参考 finlex-site 层次）：主栏（品牌 + 全局检索 + 工具）+ 次级筛选栏（阶段分段标签 + 级联下拉） */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    .topbar-main {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-family: var(--font-math); font-size: 17px;
      flex-shrink: 0;
    }
    .brand-title { font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
    .brand-sub { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

    /* 全局检索框 */
    .hero-search {
      flex: 1; max-width: 540px; min-width: 220px; height: 38px;
      display: flex; align-items: center; gap: 7px;
      padding: 0 8px 0 13px;
      background: #f8fafc; border: 1.5px solid var(--border-strong); border-radius: 10px;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .hero-search:hover { border-color: #94a3b8; }
    .hero-search:focus-within {
      background: var(--surface); border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .hero-search-icon { font-size: 14px; color: var(--ink-muted); user-select: none; flex-shrink: 0; }
    .hero-search-input {
      flex: 1; min-width: 0; border: none; background: transparent;
      font-size: 13.5px; color: var(--ink); outline: none; padding: 0;
    }
    .hero-search-input::placeholder { color: #94a3b8; }
    .search-clear-btn {
      border: none; background: #e2e8f0; color: var(--ink-secondary);
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1; cursor: pointer; flex-shrink: 0;
    }
    .search-clear-btn:hover { background: #cbd5e1; color: var(--ink); }
    .search-count-badge {
      font-size: 10.5px; color: var(--ink-muted); padding: 2px 8px;
      border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border);
      white-space: nowrap; flex-shrink: 0;
    }
    .search-count-badge.filtered { color: #1d4ed8; background: var(--primary-soft); border-color: var(--primary-border); font-weight: 600; }

    .device-controls { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* 第二行：阶段分段标签 + 学科/分支/专题级联筛选 */
    .filterbar {
      padding: 7px 18px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .stage-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .stage-pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
      padding: 4px 11px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.14s ease;
    }
    .stage-pill:hover { border-color: var(--primary-border); color: var(--primary); }
    .stage-pill.active {
      background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.25);
    }
    .stage-pill-cnt {
      font-size: 11px; opacity: 0.78;
      background: rgba(15, 23, 42, 0.06); padding: 0 5px; border-radius: 99px;
    }
    .stage-pill.active .stage-pill-cnt { background: rgba(255, 255, 255, 0.22); opacity: 1; }

    .filter-selects { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    .select-field {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 8px; padding: 3px 8px;
    }
    .select-field.active-filter { background: var(--primary-soft); border-color: var(--primary-border); }
    .select-field label { font-size: 11px; color: var(--ink-muted); user-select: none; white-space: nowrap; }
    .select-field.active-filter label { color: #1d4ed8; font-weight: 600; }
    .select-field select {
      border: none; background: transparent; color: var(--ink);
      font-size: 12px; font-weight: 500; outline: none; cursor: pointer;
      padding: 2px 1px; max-width: 170px;
    }
    .select-field.active-filter select { color: #1e40af; font-weight: 600; }

    .toggle-btn {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
      padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }

    /* 2. 主工作区：左侧公式推导图谱占主导（flex: 1）+ 可拖拽分隔条 + 右侧详情推导抽屉（默认 410px，支持拖拽调宽） */
    .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
    .canvas-pane {
      position: relative; display: flex; flex-direction: column;
      flex: 1; min-width: 420px; min-height: 0;
      background: radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0) 0 0 / 24px 24px, var(--bg);
    }
    .pane-resizer {
      width: 6px; flex-shrink: 0; cursor: col-resize;
      background: var(--border); position: relative; z-index: 15;
      transition: background 0.15s ease;
    }
    .pane-resizer:hover, .pane-resizer.dragging { background: var(--primary); }
    .pane-resizer::after {
      content: ""; position: absolute; top: 50%; left: 2px; transform: translateY(-50%);
      width: 2px; height: 34px; border-radius: 2px; background: rgba(100, 116, 139, 0.45);
    }
    .pane-resizer:hover::after, .pane-resizer.dragging::after { background: #fff; }

    .drawer {
      width: var(--drawer-w, 410px); min-width: 320px; flex-shrink: 0;
      background: var(--surface); display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
    }
    .app.drawer-collapsed .pane-resizer,
    .app.drawer-collapsed .drawer { display: none; }

    /* 精简上下文视图控制条 */
    .canvas-subbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 7px 14px;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .view-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .right-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

    .mode-switch {
      display: inline-flex; padding: 3px; border-radius: 9px;
      background: var(--surface-subtle); border: 1px solid var(--border); gap: 3px;
    }
    .mode-switch-btn {
      border: none; background: transparent; color: var(--ink-secondary);
      padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .mode-switch-btn:hover { color: var(--ink); }
    .mode-switch-btn.active {
      background: var(--surface); color: var(--primary); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .view-badge {
      font-size: 11px; font-weight: 600; color: #1d4ed8;
      background: var(--primary-soft); border: 1px solid var(--primary-border);
      padding: 2px 9px; border-radius: var(--radius-pill);
      max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 按需展开的最短路径查询条（避免常驻挤占主工具栏） */
    .path-bar {
      display: none; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 14px;
      background: #fffbeb; border-bottom: 1px solid var(--upstream-border);
      font-size: 12px; color: var(--ink-secondary);
    }
    .path-bar.open { display: flex; }
    .path-finder { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
    .path-finder select {
      border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 8px;
      font-size: 12px; background: var(--surface); color: var(--ink); max-width: 210px;
    }

    .zoom-controls {
      display: inline-flex; align-items: center;
      border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); overflow: hidden;
    }
    .zoom-btn { border: none; background: transparent; padding: 4px 8px; font-size: 12px; cursor: pointer; color: var(--ink-secondary); }
    .zoom-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .zoom-val { font-size: 11px; color: var(--ink-muted); padding: 0 5px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-width: 42px; text-align: center; }
    .action-btn { border: 1px solid var(--primary); background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; }
    .action-btn.ghost { background: var(--surface); color: var(--ink-secondary); border-color: var(--border-strong); }

    .legend-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 5px 14px;
      background: rgba(248, 250, 252, 0.92);
      border-bottom: 1px solid var(--border);
      font-size: 11.5px; color: var(--ink-secondary);
    }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .graph-scroll { flex: 1; overflow: auto; padding: 18px; }
    .graph-zoom-wrap { transform-origin: top left; transition: transform 0.12s ease; }
    .graph-stage { position: relative; flex-shrink: 0; }
    .lane-header {
      position: absolute; top: 4px; width: 286px; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.94); border: 1px solid var(--border);
      border-radius: var(--radius-pill); padding: 4px 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lane-header.bridge-lane {
      background: #f8fafc; border-style: dashed; border-color: #94a3b8; color: #475569;
    }
    .lane-header.focus-center-lane {
      background: var(--primary-soft); border-color: var(--primary-border); color: #1d4ed8;
    }

    .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge-path { fill: none; stroke: #94a3b8; stroke-width: 1.7; opacity: 0.34; transition: stroke 0.18s ease, opacity 0.18s ease, stroke-width 0.18s ease; }
    .edge-path.cross-app { stroke-dasharray: 5 4; }
    .edge-path.dimmed { opacity: 0.06; }
    .edge-path.highlight-primary { stroke: var(--primary); stroke-width: 2.8; opacity: 1; }
    .edge-path.highlight-upstream { stroke: var(--upstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-downstream { stroke: var(--downstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-equiv { stroke: var(--equiv); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-counter { stroke: var(--counter); stroke-width: 2.6; opacity: 1; stroke-dasharray: 6 3; }
    .edge-path.highlight-path { stroke: #e11d48; stroke-width: 3.1; opacity: 1; stroke-dasharray: 7 4; }

    .formula-node {
      position: absolute; width: 286px; background: var(--surface);
      border: 1.5px solid var(--border-strong); border-radius: var(--radius-lg);
      padding: 10px 14px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
      user-select: none; z-index: 3;
    }
    .formula-node.bridge-node {
      border-style: dashed; background: #f8fafc; opacity: 0.92;
    }
    .formula-node:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); z-index: 8; opacity: 1; }
    .formula-node.selected { border-color: var(--primary); border-width: 2px; border-style: solid; background: var(--primary-soft); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16); z-index: 7; opacity: 1; }
    .formula-node.rel-upstream { border-color: var(--upstream); background: var(--upstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-downstream { border-color: var(--downstream); background: var(--downstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-equiv { border-color: var(--equiv); background: var(--equiv-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-path { border-color: #e11d48; background: #fff1f2; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14); z-index: 6; opacity: 1; }
    .formula-node.dimmed { opacity: 0.18; }

    .node-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
    .node-title { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-badge { font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius-pill); background: var(--surface-subtle); color: var(--ink-muted); border: 1px solid var(--border); flex-shrink: 0; }
    .node-badge.bridge-tag { background: #e2e8f0; color: #334155; }
    .node-math { min-height: 46px; display: flex; align-items: center; justify-content: center; padding: 4px 2px; font-size: 14.8px; color: var(--ink); overflow-x: auto; scrollbar-width: none; }
    .node-math::-webkit-scrollbar { display: none; }
    .node-math.long-math { font-size: 12.8px; }
    .node-math.xlong-math { font-size: 11.4px; }
    .node-foot { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--ink-muted); }
    .node-tag { background: rgba(15, 23, 42, 0.05); padding: 1px 6px; border-radius: 5px; }
    .disc-math { background: #e0e7ff; color: #3730a3; }
    .disc-phys { background: #dcfce7; color: #166534; }
    .disc-chem { background: #fef3c7; color: #92400e; }
    .kind-pill { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .kind-formula { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .kind-axiom { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .kind-distribution { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .kind-theorem { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .kind-inequality { background: #ffe4e6; color: #be123c; border-color: #fda4af; }
    .kind-law { background: #dcfce7; color: #166534; border-color: #86efac; }
    .kind-definition { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

    .edge-pill {
      position: absolute; transform: translate(-50%, -50%);
      background: var(--surface); border: 1px solid var(--primary-border);
      border-radius: var(--radius-pill); padding: 2px 9px; font-size: 11px; color: var(--primary);
      cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap; z-index: 9;
    }
    .edge-pill:hover, .edge-pill.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .empty-state {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--ink-muted); font-size: 14px; text-align: center; padding: 24px;
    }

    /* 3. 右侧详情与分级推导抽屉（保持紧凑 410px，支持拖拽调宽） */
    .drawer-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); background: var(--surface-subtle); padding: 6px 12px 0; gap: 6px; }
    .drawer-tab { border: none; background: transparent; padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .drawer-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); background: var(--surface); border-radius: 8px 8px 0 0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 15px 0 7px; }
    .section-label:first-child { margin-top: 0; }

    .hero-card { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px; }
    .hero-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
    .hero-aliases { font-size: 12px; color: var(--ink-muted); margin-bottom: 9px; }
    .hero-math { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; font-size: 17px; overflow-x: auto; margin-bottom: 9px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--ink-secondary); }
    .chip.verified { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .chip.rule { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-family: var(--font-mono); }

    .var-table { width: 100%; border-collapse: collapse; font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .var-table th, .var-table td { padding: 6px 7px; border-bottom: 1px solid var(--border); text-align: left; }
    .var-table th { background: var(--surface-subtle); color: var(--ink-muted); font-weight: 600; font-size: 11px; }
    .var-table tr:last-child td { border-bottom: none; }

    .rel-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; margin-bottom: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
    .rel-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rel-kind { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); }
    .rel-kind.upstream { background: var(--upstream-soft); color: var(--upstream); border: 1px solid var(--upstream-border); }
    .rel-kind.downstream { background: var(--downstream-soft); color: var(--downstream); border: 1px solid var(--downstream-border); }
    .rel-kind.equiv { background: var(--equiv-soft); color: var(--equiv); border: 1px solid var(--equiv-border); }

    .mini-btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary); padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }

    .level-switcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-subtle); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin: 12px 0 14px; }

    .summary-box { background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: var(--radius-md); padding: 13px; color: #1e3a8a; font-size: 13.5px; line-height: 1.65; }

    .step-note { font-size: 12.5px; color: var(--ink); }
    .step-math { background: var(--surface-subtle); border-radius: 7px; padding: 8px 10px; text-align: center; font-size: 14.5px; overflow-x: auto; }
    .step-cites { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); }
    .cite-link { border: 1px solid var(--primary-border); background: var(--primary-soft); color: var(--primary); border-radius: var(--radius-pill); padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .cite-link:hover { background: var(--primary); color: #fff; }
    .pitfall-box { margin-top: 7px; background: var(--pitfall-bg); border: 1px solid var(--pitfall-border); border-radius: 7px; padding: 7px 10px; font-size: 12px; color: var(--pitfall-ink); }

    .math-frac > span:last-child { padding: 1px 4px 0; }

    /* 桌面 / 平板 / 手机三端界面适配与预览框架 */

<body>
  <div class="app mode-desktop" id="appRoot" data-mobile-pane="canvas">
    <!-- 1. 结构化两层顶栏：第一行 品牌 + 核心搜索 + 视图控制；第二行 阶段分段标签 + 学科/分支/专题筛选 -->
    <header class="topbar">
      <div class="topbar-main">
        <div class="brand">
          <div class="brand-badge">∑</div>
          <div>
            <div class="brand-title">数理知识图谱 · 动态视图引擎</div>
            <div class="brand-sub" id="statsSubtitle">加载中...</div>
          </div>
        </div>

        <div class="hero-search" role="search">
          <span class="hero-search-icon" aria-hidden="true">🔍</span>
          <input class="hero-search-input" id="searchInput" type="search" placeholder="搜索公式、公理、定理、分布、不等式或别名..." />
          <button class="search-clear-btn" id="searchClearBtn" type="button" title="清空搜索" style="display:none">×</button>
          <span class="search-count-badge" id="searchCountBadge">237 项</span>
        </div>

        <div class="device-controls">
          <button class="toggle-btn mobile-or-tablet-only" id="filterToggleBtn">筛选</button>
          <button class="toggle-btn desktop-or-tablet-only active" id="tabletDrawerBtn" title="收起右侧详情推导栏，横向全屏浏览图谱">◧ 收起详情</button>
          <div class="select-field" title="切换桌面端、平板端或手机端适配界面">
            <label for="deviceModeSelect">界面</label>
            <select id="deviceModeSelect">
              <option value="auto">自动适配</option>
              <option value="desktop">桌面端</option>
              <option value="tablet">平板端</option>
              <option value="mobile">手机端</option>
            </select>
          </div>
          <button class="toggle-btn active" id="installPwaBtn" style="display:none" title="安装到桌面作为独立应用离线使用">⬇ 安装</button>
        </div>
      </div>

      <div class="filterbar">
        <div class="stage-pills" id="stagePills" role="group" aria-label="按学习阶段筛选"></div>
        <div class="filter-selects">
          <div class="select-field" id="discField">
            <label for="discSelect">学科</label>
            <select id="discSelect"></select>
          </div>
          <div class="select-field" id="branchField">
            <label for="branchSelect">分支</label>
            <select id="branchSelect"></select>
          </div>
          <div class="select-field" id="topicField">
            <label for="topicSelect">专题</label>
            <select id="topicSelect"></select>
          </div>
          <button class="toggle-btn" id="resetBtn">重置</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <!-- 2. 主工作区左侧：公式推导画布占主要地位 -->
      <section class="canvas-pane">
        <div class="canvas-subbar">
          <div class="view-controls">
            <div class="mode-switch" role="tablist" aria-label="视角切换">
              <button class="mode-switch-btn active" id="focusModeBtn" type="button">◎ 聚焦关联</button>
              <button class="mode-switch-btn" id="globalModeBtn" type="button">🌐 全局总览</button>
            </div>
            <span class="view-badge" id="viewBadge">聚焦关联视图</span>

            <!-- 以下三项仅在全局总览模式下显示，聚焦模式下自动隐去以保持清爽 -->
            <div class="select-field" id="layoutField" style="display:none">
              <label for="layoutModeSelect">布局</label>
              <select id="layoutModeSelect">
                <option value="auto">自动推荐</option>
                <option value="topo">拓扑推导层</option>
                <option value="topic">专题泳道</option>
                <option value="branch">分支泳道</option>
                <option value="stage">阶段泳道</option>
              </select>
            </div>
            <div class="select-field" id="densityField" style="display:none">
              <label for="densitySelect">密度</label>
              <select id="densitySelect">
                <option value="compact">紧凑</option>
                <option value="standard" selected>标准</option>
                <option value="spacious">宽松</option>
              </select>
            </div>
            <button class="toggle-btn" id="bridgeBtn" style="display:none" title="全局视角筛选局部时，虚框带出 1 跳跨阶段/跨学科直接前置与衍生对象">⇄ 跨界桥梁</button>
          </div>

          <div class="right-controls">
            <button class="toggle-btn" id="pathToggleBtn" title="展开/收起任意两对象之间的最短推导路径查询">🧭 查路径</button>
            <button class="toggle-btn" id="shareViewBtn" title="复制当前动态视图的直达分享链接">🔗 分享视图</button>
            <div class="zoom-controls">
              <button class="zoom-btn" id="zoomOutBtn" title="缩小">−</button>
              <span class="zoom-val" id="zoomVal">100%</span>
              <button class="zoom-btn" id="zoomInBtn" title="放大">+</button>
              <button class="zoom-btn" id="zoomFitBtn" title="自动适应当前视图">适应</button>
            </div>
          </div>
        </div>

        <!-- 按需展开的最短路径查询栏 -->
        <div class="path-bar" id="pathBar">
          <div class="path-finder">
            <strong style="color:var(--ink);">推导路径查询：</strong>
            <select id="pathStart" aria-label="起点对象"></select>
            <span>→</span>
            <select id="pathEnd" aria-label="终点对象"></select>
            <button class="action-btn" id="findPathBtn">查找最短路径</button>
            <button class="action-btn ghost" id="clearPathBtn" style="display:none">清除路径</button>
          </div>
          <button class="mini-btn" id="closePathBarBtn" type="button">收起</button>
        </div>

        <div class="legend-bar">
          <div class="legend">
            <span class="legend-item"><span class="dot" style="background:var(--primary)"></span>当前选中</span>
            <span class="legend-item"><span class="dot" style="background:var(--upstream)"></span>前置依赖</span>
            <span class="legend-item"><span class="dot" style="background:var(--downstream)"></span>直接衍生</span>
            <span class="legend-item"><span class="dot" style="background:var(--equiv)"></span>等价 / 对偶</span>
            <span class="legend-item"><span class="dot" style="background:var(--counter)"></span>反例 / 失效边界</span>
            <span class="legend-item" style="color:var(--ink-muted)">虚线边 = 跨界应用或反例 · 虚框卡 = 跨界桥梁</span>
          </div>
          <span id="layoutHint" style="color:var(--ink-muted)"></span>
        </div>

        <div class="graph-scroll" id="graphScroll">
          <div class="graph-zoom-wrap" id="zoomWrap">
            <div class="graph-stage" id="graphStage">
              <div id="laneLayer"></div>

                <defs>
                  <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94a3b8" />
                  </marker>
                  <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2563eb" />
                  </marker>
                  <marker id="arrow-upstream" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706" />
                  </marker>
                  <marker id="arrow-downstream" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669" />
                  </marker>
                  <marker id="arrow-equiv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c3aed" />
                  </marker>
                  <marker id="arrow-path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#e11d48" />
                  </marker>
                </defs>
                <g id="edgeLayer"></g>
              </svg>
              <div id="nodeLayer"></div>
            </div>
          </div>
        </div>

        <div class="mobile-selected-pill" id="mobileSelectedPill">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">已选：<strong id="mobilePillTitle"></strong></span>
          <button class="mobile-pill-btn" id="mobilePillAction">查看详情 ›</button>
        </div>
      </section>

      <!-- 可拖拽分隔条：保持右侧详情框默认 410px，支持按需拖拽调宽（双击还原默认） -->
      <div class="pane-resizer" id="paneResizer" title="左右拖动调整右侧详情与推导栏宽度（双击还原默认 410px）"></div>

    <nav class="mobile-nav" aria-label="移动端视图切换">
      <button class="mobile-nav-btn active" data-pane="canvas">🗺 图谱画布</button>
      <button class="mobile-nav-btn" data-pane="formula">📐 对象详情</button>
      <button class="mobile-nav-btn" data-pane="derivation">🔀 分级推导</button>
    </nav>
