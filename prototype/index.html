    // 设备界面模式管理
    function getEffectiveDevice() {
      if (state.deviceMode !== "auto") return state.deviceMode;
      const w = window.innerWidth;
      if (w <= 680) return "mobile";
      if (w <= 1080) return "tablet";
      return "desktop";
    }

    function applyDeviceMode(reFit = true) {
      const eff = getEffectiveDevice();
      const appEl = document.getElementById("appRoot");
      document.body.classList.toggle("preview-framed", state.deviceMode !== "auto" && (
        (state.deviceMode === "mobile" && window.innerWidth > 560) ||
        (state.deviceMode === "tablet" && window.innerWidth > 1020)
      ));
      appEl.classList.remove("mode-desktop", "mode-tablet", "mode-mobile");
      appEl.classList.add(`mode-${eff}`);

      if (eff === "mobile") {
        appEl.classList.toggle("filters-open", state.filtersOpen);
        appEl.classList.remove("drawer-collapsed", "tablet-drawer-closed");
        appEl.dataset.mobilePane = state.mobilePane;
      } else if (eff === "tablet") {
        appEl.classList.toggle("filters-open", state.filtersOpen);
        appEl.classList.toggle("tablet-drawer-closed", !state.tabletDrawerOpen);
        appEl.classList.remove("drawer-collapsed");
      } else {
        appEl.classList.remove("filters-open", "tablet-drawer-closed");
        appEl.classList.toggle("drawer-collapsed", !state.tabletDrawerOpen);
      }

      document.querySelectorAll(".mobile-nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.pane === state.mobilePane);
      });
      const drawerBtn = document.getElementById("tabletDrawerBtn");
      if (drawerBtn) {
        drawerBtn.classList.toggle("active", state.tabletDrawerOpen);
        drawerBtn.textContent = state.tabletDrawerOpen ? "◧ 收起详情" : "◧ 展开详情";
      }
      const filterBtn = document.getElementById("filterToggleBtn");
      if (filterBtn) filterBtn.classList.toggle("active", state.filtersOpen);

      updateMobileSelectedPill();
      if (reFit && state.viewMode !== "directory") {
        setTimeout(() => {
          if (state.viewMode === "focus") generateDynamicView(true, { keepSelected: true });
          else fitViewToCanvas();
        }, 40);
      }
    }

    function updateMobileSelectedPill() {
      const pill = document.getElementById("mobileSelectedPill");
      if (!pill) return;
      const f = formulaById[state.selectedFormulaId];
      if (!f) { pill.style.display = "none"; return; }
      pill.style.display = "";
      document.getElementById("mobilePillTitle").textContent = f.name;
    }

    function setMobilePane(pane) {
      state.mobilePane = pane;
      if (pane === "formula") { state.activeTab = "formula"; renderDrawer(); }
      else if (pane === "derivation") { state.activeTab = "derivation"; renderDrawer(); }
      applyDeviceMode(pane === "canvas");
    }

    document.getElementById("deviceModeSelect").onchange = (e) => {
      state.deviceMode = e.target.value;
      try { localStorage.setItem("fg_device_mode", state.deviceMode); } catch (err) {}
      if (state.deviceMode === "mobile") { state.filtersOpen = false; state.mobilePane = "canvas"; }
      else if (state.deviceMode === "tablet") { state.filtersOpen = false; state.tabletDrawerOpen = true; }
      applyDeviceMode(true);
      syncStateToURL();
    };
    document.getElementById("filterToggleBtn").onclick = () => {
      state.filtersOpen = !state.filtersOpen;
      applyDeviceMode(false);
    };
    document.getElementById("tabletDrawerBtn").onclick = () => {
      state.tabletDrawerOpen = !state.tabletDrawerOpen;
      applyDeviceMode(true);
    };
    document.querySelectorAll(".mobile-nav-btn").forEach(btn => {
      btn.onclick = () => setMobilePane(btn.dataset.pane);
    });
    document.getElementById("mobilePillAction").onclick = () => setMobilePane("formula");
    window.addEventListener("resize", () => {
      if (state.deviceMode === "auto") applyDeviceMode(false);
    });

    const _origSelectFormula = selectFormula;
    selectFormula = (id) => {
      _origSelectFormula(id);
      updateMobileSelectedPill();
    };
    const _origSelectDerivation = selectDerivation;
    selectDerivation = (id) => {
      _origSelectDerivation(id);
      if (getEffectiveDevice() === "mobile") setMobilePane("derivation");
    };

    const _baseRenderDrawer = renderDrawer;
    renderDrawer = () => { _baseRenderDrawer(); updateMobileSelectedPill(); syncStateToURL(); };

    window.__katexReady = () => {
      if (state.viewMode === "directory") renderDirectoryView(currentView.matchedFormulas);
      else renderGraph();
      renderDrawer();
    };
    initControls();
    initPaneResizer();
    try {
      const savedMode = localStorage.getItem("fg_device_mode");
      if (["auto", "desktop", "tablet", "mobile"].includes(savedMode)) {
        state.deviceMode = savedMode;
        document.getElementById("deviceModeSelect").value = savedMode;
      }
      const savedW = parseInt(localStorage.getItem("fg_drawer_w"), 10);
      if (!Number.isNaN(savedW) && savedW >= 320 && savedW <= 760) {
        state.customDrawerW = savedW;
        applyDrawerWidth();
      }
    } catch (err) {}
    restoreStateFromURL();
    document.getElementById("deviceModeSelect").value = state.deviceMode;
    syncCascadingDropdowns();
    // =========================================================================
    // V1 离线个人工作台（Overlay 补丁层 + IndexedDB 持久化 + JSON 导入导出）
    // =========================================================================
    const FG_DB_NAME = "formula_graph_local_workspace_v1";
    const FG_DB_STORE = "kv";
    const FG_DB_KEY = "patch_v1";
    const FG_LS_KEY = "formula_graph_local_patch_v1";

    const OFFICIAL_FORMULAS_BASE = MASTER_GRAPH.formulas.map(f => {
      const c = JSON.parse(JSON.stringify(f));
      delete c._branches; delete c._canonicalTopics; delete c._primaryBranch;
      delete c._primaryTopic; delete c._primaryStage; delete c._kind; delete c._degree;
      delete c._titleSearch; delete c._bodySearch; delete c._fullSearch; delete c._local_status;
      return c;
    });
    const OFFICIAL_DERIVS_BASE = MASTER_GRAPH.derivations.map(d => JSON.parse(JSON.stringify(d)));

    let localStorageBackend = "IndexedDB";
    let localPatch = createEmptyLocalPatch();
    let localEditorState = { mode: "create", formulaId: null };
    let localImportMode = "merge";
    let localToastTimer = null;

    function createEmptyLocalPatch() {
      return {
        schema_version: "1.0",
        app: "formula-graph",
        updated_at: null,
        next_custom_seq: 1,
        overrides: {},
        custom_formulas: []
      };
    }

    function showLocalToast(msg) {
      const el = document.getElementById("localToast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(localToastTimer);
      localToastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function renderLocalBadge(f) {
      if (!f || !f._local_status) return "";
      if (f._local_status === "modified") return `<span class="pill local-mod" title="该对象包含本机离线修订，可随时还原官方版">🏷 本地修订</span>`;
      if (f._local_status === "custom") return `<span class="pill local-new" title="仅保存在本机工作区的自定义对象">🏷 本地新增</span>`;
      return "";
    }

    function openLocalIDB() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === "undefined") { reject(new Error("no_idb")); return; }
        try {
          const req = indexedDB.open(FG_DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(FG_DB_STORE)) db.createObjectStore(FG_DB_STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error("idb_open_err"));
        } catch (err) { reject(err); }
      });
    }

    function normalizeLocalPatch(raw) {
      const p = createEmptyLocalPatch();
      if (!raw || typeof raw !== "object") return p;
      p.updated_at = raw.updated_at || null;
      p.next_custom_seq = Number.isInteger(raw.next_custom_seq) && raw.next_custom_seq >= 1 ? raw.next_custom_seq : 1;
      if (raw.overrides && typeof raw.overrides === "object") p.overrides = raw.overrides;
      if (Array.isArray(raw.custom_formulas)) p.custom_formulas = raw.custom_formulas;
      p.custom_formulas.forEach(cf => {
        const m = cf && typeof cf.id === "string" && cf.id.match(/^local_formula_(\d+)$/);
        if (m) {
          const n = Number(m[1]);
          if (n >= p.next_custom_seq) p.next_custom_seq = n + 1;
        }
      });
      return p;
    }

    async function loadLocalPatchFromStore() {
      try {
        const db = await openLocalIDB();
        const val = await new Promise((resolve, reject) => {
          const tx = db.transaction(FG_DB_STORE, "readonly");
          const req = tx.objectStore(FG_DB_STORE).get(FG_DB_KEY);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        db.close();
        localStorageBackend = "IndexedDB";
        if (val && typeof val === "object") return normalizeLocalPatch(val);
      } catch (_) {
        localStorageBackend = "localStorage";
      }
      try {
        const raw = localStorage.getItem(FG_LS_KEY);
        if (raw) return normalizeLocalPatch(JSON.parse(raw));
      } catch (_) {}
      return createEmptyLocalPatch();
    }

    async function saveLocalPatchToStore(patch) {
      patch.updated_at = new Date().toISOString();
      let savedIdb = false;
      try {
        const db = await openLocalIDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(FG_DB_STORE, "readwrite");
          tx.objectStore(FG_DB_STORE).put(patch, FG_DB_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
        savedIdb = true;
        localStorageBackend = "IndexedDB";
      } catch (_) {
        localStorageBackend = "localStorage";
      }
      try {
        localStorage.setItem(FG_LS_KEY, JSON.stringify(patch));
      } catch (_) {
        if (!savedIdb) showLocalToast("本地存储空间不足，请导出 JSON 补丁包备份");
      }
    }

    function resolveOverrideFormulaId(ovKey, ov, officialMap) {
      const fid = ov.formula_id || ovKey;
      if (officialMap.has(fid)) return fid;
      if (ov.anchor_name) {
        for (const f of OFFICIAL_FORMULAS_BASE) {
          if (f.name === ov.anchor_name) return f.id;
        }
      }
      return null;
    }

    function recomputeFormulaGraphIndexes() {
      Object.keys(formulaById).forEach(k => delete formulaById[k]);
      Object.keys(derivById).forEach(k => delete derivById[k]);
      Object.keys(globalDegree).forEach(k => delete globalDegree[k]);

      MASTER_GRAPH.formulas.forEach(f => {
        formulaById[f.id] = f;
        globalDegree[f.id] = 0;
      });
      MASTER_GRAPH.derivations = MASTER_GRAPH.derivations.filter(d =>
        formulaById[d.to_formula_id] && Array.isArray(d.from_formula_ids) && d.from_formula_ids.every(fid => Boolean(formulaById[fid]))
      );
      MASTER_GRAPH.derivations.forEach(d => {
        derivById[d.id] = d;
        if (globalDegree[d.to_formula_id] !== undefined) globalDegree[d.to_formula_id] += 1;
        d.from_formula_ids.forEach(fid => { if (globalDegree[fid] !== undefined) globalDegree[fid] += 1; });
      });

      MASTER_GRAPH.formulas.forEach(f => {
        const branches = new Set();
        const canonicalTopics = new Set();
        let primaryBranch = null;
        let primaryTopic = null;
        ((f.taxonomy && f.taxonomy.topics) || []).forEach(rt => {
          (RAW_TO_CANONICAL[rt] || []).forEach(m => {
            branches.add(m.branchId);
            canonicalTopics.add(m.topicId);
            if (!primaryBranch) primaryBranch = m.branchId;
            if (!primaryTopic) primaryTopic = m.topicId;
          });
        });
        f._branches = branches;
        f._canonicalTopics = canonicalTopics;
        f._primaryBranch = primaryBranch || "other";
        f._primaryTopic = primaryTopic || "other";
        f._primaryStage = (f.taxonomy && f.taxonomy.education_stages && f.taxonomy.education_stages[0]) || "junior_high";
        f._kind = f.node_kind || "formula";
        f._degree = globalDegree[f.id] || 0;

        const stageLbls = ((f.taxonomy && f.taxonomy.education_stages) || []).map(s => STAGE_LABELS[s] || s).join(" ");
        const brLbls = [...branches].map(bid => BRANCH_BY_ID[bid]?.label || "").join(" ");
        const tpLbls = [...canonicalTopics].map(tid => TOPIC_BY_ID[tid]?.label || "").join(" ");
        const varTxt = (f.variables || []).map(v => `${v.symbol} ${v.name} ${v.si_unit || ""}`).join(" ");
        f._titleSearch = `${f.name} ${(f.aliases || []).join(" ")} ${NODE_KIND_LABELS[f._kind] || ""}`.toLowerCase();
        f._bodySearch = `${f.latex} ${f.statement || ""} ${f.intuition || ""} ${f.worked_example || ""} ${(f.applications || []).join(" ")} ${(f.conditions || []).join(" ")} ${varTxt} ${stageLbls} ${brLbls} ${tpLbls}`.toLowerCase();
        f._fullSearch = `${f._titleSearch} ${f._bodySearch}`;
      });
    }

    function applyLocalPatchToRuntime() {
      const formulas = OFFICIAL_FORMULAS_BASE.map(f => JSON.parse(JSON.stringify(f)));
      const derivs = OFFICIAL_DERIVS_BASE.map(d => JSON.parse(JSON.stringify(d)));
      const officialMap = new Map(formulas.map(f => [f.id, f]));
      let localDerivSeq = 1;

      const appendCustomLinks = (selfId, customLinks) => {
        (customLinks || []).forEach(lk => {
          if (!lk || !lk.target_formula_id || lk.target_formula_id === selfId) return;
          const isOut = lk.dir !== "in";
          const relType = lk.relation_type || "derives_to";
          derivs.push({
            id: `local_deriv_${localDerivSeq++}`,
            from_formula_ids: [isOut ? selfId : lk.target_formula_id],
            to_formula_id: isOut ? lk.target_formula_id : selfId,
            relation_type: relType,
            bidirectional: relType === "equivalent_to" || relType === "dual_of",
            summary: lk.note || "本地自定义推导关系",
            steps: [{ level: "L1", title: "本地补充说明", detail: lk.note || "由用户在离线个人工作台添加。" }],
            _local: true
          });
        });
      };

      Object.entries(localPatch.overrides || {}).forEach(([ovKey, ov]) => {
        if (!ov || typeof ov !== "object") return;
        const tid = resolveOverrideFormulaId(ovKey, ov, officialMap);
        if (!tid) return;
        const f = officialMap.get(tid);
        const fld = ov.fields || {};
        if (fld.name) f.name = fld.name;
        if (Array.isArray(fld.aliases)) f.aliases = fld.aliases;
        if (fld.node_kind) f.node_kind = fld.node_kind;
        if (fld.latex) f.latex = fld.latex;
        if (fld.statement !== undefined) f.statement = fld.statement;
        if (fld.intuition !== undefined) f.intuition = fld.intuition;
        if (fld.worked_example !== undefined) f.worked_example = fld.worked_example;
        if (Array.isArray(fld.conditions)) f.conditions = fld.conditions;
        if (Array.isArray(fld.applications)) f.applications = fld.applications;
        if (fld.stage) f.taxonomy.education_stages = [fld.stage];
        if (fld.discipline) f.taxonomy.disciplines = [fld.discipline];
        if (fld.topic) f.taxonomy.topics = [fld.topic];
        if (fld.source) {
          if (!f.review) f.review = {};
          f.review.source = fld.source;
        }
        f._local_status = "modified";
        appendCustomLinks(tid, ov.custom_links);
      });

      (localPatch.custom_formulas || []).forEach(cf => {
        if (!cf || !cf.id) return;
        const topicId = cf.topic || Object.keys(TOPIC_BY_ID)[0] || "calculus";
        const discId = cf.discipline || (TOPIC_BY_ID[topicId] ? TOPIC_BY_ID[topicId].disciplineId : "mathematics");
        const rawTopic = (TOPIC_BY_ID[topicId] && TOPIC_BY_ID[topicId].raw_topics && TOPIC_BY_ID[topicId].raw_topics[0]) || topicId;
        formulas.push({
          id: cf.id,
          name: cf.name || "未命名本地公式",
          aliases: Array.isArray(cf.aliases) ? cf.aliases : [],
          node_kind: cf.node_kind || "formula",
          latex: cf.latex || "y = f(x)",
          statement: cf.statement || "",
          intuition: cf.intuition || "",
          worked_example: cf.worked_example || "",
          conditions: Array.isArray(cf.conditions) && cf.conditions.length ? cf.conditions : ["常规实数域或题设条件"],
          applications: Array.isArray(cf.applications) ? cf.applications : [],
          variables: Array.isArray(cf.variables) ? cf.variables : [],
          taxonomy: {
            education_stages: [cf.stage || "undergraduate"],
            disciplines: [discId],
            topics: [rawTopic]
          },
          review: {
            status: "verified",
            source: cf.source || "本地个人工作区"
          },
          _local_status: "custom"
        });
        appendCustomLinks(cf.id, cf.custom_links);
      });

      MASTER_GRAPH.formulas = formulas;
      MASTER_GRAPH.derivations = derivs;
      recomputeFormulaGraphIndexes();
      updateLocalWorkspaceBadges();
    }

    function updateLocalWorkspaceBadges() {
      const total = Object.keys(localPatch.overrides || {}).length + (localPatch.custom_formulas || []).length;
      const el = document.getElementById("localWsCnt");
      if (el) {
        el.textContent = String(total);
        el.style.display = total > 0 ? "inline-flex" : "none";
      }
    }

    function populateLocalEditorSelects() {
      const kindSel = document.getElementById("fgLeKind");
      const stageSel = document.getElementById("fgLeStage");
      const discSel = document.getElementById("fgLeDisc");
      const topicSel = document.getElementById("fgLeTopic");
      if (kindSel && !kindSel.options.length) {
        kindSel.innerHTML = NODE_KIND_LIST.map(x => `<option value="${escapeHTML(x.id)}">${escapeHTML(x.label)}</option>`).join("");
      }
      if (stageSel && !stageSel.options.length) {
        stageSel.innerHTML = STAGE_LIST.map(x => `<option value="${escapeHTML(x.id)}">${escapeHTML(x.label)}</option>`).join("");
      }
      if (discSel && !discSel.options.length) {
        discSel.innerHTML = TAXONOMY.disciplines.map(x => `<option value="${escapeHTML(x.id)}">${escapeHTML(x.label)}</option>`).join("");
      }
      if (topicSel && !topicSel.options.length) {
        topicSel.innerHTML = Object.values(TOPIC_BY_ID).map(tp =>
          `<option value="${escapeHTML(tp.id)}">${escapeHTML(tp.branchLabel)} · ${escapeHTML(tp.label)}</option>`
        ).join("");
      }
      const dl = document.getElementById("localFormulaDatalist");
      if (dl) {
        dl.innerHTML = MASTER_GRAPH.formulas.map(f => `<option value="${escapeHTML(f.id)} | ${escapeHTML(f.name)}"></option>`).join("");
      }
    }

    function openLocalWorkspaceModal() {
      renderLocalWorkspaceModal();
      document.getElementById("localWorkspaceModal").classList.add("open");
    }
    function closeLocalWorkspaceModal() {
      document.getElementById("localWorkspaceModal").classList.remove("open");
    }

    function renderLocalWorkspaceModal() {
      const ovEntries = Object.entries(localPatch.overrides || {});
      const customs = localPatch.custom_formulas || [];
      const customLinkCount = ovEntries.reduce((s, [, ov]) => s + ((ov.custom_links || []).length), 0)
        + customs.reduce((s, c) => s + ((c.custom_links || []).length), 0);
      document.getElementById("localWsSummary").innerHTML = `
        <span>本地修订：<strong>${ovEntries.length}</strong> 项 · 本地新增：<strong>${customs.length}</strong> 项 · 自定义推导：<strong>${customLinkCount}</strong> 条</span>
        <span>存储引擎：<strong>${localStorageBackend}</strong>${localPatch.updated_at ? ` · 最近保存 ${localPatch.updated_at.slice(0, 16).replace("T", " ")}` : ""}</span>
      `;
      const listEl = document.getElementById("localWsList");
      if (!ovEntries.length && !customs.length) {
        listEl.innerHTML = `<div style="text-align:center; padding:28px 12px; color:var(--ink-muted); font-size:13px;">当前尚未创建本地修订或自定义公式。<br>可在任意公式详情点击「✎ 本地编辑」，或点击上方「＋ 新增本地公式」扩展个人知识图谱。</div>`;
        return;
      }
      const items = [];
      customs.forEach(cf => {
        items.push(`
          <div class="local-item-card">
            <div class="local-item-main">
              <div class="local-item-title"><span class="pill local-new">🏷 本地新增</span><span>${escapeHTML(cf.name)}</span></div>
              <div class="local-item-meta">${escapeHTML(cf.id)} · ${escapeHTML(NODE_KIND_LABELS[cf.node_kind] || "公式")} · ${(cf.custom_links || []).length} 条自定义推导</div>
            </div>
            <div class="local-item-actions">
              <button type="button" class="mini-btn" onclick="jumpToLocalFormula('${escapeHTML(cf.id)}')">定位</button>
              <button type="button" class="mini-btn primary" onclick="openLocalEditorModal('${escapeHTML(cf.id)}')">编辑</button>
              <button type="button" class="mini-btn danger" onclick="deleteCustomLocalFormula('${escapeHTML(cf.id)}')">删除</button>
            </div>
          </div>
        `);
      });
      ovEntries.forEach(([k, ov]) => {
        const fid = ov.formula_id || k;
        const f = formulaById[fid];
        const name = (ov.fields && ov.fields.name) || (f ? f.name : ov.anchor_name) || fid;
        items.push(`
          <div class="local-item-card">
            <div class="local-item-main">
              <div class="local-item-title"><span class="pill local-mod">🏷 本地修订</span><span>${escapeHTML(name)}</span></div>
              <div class="local-item-meta">官方 ID: ${escapeHTML(fid)} · ${(ov.custom_links || []).length} 条自定义推导</div>
            </div>
            <div class="local-item-actions">
              ${f ? `<button type="button" class="mini-btn" onclick="jumpToLocalFormula('${escapeHTML(fid)}')">定位</button>` : ""}
              <button type="button" class="mini-btn primary" onclick="openLocalEditorModal('${escapeHTML(fid)}')">编辑</button>
              <button type="button" class="mini-btn danger" onclick="restoreOfficialFormula('${escapeHTML(fid)}')">还原官方版</button>
            </div>
          </div>
        `);
      });
      listEl.innerHTML = items.join("");
    }

    function jumpToLocalFormula(fid) {
      closeLocalWorkspaceModal();
      if (!formulaById[fid]) return;
      state.stageFilter = "all";
      state.disciplineFilter = "all";
      state.branchFilter = "all";
      state.topicFilter = "all";
      state.kindFilter = "all";
      state.searchQuery = "";
      const sInp = document.getElementById("searchInput");
      if (sInp) sInp.value = "";
      syncCascadingDropdowns();
      state.selectedFormulaId = fid;
      generateDynamicView(false);
    }

    function openLocalEditorModal(fid) {
      closeLocalWorkspaceModal();
      populateLocalEditorSelects();
      const isNew = !fid;
      const isCustom = !isNew && fid.startsWith("local_formula_");
      const f = isNew ? null : formulaById[fid];
      localEditorState = { mode: isNew ? "create" : (isCustom ? "edit_custom" : "edit_official"), formulaId: isNew ? null : fid };

      document.getElementById("localEditorTitle").textContent = isNew
        ? "＋ 新增本地公式 / 定理（挂接推导图谱）"
        : (isCustom ? `✎ 编辑本地新增对象（${fid}）` : `✎ 本地修订官方对象（${fid}）`);
      const banner = document.getElementById("localEditorBanner");
      if (localEditorState.mode === "edit_official") {
        banner.style.display = "block";
        banner.textContent = "提示：所有修订仅保存在本机工作区，不覆盖官方原件；可随时点击左下角「↺ 还原官方版」恢复。";
      } else {
        banner.style.display = "none";
      }

      document.getElementById("fgLeName").value = f ? (f.name || "") : "";
      document.getElementById("fgLeAliases").value = f ? ((f.aliases || []).join(" / ")) : "";
      document.getElementById("fgLeKind").value = f ? (f.node_kind || "formula") : "formula";
      document.getElementById("fgLeLatex").value = f ? (f.latex || "") : "";
      document.getElementById("fgLeStatement").value = f ? (f.statement || "") : "";
      document.getElementById("fgLeStage").value = f ? (f._primaryStage || "undergraduate") : (state.stageFilter === "all" ? "undergraduate" : state.stageFilter);
      document.getElementById("fgLeDisc").value = f ? ((f.taxonomy && f.taxonomy.disciplines && f.taxonomy.disciplines[0]) || "mathematics") : (state.disciplineFilter === "all" ? "mathematics" : state.disciplineFilter);
      const topicVal = f && f._primaryTopic && TOPIC_BY_ID[f._primaryTopic] ? f._primaryTopic : (Object.keys(TOPIC_BY_ID)[0] || "");
      if (topicVal) document.getElementById("fgLeTopic").value = topicVal;
      document.getElementById("fgLeConditions").value = f ? ((f.conditions || []).join("；")) : "";
      document.getElementById("fgLeIntuition").value = f ? (f.intuition || "") : "";
      document.getElementById("fgLeExample").value = f ? (f.worked_example || "") : "";
      document.getElementById("fgLeSource").value = f ? ((f.review && f.review.source) || "") : "本地个人工作区";

      document.getElementById("leRestoreBtn").style.display = (localEditorState.mode === "edit_official" && localPatch.overrides[fid]) ? "inline-flex" : "none";
      document.getElementById("leDeleteBtn").style.display = isCustom ? "inline-flex" : "none";

      const linksEl = document.getElementById("leLinksList");
      linksEl.innerHTML = "";
      let existingLinks = [];
      if (isCustom) {
        const cf = (localPatch.custom_formulas || []).find(x => x.id === fid);
        existingLinks = (cf && cf.custom_links) ? cf.custom_links : [];
      } else if (!isNew) {
        const ov = localPatch.overrides[fid];
        existingLinks = (ov && ov.custom_links) ? ov.custom_links : [];
      }
      existingLinks.forEach(lk => addEditorLinkRow(lk));

      document.getElementById("localEditorModal").classList.add("open");
    }

    function closeLocalEditorModal() {
      document.getElementById("localEditorModal").classList.remove("open");
    }

    function addEditorLinkRow(lk = null) {
      const listEl = document.getElementById("leLinksList");
      const row = document.createElement("div");
      row.className = "local-link-row";
      const tf = lk && lk.target_formula_id && formulaById[lk.target_formula_id] ? formulaById[lk.target_formula_id] : null;
      const targetVal = tf ? `${tf.id} | ${tf.name}` : (lk && lk.target_formula_id ? lk.target_formula_id : "");
      const relOpts = Object.keys(REL_LABELS).map(k => `<option value="${k}" ${(lk && lk.relation_type === k) ? "selected" : ""}>${REL_LABELS[k]}</option>`).join("");
      row.innerHTML = `
        <select class="le-link-dir">
          <option value="out" ${(!lk || lk.dir !== "in") ? "selected" : ""}>本对象 → 目标</option>
          <option value="in" ${(lk && lk.dir === "in") ? "selected" : ""}>目标 → 本对象</option>
        </select>
        <input type="text" class="le-link-target" list="localFormulaDatalist" placeholder="搜索并选择目标公式..." value="${escapeHTML(targetVal)}" />
        <select class="le-link-kind">${relOpts}</select>
        <input type="text" class="le-link-note" placeholder="推导/关系说明（可选）" value="${escapeHTML((lk && lk.note) || "")}" />
        <button type="button" class="mini-btn danger" onclick="this.closest('.local-link-row').remove()">移除</button>
      `;
      listEl.appendChild(row);
    }

    function collectEditorLinks() {
      const out = [];
      document.querySelectorAll("#leLinksList .local-link-row").forEach(row => {
        const raw = (row.querySelector(".le-link-target").value || "").trim();
        if (!raw) return;
        let tid = null;
        const sepIdx = raw.indexOf("|");
        if (sepIdx > 0) tid = raw.slice(0, sepIdx).trim();
        else if (formulaById[raw]) tid = raw;
        else {
          const hit = MASTER_GRAPH.formulas.find(x => x.name === raw);
          if (hit) tid = hit.id;
        }
        if (!tid || !formulaById[tid]) return;
        out.push({
          dir: row.querySelector(".le-link-dir").value || "out",
          target_formula_id: tid,
          relation_type: row.querySelector(".le-link-kind").value || "derives_to",
          note: (row.querySelector(".le-link-note").value || "").trim()
        });
      });
      return out;
    }

    async function saveLocalEditorForm(ev) {
      ev.preventDefault();
      const name = (document.getElementById("fgLeName").value || "").trim();
      const latex = (document.getElementById("fgLeLatex").value || "").trim();
      if (!name || !latex) { showLocalToast("请填写名称与 LaTeX 公式表达式"); return; }
      const topicId = document.getElementById("fgLeTopic").value;
      const rawTopic = (TOPIC_BY_ID[topicId] && TOPIC_BY_ID[topicId].raw_topics && TOPIC_BY_ID[topicId].raw_topics[0]) || topicId;
      const fields = {
        name,
        aliases: (document.getElementById("fgLeAliases").value || "").split(/[/／,，]/).map(s => s.trim()).filter(Boolean),
        node_kind: document.getElementById("fgLeKind").value || "formula",
        latex,
        statement: (document.getElementById("fgLeStatement").value || "").trim(),
        stage: document.getElementById("fgLeStage").value || "undergraduate",
        discipline: document.getElementById("fgLeDisc").value || "mathematics",
        topic: rawTopic,
        conditions: (document.getElementById("fgLeConditions").value || "").split(/[;；\n]/).map(s => s.trim()).filter(Boolean),
        intuition: (document.getElementById("fgLeIntuition").value || "").trim(),
        worked_example: (document.getElementById("fgLeExample").value || "").trim(),
        source: (document.getElementById("fgLeSource").value || "").trim() || "本地个人工作区"
      };
      const customLinks = collectEditorLinks();
      let targetId = localEditorState.formulaId;

      if (localEditorState.mode === "create") {
        targetId = `local_formula_${localPatch.next_custom_seq++}`;
        localPatch.custom_formulas.push({
          id: targetId,
          ...fields,
          topic: topicId,
          custom_links: customLinks,
          updated_at: new Date().toISOString()
        });
      } else if (localEditorState.mode === "edit_custom") {
        const idx = localPatch.custom_formulas.findIndex(x => x.id === targetId);
        if (idx >= 0) {
          localPatch.custom_formulas[idx] = {
            ...localPatch.custom_formulas[idx],
            ...fields,
            topic: topicId,
            custom_links: customLinks,
            updated_at: new Date().toISOString()
          };
        }
      } else {
        const orig = OFFICIAL_FORMULAS_BASE.find(x => x.id === targetId);
        localPatch.overrides[targetId] = {
          formula_id: targetId,
          anchor_name: orig ? orig.name : name,
          fields,
          custom_links: customLinks,
          updated_at: new Date().toISOString()
        };
      }

      applyLocalPatchToRuntime();
      await saveLocalPatchToStore(localPatch);
      closeLocalEditorModal();
      state.selectedFormulaId = targetId;
      syncCascadingDropdowns();
      generateDynamicView(false);
      showLocalToast(localEditorState.mode === "create" ? "已新增本地对象并挂接至图谱" : "已保存本地修订");
    }

    async function restoreOfficialFormula(fid) {
      if (!localPatch.overrides[fid]) return;
      if (!confirm("确定丢弃该对象的所有本地修订并还原为官方原版？")) return;
      delete localPatch.overrides[fid];
      applyLocalPatchToRuntime();
      await saveLocalPatchToStore(localPatch);
      closeLocalEditorModal();
      renderLocalWorkspaceModal();
      syncCascadingDropdowns();
      generateDynamicView(false);
      showLocalToast("已还原为官方原版");
    }

    function restoreCurrentEditorFormula() {
      if (localEditorState.formulaId) restoreOfficialFormula(localEditorState.formulaId);
    }

    async function deleteCustomLocalFormula(fid) {
      if (!confirm("确定从本地工作区删除该自定义公式？")) return;
      localPatch.custom_formulas = (localPatch.custom_formulas || []).filter(x => x.id !== fid);
      applyLocalPatchToRuntime();
      await saveLocalPatchToStore(localPatch);
      closeLocalEditorModal();
      if (state.selectedFormulaId === fid) state.selectedFormulaId = MASTER_GRAPH.formulas[0]?.id || null;
      renderLocalWorkspaceModal();
      syncCascadingDropdowns();
      generateDynamicView(false);
      showLocalToast("已删除本地自定义对象");
    }

    function deleteCurrentEditorFormula() {
      if (localEditorState.formulaId) deleteCustomLocalFormula(localEditorState.formulaId);
    }

    function exportLocalPatch() {
      const payload = { ...localPatch, exported_at: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      a.href = url;
      a.download = `formula-graph-workspace-patch-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showLocalToast("已导出个人工作区 JSON 补丁包");
    }

    function triggerImportLocalPatch(mode) {
      localImportMode = mode || "merge";
      const inp = document.getElementById("localPatchFileInput");
      inp.value = "";
      inp.click();
    }

    async function handleImportLocalPatchFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed || typeof parsed !== "object" || (!parsed.overrides && !parsed.custom_formulas)) {
          showLocalToast("补丁文件格式无效：缺少 overrides 或 custom_formulas");
          return;
        }
        const incoming = normalizeLocalPatch(parsed);
        if (localImportMode === "replace") {
          localPatch = incoming;
        } else {
          Object.assign(localPatch.overrides, incoming.overrides);
          const m = new Map(localPatch.custom_formulas.map(x => [x.id, x]));
          incoming.custom_formulas.forEach(cf => m.set(cf.id, cf));
          localPatch.custom_formulas = Array.from(m.values());
          localPatch.next_custom_seq = Math.max(localPatch.next_custom_seq, incoming.next_custom_seq);
        }
        applyLocalPatchToRuntime();
        await saveLocalPatchToStore(localPatch);
        renderLocalWorkspaceModal();
        syncCascadingDropdowns();
        generateDynamicView(false);
        showLocalToast(localImportMode === "replace" ? "已覆盖导入补丁包" : "已合并导入补丁包");
      } catch (_) {
        showLocalToast("导入失败：JSON 解析异常");
      }
    }

    async function clearAllLocalChanges() {
      const ovC = Object.keys(localPatch.overrides || {}).length;
      const cfC = (localPatch.custom_formulas || []).length;
      if (!ovC && !cfC) { showLocalToast("当前没有本地改动"); return; }
      if (!confirm(`确定清空全部 ${ovC} 项本地修订与 ${cfC} 项本地新增对象？建议先导出 JSON 补丁包备份。`)) return;
      localPatch = createEmptyLocalPatch();
      applyLocalPatchToRuntime();
      await saveLocalPatchToStore(localPatch);
      renderLocalWorkspaceModal();
      syncCascadingDropdowns();
      generateDynamicView(false);
      showLocalToast("已清空全部本地改动并还原官方基线");
    }

    async function initLocalWorkspace() {
      const fileInp = document.getElementById("localPatchFileInput");
      if (fileInp) fileInp.addEventListener("change", handleImportLocalPatchFile);
      ["localWorkspaceModal", "localEditorModal"].forEach(mid => {
        const m = document.getElementById(mid);
        if (m) m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("open"); });
      });
      localPatch = await loadLocalPatchFromStore();
      const hasLocal = Object.keys(localPatch.overrides || {}).length > 0 || (localPatch.custom_formulas || []).length > 0;
      updateLocalWorkspaceBadges();
      if (hasLocal) {
        applyLocalPatchToRuntime();
        syncCascadingDropdowns();
        generateDynamicView(false);
      }
    }

    generateDynamicView(false);
    applyDeviceMode(true);
    initLocalWorkspace();
  </script>
</body>
</html>
