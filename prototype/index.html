    function renderMathHTML(latex) {
      if (window.katex && typeof window.katex.renderToString === "function") {
        try { return window.katex.renderToString(latex, { throwOnError: false, displayMode: false }); } catch (e) {}
      }
      let s = latex
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\mathbb\{R\}/g, "ℝ").replace(/\\mathbb\{Z\}\^\+/g, "ℤ⁺")
        .replace(/\\setminus/g, "\\").replace(/\\cup/g, "∪").replace(/\\cap/g, "∩")
        .replace(/\\left|\\right/g, "")
        .replace(/\\implies/g, "⇒").replace(/\\iff/g, "⇔")
        .replace(/\\xrightarrow\{([^}]*)\}/g, " → ")
        .replace(/\\lim_\{([^}]*)\}/g, "lim<sub>$1</sub>")
        .replace(/\\sum_\{([^}]*)\}\^\{([^}]*)\}/g, "∑<sub>$1</sub><sup>$2</sup>")
        .replace(/\\sum_\{([^}]*)\}/g, "∑<sub>$1</sub>").replace(/\\sum/g, "∑")
        .replace(/\\binom\{([^}]+)\}\{([^}]+)\}/g, "C($1,$2)")
        .replace(/\\bar\{([^}]+)\}/g, "$1̄")
        .replace(/\\to/g, "→").replace(/\\cdots|\\dots/g, "⋯").replace(/\\mid/g, "|").replace(/\\sim/g, "~")
        .replace(/\\quad|\\ /g, "&nbsp;")
        .replace(/\\cdot/g, "·").replace(/\\times/g, "×").replace(/\\%/g, "%")
        .replace(/\\neq/g, "≠").replace(/\\pm/g, "±").replace(/\\le/g, "≤").replace(/\\ge/g, "≥").replace(/\\infty/g, "∞")
        .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\varphi/g, "φ").replace(/\\pi/g, "π")
        .replace(/\\sigma/g, "σ").replace(/\\mu/g, "μ").replace(/\\Phi/g, "Φ").replace(/\\Omega/g, "Ω")
        .replace(/\\Delta/g, "Δ").replace(/\\rho/g, "ρ").replace(/\\eta/g, "η").replace(/\\omega/g, "ω")
        .replace(/\\sin/g, "sin").replace(/\\cos/g, "cos").replace(/\\tan/g, "tan").replace(/\\ln/g, "ln").replace(/\\log/g, "log")
        .replace(/\\sqrt\{([^}]+)\}/g, "√($1)")
        .replace(/\^2/g, "²")
        .replace(/_\{([^}]+)\}/g, "<sub>$1</sub>").replace(/_([0-9a-z])/g, "<sub>$1</sub>")
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '<span class="math-frac"><span>$1</span><span>$2</span></span>');
      return `<span class="math-fallback">${s}</span>`;
    }

    function getDirectRelations(formulaId, derivPool = MASTER_GRAPH.derivations) {
      const upstream = [], downstream = [], equiv = [], counter = [];
      derivPool.forEach(d => {
        const isFrom = d.from_formula_ids.includes(formulaId);
        const isTo = d.to_formula_id === formulaId;
        if (!isFrom && !isTo) return;
        if (d.relation_type === "counterexample_to") {
          (isTo ? d.from_formula_ids : [d.to_formula_id]).forEach(oid => counter.push({ formula: formulaById[oid], deriv: d, dir: isTo ? "in" : "out" }));
        } else if (d.relation_type === "equivalent_to" || d.relation_type === "dual_of") {
          (isTo ? d.from_formula_ids : [d.to_formula_id]).forEach(oid => equiv.push({ formula: formulaById[oid], deriv: d }));
        } else if (isTo) {
          d.from_formula_ids.forEach(oid => upstream.push({ formula: formulaById[oid], deriv: d }));
        } else if (isFrom) {
          downstream.push({ formula: formulaById[d.to_formula_id], deriv: d });
        }
      });
      return { upstream, downstream, equiv, counter };
    }

    function findShortestPath(startId, endId, derivPool, undirectedFallback = false) {
      if (startId === endId) return { nodeIds: new Set([startId]), derivIds: new Set(), orderedFormulaIds: [startId], orderedDerivIds: [], undirected: false };
      const runBFS = (allowReverse) => {
        const queue = [{ id: startId, pathNodes: [startId], pathDerivs: [] }];
        const visited = new Set([startId]);
        while (queue.length > 0) {
          const cur = queue.shift();
          for (const d of derivPool) {
            const nextCandidates = [];
            if (d.from_formula_ids.includes(cur.id)) nextCandidates.push(d.to_formula_id);
            if ((d.bidirectional || allowReverse) && d.to_formula_id === cur.id) {
              d.from_formula_ids.forEach(fid => nextCandidates.push(fid));
            }
            for (const nxt of nextCandidates) {
              if (visited.has(nxt)) continue;
              const newNodes = [...cur.pathNodes, nxt];
              const newDerivs = [...cur.pathDerivs, d.id];
              if (nxt === endId) return { nodeIds: new Set(newNodes), derivIds: new Set(newDerivs), orderedFormulaIds: newNodes, orderedDerivIds: newDerivs, undirected: allowReverse };
              visited.add(nxt);
              queue.push({ id: nxt, pathNodes: newNodes, pathDerivs: newDerivs });
            }
          }
        }
        return null;
      };
      return runBFS(false) || (undirectedFallback ? runBFS(true) : null);
    }

    // 级联过滤：阶段 -> 学科 -> 分支 -> 专题 -> 类型
    function filterByStage(list) {
      return state.stageFilter === "all" ? list : list.filter(f => f.taxonomy.education_stages.includes(state.stageFilter));
    }
    function filterByDisc(list) {
      return state.discFilter === "all" ? list : list.filter(f => f.taxonomy.disciplines.includes(state.discFilter));
    }
    function filterByBranch(list) {
      return state.branchFilter === "all" ? list : list.filter(f => f._branches.has(state.branchFilter));
    }
    function filterByTopic(list) {
      return state.topicFilter === "all" ? list : list.filter(f => f._canonicalTopics.has(state.topicFilter));
    }
    function filterByKind(list) {
      return state.kindFilter === "all" ? list : list.filter(f => f._kind === state.kindFilter);
    }

    function setStageFilter(val) {
      state.stageFilter = val;
      syncCascadingDropdowns();
      generateDynamicView(true);
    }

    function syncCascadingDropdowns() {
      const all = MASTER_GRAPH.formulas;

      // 1. 阶段分段标签
      const pillsEl = document.getElementById("stagePills");
      const stageItems = [{ id: "all", label: "全部阶段", cnt: all.length }];
      STAGE_LIST.forEach(st => {
        const cnt = all.filter(f => f.taxonomy.education_stages.includes(st.id)).length;
        if (cnt > 0) stageItems.push({ id: st.id, label: st.label, cnt });
      });
      if (!stageItems.some(x => x.id === state.stageFilter)) state.stageFilter = "all";
      pillsEl.innerHTML = stageItems.map(item => `
        <button type="button" class="stage-pill ${state.stageFilter === item.id ? "active" : ""}" onclick="setStageFilter('${item.id}')">
          <span>${item.label}</span>
          <span class="stage-pill-cnt">${item.cnt}</span>
        </button>
      `).join("");

      // 2. 学科
      const afterStage = filterByStage(all);
      const discSel = document.getElementById("discSelect");
      discSel.innerHTML = `<option value="all">全部（${afterStage.length}）</option>`;
      TAXONOMY.disciplines.forEach(d => {
        const cnt = afterStage.filter(f => f.taxonomy.disciplines.includes(d.id)).length;
        if (cnt > 0) discSel.add(new Option(`${d.label}（${cnt}）`, d.id));
      });
      if (![...discSel.options].some(o => o.value === state.discFilter)) state.discFilter = "all";
      discSel.value = state.discFilter;
      document.getElementById("discField").classList.toggle("active-filter", state.discFilter !== "all");

      // 3. 分支
      const afterDisc = filterByDisc(afterStage);
      const branchSel = document.getElementById("branchSelect");
      branchSel.innerHTML = `<option value="all">全部（${afterDisc.length}）</option>`;
      const activeDiscs = state.discFilter === "all"
        ? TAXONOMY.disciplines
        : TAXONOMY.disciplines.filter(d => d.id === state.discFilter);

      activeDiscs.forEach(d => {
        const validBranches = d.branches
          .map(br => ({ br, cnt: afterDisc.filter(f => f._branches.has(br.id)).length }))
          .filter(x => x.cnt > 0);
        if (!validBranches.length) return;
        if (activeDiscs.length > 1) {
          const grp = document.createElement("optgroup");
          grp.label = d.label;
          validBranches.forEach(({ br, cnt }) => grp.appendChild(new Option(`${br.label}（${cnt}）`, br.id)));
          branchSel.appendChild(grp);
        } else {
          validBranches.forEach(({ br, cnt }) => branchSel.add(new Option(`${br.label}（${cnt}）`, br.id)));
        }
      });
      if (![...branchSel.options].some(o => o.value === state.branchFilter)) state.branchFilter = "all";
      branchSel.value = state.branchFilter;
      document.getElementById("branchField").classList.toggle("active-filter", state.branchFilter !== "all");

      // 4. 专题
      const afterBranch = filterByBranch(afterDisc);
      const topicSel = document.getElementById("topicSelect");
      topicSel.innerHTML = `<option value="all">全部（${afterBranch.length}）</option>`;
      const candidateBranches = [];
      activeDiscs.forEach(d => {
        d.branches.forEach(br => {
          if (state.branchFilter === "all" || br.id === state.branchFilter) candidateBranches.push(br);
        });
      });
      candidateBranches.forEach(br => {
        const validTopics = br.topics
          .map(tp => ({ tp, cnt: afterBranch.filter(f => f._canonicalTopics.has(tp.id)).length }))
          .filter(x => x.cnt > 0);
        if (!validTopics.length) return;
        if (state.branchFilter === "all") {
          const grp = document.createElement("optgroup");
          grp.label = br.label;
          validTopics.forEach(({ tp, cnt }) => grp.appendChild(new Option(`${tp.label}（${cnt}）`, tp.id)));
          topicSel.appendChild(grp);
        } else {
          validTopics.forEach(({ tp, cnt }) => topicSel.add(new Option(`${tp.label}（${cnt}）`, tp.id)));
        }
      });
      if (![...topicSel.options].some(o => o.value === state.topicFilter)) state.topicFilter = "all";
      topicSel.value = state.topicFilter;
      document.getElementById("topicField").classList.toggle("active-filter", state.topicFilter !== "all");

      // 5. 对象类型（node_kind：公式/定义/定理/定律/分布/不等式/公理）
      const afterTopic = filterByTopic(afterBranch);
      const kindSel = document.getElementById("kindSelect");
      kindSel.innerHTML = `<option value="all">全部（${afterTopic.length}）</option>`;
      NODE_KIND_LIST.forEach(k => {
        const cnt = afterTopic.filter(f => f._kind === k.id).length;
        if (cnt > 0) kindSel.add(new Option(`${k.label}（${cnt}）`, k.id));
      });
      if (![...kindSel.options].some(o => o.value === state.kindFilter)) state.kindFilter = "all";
      kindSel.value = state.kindFilter;
      document.getElementById("kindField").classList.toggle("active-filter", state.kindFilter !== "all");
    }

    function computeTopoDepths(nodeIds, derivations) {
      const indeg = {};
      const adj = {};
      nodeIds.forEach(id => { indeg[id] = 0; adj[id] = new Set(); });
      derivations.forEach(d => {
        if (!nodeIds.has(d.to_formula_id)) return;
        d.from_formula_ids.forEach(fid => {
          if (nodeIds.has(fid) && fid !== d.to_formula_id && !adj[fid].has(d.to_formula_id)) {
            adj[fid].add(d.to_formula_id);
            indeg[d.to_formula_id] += 1;
          }
        });
      });
      const depth = {};
      const q = [];
      nodeIds.forEach(id => { if (indeg[id] === 0) { depth[id] = 0; q.push(id); } });
      while (q.length > 0) {
        const u = q.shift();
        adj[u].forEach(v => {
          depth[v] = Math.max(depth[v] || 0, (depth[u] || 0) + 1);
          indeg[v] -= 1;
          if (indeg[v] === 0) q.push(v);
        });
      }
      nodeIds.forEach(id => { if (depth[id] === undefined) depth[id] = 1; });
      return depth;
    }

    // 聚焦模式交互式图例筛选条
    function setFocusRelFilter(val) {
      state.focusRelFilter = (state.focusRelFilter === val && val !== "all") ? "all" : val;
      generateDynamicView(true, { keepSelected: true });
    }

    function renderGraphLegendBar(isFocus, rel) {
      const el = document.getElementById("graphLegendFilters");
      if (!el) return;
      if (!isFocus || !rel) {
        el.innerHTML = `
          <span class="legend-item"><span class="dot" style="background:var(--primary)"></span>当前选中</span>
          <span class="legend-item"><span class="dot" style="background:var(--upstream)"></span>前置依赖</span>
          <span class="legend-item"><span class="dot" style="background:var(--downstream)"></span>直接衍生</span>
          <span class="legend-item"><span class="dot" style="background:var(--equiv)"></span>等价 / 对偶</span>
          <span class="legend-item"><span class="dot" style="background:var(--counter)"></span>反例 / 失效边界</span>
          <span class="legend-item" style="color:var(--ink-muted)">虚线边 = 跨界应用或反例 · 虚框卡 = 跨界桥梁</span>
        `;
        return;
      }
      const totalNeighbors = new Set([
        ...rel.upstream.map(x => x.formula.id),
        ...rel.downstream.map(x => x.formula.id),
        ...rel.equiv.map(x => x.formula.id),
        ...rel.counter.map(x => x.formula.id)
      ]).size;

      const pills = [
        { id: "all", label: `全部关联 ${totalNeighbors}`, color: null, cnt: totalNeighbors },
        { id: "upstream", label: `前置依赖 ${rel.upstream.length}`, color: "var(--upstream)", cnt: rel.upstream.length },
        { id: "downstream", label: `直接衍生 ${rel.downstream.length}`, color: "var(--downstream)", cnt: rel.downstream.length },
        { id: "equiv", label: `等价/对偶 ${rel.equiv.length}`, color: "var(--equiv)", cnt: rel.equiv.length },
        { id: "counter", label: `反例/失效 ${rel.counter.length}`, color: "var(--counter)", cnt: rel.counter.length }
      ];

      el.innerHTML = pills
        .filter(p => p.id === "all" || p.cnt > 0)
        .map(p => `
          <button type="button" class="focus-filter-pill ${state.focusRelFilter === p.id ? "active" : ""}" onclick="setFocusRelFilter('${p.id}')">
            ${p.color ? `<span class="dot" style="background:${p.color}"></span>` : ""}${p.label}
          </button>
        `).join("") + (state.focusRelFilter !== "all"
          ? `<button type="button" class="mini-btn" onclick="setFocusRelFilter('all')">清除筛选</button>`
          : "");
    }

    // 核心：动态视图生成引擎（支持「聚焦关联」「全局总览」「卡片目录」三视角协同）
    function generateDynamicView(autoFit = false, opts = {}) {
      let matched = filterByKind(filterByTopic(filterByBranch(filterByDisc(filterByStage(MASTER_GRAPH.formulas)))));
      const q = state.searchQuery.trim();
      const parsedQ = parseSearchQuery(q);
      const hasQ = parsedQ.groups.length > 0;

      if (hasQ) {
        matched = matched.filter(f => getMatchMask(f._fullSearch, parsedQ.groups) === parsedQ.allMask);
      }

      const coreIds = new Set(matched.map(f => f.id));
      const bridgeIds = new Set();
      const isSubset = coreIds.size > 0 && coreIds.size < MASTER_GRAPH.formulas.length;

      // 自动定位焦点：除非明确 keepSelected，否则当原焦点不在新筛选集中时切换至连接度最高对象
      if (coreIds.size > 0 && !opts.keepSelected && (!state.selectedFormulaId || !coreIds.has(state.selectedFormulaId))) {
        const best = matched.slice().sort((a, b) => b._degree - a._degree)[0];
        state.selectedFormulaId = best.id;
        state.activePath = null;
        document.getElementById("clearPathBtn").style.display = "none";
      }

      const isFocus = state.viewMode === "focus";
      const isGlobal = state.viewMode === "global";
      const isDir = state.viewMode === "directory";

      document.getElementById("canvasPane").dataset.view = state.viewMode;
      document.getElementById("focusModeBtn").classList.toggle("active", isFocus);
      document.getElementById("globalModeBtn").classList.toggle("active", isGlobal);
      document.getElementById("dirModeBtn").classList.toggle("active", isDir);
      document.getElementById("globalModeBtn").textContent = `🌐 全局总览（${coreIds.size}）`;
      document.getElementById("dirModeBtn").textContent = `📋 卡片目录（${coreIds.size}）`;

      document.getElementById("layoutField").style.display = isGlobal ? "inline-flex" : "none";
      document.getElementById("densityField").style.display = isGlobal ? "inline-flex" : "none";
      document.getElementById("bridgeBtn").style.display = isGlobal ? "inline-flex" : "none";
      document.getElementById("dirSortField").style.display = isDir ? "inline-flex" : "none";
      document.getElementById("zoomControls").style.display = isDir ? "none" : "inline-flex";

      const hasFilter = state.stageFilter !== "all" || state.discFilter !== "all" ||
        state.branchFilter !== "all" || state.topicFilter !== "all" || state.kindFilter !== "all" || hasQ;
      document.getElementById("resetBtn").classList.toggle("active", hasFilter);
      const countBadge = document.getElementById("searchCountBadge");
      if (countBadge) {
        countBadge.textContent = hasFilter ? `匹配 ${coreIds.size}/${MASTER_GRAPH.formulas.length}` : `${MASTER_GRAPH.formulas.length} 项`;
        countBadge.classList.toggle("filtered", hasFilter);
      }

      const { colGap, rowGap } = DENSITY_CFG[state.density] || DENSITY_CFG.standard;
      let activeIds = new Set();
      let visibleFormulas = [];
      let visibleDerivations = [];
      const positions = {};
      const lanes = [];
      let stageW = 900;
      let stageH = 420;
      let effectiveMode = isFocus ? "focus" : state.layoutMode;

      if (isFocus && state.selectedFormulaId && formulaById[state.selectedFormulaId] && (coreIds.size > 0 || opts.keepSelected)) {
        const selId = state.selectedFormulaId;
        const rel = getDirectRelations(selId, MASTER_GRAPH.derivations);

        // 防空画布自动复位保护
        if (state.focusRelFilter === "upstream" && rel.upstream.length === 0) state.focusRelFilter = "all";
        else if (state.focusRelFilter === "downstream" && rel.downstream.length === 0) state.focusRelFilter = "all";
        else if (state.focusRelFilter === "equiv" && rel.equiv.length === 0) state.focusRelFilter = "all";
        else if (state.focusRelFilter === "counter" && rel.counter.length === 0) state.focusRelFilter = "all";

        renderGraphLegendBar(true, rel);

        const upIds = [];
        const rightIds = [];
        const parallelIds = [];
        const seenNeighbors = new Set([selId]);
        const allowedDerivIds = new Set();

        const includeUp = state.focusRelFilter === "all" || state.focusRelFilter === "upstream";
        const includeDown = state.focusRelFilter === "all" || state.focusRelFilter === "downstream";
        const includeEquiv = state.focusRelFilter === "all" || state.focusRelFilter === "equiv";
        const includeCounter = state.focusRelFilter === "all" || state.focusRelFilter === "counter";

        if (includeUp) {
          rel.upstream.forEach(r => {
            allowedDerivIds.add(r.deriv.id);
            if (!seenNeighbors.has(r.formula.id)) {
              seenNeighbors.add(r.formula.id);
              upIds.push(r.formula.id);
              if (!coreIds.has(r.formula.id)) bridgeIds.add(r.formula.id);
            }
          });
        }
        const rightItems = [
          ...(includeDown ? rel.downstream : []),
          ...(includeCounter ? rel.counter : [])
        ];
        rightItems.forEach(r => {
          allowedDerivIds.add(r.deriv.id);
          if (!seenNeighbors.has(r.formula.id)) {
            seenNeighbors.add(r.formula.id);
            rightIds.push(r.formula.id);
            if (!coreIds.has(r.formula.id)) bridgeIds.add(r.formula.id);
          }
        });
        if (includeEquiv) {
          rel.equiv.forEach(r => {
            allowedDerivIds.add(r.deriv.id);
            if (!seenNeighbors.has(r.formula.id)) {
              seenNeighbors.add(r.formula.id);
              parallelIds.push(r.formula.id);
              if (!coreIds.has(r.formula.id)) bridgeIds.add(r.formula.id);
            }
          });
        }

        activeIds = new Set([selId, ...upIds, ...rightIds, ...parallelIds]);
        visibleFormulas = MASTER_GRAPH.formulas.filter(f => activeIds.has(f.id));
        visibleDerivations = MASTER_GRAPH.derivations.filter(d =>
          allowedDerivIds.has(d.id) && activeIds.has(d.to_formula_id) && d.from_formula_ids.some(fid => activeIds.has(fid))
        );

        const hasDownInRight = includeDown && rel.downstream.length > 0;
        const hasCounterInRight = includeCounter && rel.counter.length > 0;
        const rightColLabel = hasDownInRight && hasCounterInRight
          ? `直接衍生 / 反例 · ${rightIds.length}`
          : (hasCounterInRight ? `反例 / 失效边界 · ${rightIds.length}` : `直接衍生 · ${rightIds.length}`);

        const cols = [];
        if (upIds.length) cols.push({ label: `前置依赖 · ${upIds.length}`, ids: upIds, isCenter: false });
        cols.push({ label: "当前聚焦对象", ids: [selId], isCenter: true });
        if (rightIds.length) cols.push({ label: rightColLabel, ids: rightIds, isCenter: false });

        const scroller = document.getElementById("graphScroll");
        const availW = Math.max(720, (scroller ? scroller.clientWidth : 1080) - 44);
        const padX = 28;
        const parallelColsPerRow = Math.min(3, Math.max(1, parallelIds.length));
        const parallelGapX = 24;
        const parallelRowW = parallelIds.length
          ? parallelColsPerRow * NODE_W + (parallelColsPerRow - 1) * parallelGapX
          : 0;
        const minSpan = cols.length * NODE_W + Math.max(0, cols.length - 1) * 96 + padX * 2;
        stageW = Math.max(availW, minSpan, parallelRowW + padX * 2);
        const gapX = cols.length > 1 ? Math.floor((stageW - padX * 2 - cols.length * NODE_W) / (cols.length - 1)) : 0;
        const maxRows = Math.max(1, ...cols.map(c => c.ids.length));
        const topSectionBottom = 50 + maxRows * rowGap;
        stageH = Math.max(380, topSectionBottom + 40);

        let centerX = padX;
        cols.forEach((col, cIdx) => {
          const x = cols.length === 1 ? Math.max(padX, Math.floor((stageW - NODE_W) / 2)) : padX + cIdx * (NODE_W + gapX);
          if (col.isCenter) centerX = x;
          lanes.push({ x, y: 4, label: col.label, isBridgeLane: false, isFocusCenter: col.isCenter });
          col.ids.forEach((fid, rIdx) => {
            positions[fid] = { x, y: 50 + rIdx * rowGap };
          });
        });

        // 平行置底区：equivalent_to / dual_of 对称关系置于当前聚焦对象下方
        if (parallelIds.length) {
          const parallelHeaderY = parallelIds.length === 1
            ? (50 + NODE_H + 54)
            : Math.max(50 + NODE_H + 54, topSectionBottom + 14);
          const parallelStartY = parallelHeaderY + 40;
          const pRows = Math.ceil(parallelIds.length / parallelColsPerRow);
          const headerW = Math.min(stageW - padX * 2, Math.max(NODE_W, parallelRowW));
          const headerX = Math.max(padX, Math.min(stageW - padX - headerW, Math.floor(centerX + NODE_W / 2 - headerW / 2)));
          lanes.push({
            x: headerX,
            y: parallelHeaderY,
            w: headerW,
            label: `⇄ 等价 / 对偶 · ${parallelIds.length}`,
            isBridgeLane: false,
            isFocusCenter: false,
            isParallelLane: true
          });
          parallelIds.forEach((fid, idx) => {
            const r = Math.floor(idx / parallelColsPerRow);
            const c = idx % parallelColsPerRow;
            const rowCount = Math.min(parallelColsPerRow, parallelIds.length - r * parallelColsPerRow);
            const thisRowW = rowCount * NODE_W + (rowCount - 1) * parallelGapX;
            const rowStartX = Math.max(padX, Math.min(stageW - padX - thisRowW, Math.floor(centerX + NODE_W / 2 - thisRowW / 2)));
            positions[fid] = { x: rowStartX + c * (NODE_W + parallelGapX), y: parallelStartY + r * rowGap };
          });
          stageH = Math.max(stageH, parallelStartY + pRows * rowGap + 24);
        }
      } else if (isGlobal) {
        renderGraphLegendBar(false, null);
        if (state.includeBridges && isSubset) {
          MASTER_GRAPH.derivations.forEach(d => {
            const toIn = coreIds.has(d.to_formula_id);
            const fromIn = d.from_formula_ids.some(fid => coreIds.has(fid));
            if (toIn) d.from_formula_ids.forEach(fid => { if (!coreIds.has(fid)) bridgeIds.add(fid); });
            if (fromIn && !toIn) bridgeIds.add(d.to_formula_id);
          });
        }

        activeIds = new Set([...coreIds, ...bridgeIds]);
        visibleFormulas = MASTER_GRAPH.formulas.filter(f => activeIds.has(f.id));
        visibleDerivations = MASTER_GRAPH.derivations.filter(d =>
          activeIds.has(d.to_formula_id) && d.from_formula_ids.some(fid => activeIds.has(fid))
        );

        if (effectiveMode === "auto") {
          if (state.topicFilter !== "all" || visibleFormulas.length <= 14) effectiveMode = "topo";
          else if (state.branchFilter !== "all") effectiveMode = "topic";
          else effectiveMode = "branch";
        }

        const depths = computeTopoDepths(activeIds, visibleDerivations);
        const columnsMap = new Map();
        const addToCol = (key, label, sortOrder, formula, isBridgeLane = false) => {
          if (!columnsMap.has(key)) columnsMap.set(key, { key, label, sortOrder, isBridgeLane, items: [] });
          columnsMap.get(key).items.push(formula);
        };

        visibleFormulas.forEach(f => {
          const isBridge = bridgeIds.has(f.id);
          if (effectiveMode === "topo") {
            const lvl = depths[f.id] || 0;
            const lbl = lvl === 0 ? "第 1 层 · 公理 / 定义起点" : `第 ${lvl + 1} 层 · 推导层`;
            addToCol(`topo_${lvl}`, lbl, lvl, f, false);
          } else if (effectiveMode === "topic") {
            if (isBridge) addToCol("bridge_ext", "跨界桥梁 · 外部关联", 9999, f, true);
            else {
              const tp = TOPIC_BY_ID[f._primaryTopic];
              addToCol(f._primaryTopic, tp ? tp.label : "其他专题", tp ? tp.order : 999, f, false);
            }
          } else if (effectiveMode === "stage") {
            const st = f._primaryStage;
            addToCol(st, `${STAGE_LABELS[st] || st}阶段`, STAGE_ORDER[st] ?? 99, f, isBridge);
          } else {
            if (isBridge) addToCol("bridge_ext", "跨界桥梁 · 外部关联", 9999, f, true);
            else {
              const br = BRANCH_BY_ID[f._primaryBranch];
              const lbl = br ? `${br.disciplineLabel} · ${br.label}` : "其他分支";
              addToCol(f._primaryBranch, lbl, br ? br.order : 999, f, false);
            }
          }
        });

        const sortedCols = [...columnsMap.values()].sort((a, b) => a.sortOrder - b.sortOrder);
        let colX = 24;
        let maxRows = 1;
        sortedCols.forEach(col => {
          col.items.sort((a, b) => {
            const da = depths[a.id] || 0, db = depths[b.id] || 0;
            if (da !== db) return da - db;
            const ta = TOPIC_BY_ID[a._primaryTopic]?.order ?? 999;
            const tb = TOPIC_BY_ID[b._primaryTopic]?.order ?? 999;
            return ta - tb;
          });
          const MAX_PER_COL = 11;
          const chunks = [];
          for (let i = 0; i < col.items.length; i += MAX_PER_COL) chunks.push(col.items.slice(i, i + MAX_PER_COL));
          chunks.forEach((chunk, cIdx) => {
            const suffix = chunks.length > 1 ? ` (${cIdx + 1}/${chunks.length})` : "";
            lanes.push({ x: colX, label: `${col.label}${suffix} · ${chunk.length}`, isBridgeLane: col.isBridgeLane });
            maxRows = Math.max(maxRows, chunk.length);
            chunk.forEach((f, r) => { positions[f.id] = { x: colX, y: 50 + r * rowGap }; });
            colX += colGap;
          });
        });
        stageW = Math.max(640, colX + 20);
        stageH = Math.max(380, 50 + maxRows * rowGap + 44);
      } else {
        // 卡片目录视图
        visibleFormulas = matched;
        visibleDerivations = MASTER_GRAPH.derivations.filter(d =>
          coreIds.has(d.to_formula_id) && d.from_formula_ids.some(fid => coreIds.has(fid))
        );
      }

      currentView = {
        matchedFormulas: matched, coreIds, bridgeIds, visibleFormulas, visibleDerivations,
        positions, lanes, stageW, stageH, effectiveMode
      };

      const crumbs = [];
      if (state.stageFilter !== "all") crumbs.push(STAGE_LABELS[state.stageFilter]);
      if (state.discFilter !== "all") crumbs.push(DISC_BY_ID[state.discFilter]?.label || state.discFilter);
      if (state.branchFilter !== "all") crumbs.push(BRANCH_BY_ID[state.branchFilter]?.label || state.branchFilter);
      if (state.topicFilter !== "all") crumbs.push(TOPIC_BY_ID[state.topicFilter]?.label || state.topicFilter);
      if (state.kindFilter !== "all") crumbs.push(NODE_KIND_LABELS[state.kindFilter]);
      const scopeText = crumbs.length ? crumbs.join(" · ") : "全阶段全学科总图";
      const bridgeNote = bridgeIds.size > 0 ? ` + ${bridgeIds.size} 跨界桥梁` : "";
      const synNote = parsedQ.expandedHints.length ? ` · 已扩展 ${parsedQ.expandedHints.slice(0, 2).join("、")}` : "";

      document.getElementById("statsSubtitle").textContent = isFocus
        ? `${scopeText} · 聚焦 ${visibleFormulas.length}/${coreIds.size} 对象 · ${visibleDerivations.length} 关联${synNote}`
        : `${scopeText} · ${coreIds.size} 核心对象${bridgeNote} · ${visibleDerivations.length} 推导${synNote}`;
      document.getElementById("viewBadge").textContent = isFocus
        ? `聚焦：${formulaById[state.selectedFormulaId]?.name || "当前对象"}`
        : (isDir ? `目录：${matched.length} 项` : `全局：${crumbs.length ? crumbs[crumbs.length - 1] : "全量"}视角`);
      document.getElementById("layoutHint").textContent = isFocus
        ? `点击邻近卡片连续追踪 · 拖拽中间分隔线可调右侧宽度`
        : `布局：${LAYOUT_LABELS[effectiveMode]}（${lanes.length} 列 · 点击卡片聚焦关联）`;

      // 同步最短路径下拉框
      const startSel = document.getElementById("pathStart");
      const endSel = document.getElementById("pathEnd");
      const prevStart = startSel.value;
      const prevEnd = endSel.value;
      startSel.innerHTML = "";
      endSel.innerHTML = "";
      const pathPool = matched.length >= 2 ? matched : MASTER_GRAPH.formulas;
      pathPool.forEach(f => {
        startSel.add(new Option(f.name, f.id));
        endSel.add(new Option(f.name, f.id));
      });
      if (pathPool.length > 0) {
        const poolIds = new Set(pathPool.map(f => f.id));
        startSel.value = poolIds.has(prevStart) ? prevStart : (poolIds.has(state.selectedFormulaId) ? state.selectedFormulaId : pathPool[0].id);
        endSel.value = poolIds.has(prevEnd) ? prevEnd : pathPool[pathPool.length - 1].id;
      }

      if (isDir) {
        renderDirectoryView(matched);
      } else {
        if (autoFit) fitViewToCanvas();
        else applyZoom();
        renderGraph();
      }
      renderDrawer();
    }

    function renderDirectoryView(list) {
      const grid = document.getElementById("dirGrid");
      if (!grid) return;
      if (!list.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">当前筛选条件下暂无匹配对象，请放宽条件或清空搜索词。</div>`;
        return;
      }
      const q = state.searchQuery.trim();
      const sorted = list.slice().sort((a, b) => {
        if (state.dirSort === "degree") return b._degree - a._degree || a.name.localeCompare(b.name, "zh-CN");
        if (state.dirSort === "kind") {
          const ka = NODE_KIND_ORDER[a._kind] ?? 99, kb = NODE_KIND_ORDER[b._kind] ?? 99;
          if (ka !== kb) return ka - kb;
          return b._degree - a._degree;
        }
        const sa = STAGE_ORDER[a._primaryStage] ?? 99, sb = STAGE_ORDER[b._primaryStage] ?? 99;
        if (sa !== sb) return sa - sb;
        const ba = BRANCH_BY_ID[a._primaryBranch]?.order ?? 999, bb = BRANCH_BY_ID[b._primaryBranch]?.order ?? 999;
        if (ba !== bb) return ba - bb;
        const ta = TOPIC_BY_ID[a._primaryTopic]?.order ?? 999, tb = TOPIC_BY_ID[b._primaryTopic]?.order ?? 999;
        return ta - tb || b._degree - a._degree;
      });

      grid.innerHTML = sorted.map(f => {
        const dm = getDiscMeta(f);
        const kindLabel = NODE_KIND_LABELS[f._kind] || "公式";
        const stageText = f.taxonomy.education_stages.map(s => STAGE_LABELS[s] || s).join("·");
        const brLabel = BRANCH_BY_ID[f._primaryBranch]?.label || "";
        return `
          <article class="dir-card ${f.id === state.selectedFormulaId ? "selected" : ""}" onclick="selectFormulaInDirectory('${f.id}')">
            <div class="node-head" style="margin-bottom:0;">
              <span class="node-title" title="${escapeHTML(f.name)}">${highlightText(f.name, q)}</span>
              <span class="node-badge">关联 ${f._degree}</span>
            </div>
            <div class="dir-card-math">${renderMathHTML(f.latex)}</div>
            <div class="dir-card-stmt">${highlightText(f.statement || "", q)}</div>
            <div class="dir-card-foot">
              <span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;">
                <span class="node-tag ${dm.cls}">${dm.label}</span>
                <span class="kind-pill kind-${f._kind}">${kindLabel}</span>
                ${renderLocalBadge(f)}
                <span>${stageText}${brLabel ? ` · ${brLabel}` : ""}</span>
              </span>
              <button type="button" class="mini-btn primary" onclick="event.stopPropagation(); selectFormula('${f.id}')">◎ 聚焦推导</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function selectFormulaInDirectory(id) {
      state.selectedFormulaId = id;
      recordFormulaVisit(id);
      state.activeTab = "formula";
      renderDirectoryView(currentView.matchedFormulas);
      renderDrawer();
      if (getEffectiveDevice() === "mobile") setMobilePane("formula");
    }

    function fitViewToCanvas() {
      const scroller = document.getElementById("graphScroll");
      const availW = Math.max(320, scroller.clientWidth - 36);
      const ratioW = availW / currentView.stageW;
      if (state.viewMode === "focus") {
        state.zoom = +Math.max(0.86, Math.min(1.06, ratioW)).toFixed(2);
      } else {
        state.zoom = +Math.max(0.76, Math.min(1.04, ratioW)).toFixed(2);
      }
      applyZoom();
    }

    function applyZoom() {
      const wrap = document.getElementById("zoomWrap");
      wrap.style.transform = `scale(${state.zoom})`;
      wrap.style.width = `${currentView.stageW * state.zoom}px`;
      wrap.style.height = `${currentView.stageH * state.zoom}px`;
      document.getElementById("zoomVal").textContent = `${Math.round(state.zoom * 100)}%`;
    }

    function computeCurve(fromPos, toPos) {
      const sameCol = Math.abs(fromPos.x - toPos.x) < 10;
      if (sameCol) {
        const goingDown = toPos.y > fromPos.y;
        const x1 = fromPos.x + NODE_W / 2;
        const y1 = goingDown ? fromPos.y + NODE_H : fromPos.y;
        const x2 = toPos.x + NODE_W / 2;
        const y2 = goingDown ? toPos.y : toPos.y + NODE_H;
        const offset = Math.abs(y2 - y1) > 160 ? 52 : 0;
        const cx = x1 + offset;
        const cy = (y1 + y2) / 2;
        return { d: `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, mx: (x1 + cx) / 2, my: cy };
      }
      const goingRight = toPos.x > fromPos.x;
      const x1 = goingRight ? fromPos.x + NODE_W : fromPos.x;
      const y1 = fromPos.y + NODE_H / 2;
      const x2 = goingRight ? toPos.x : toPos.x + NODE_W;
      const y2 = toPos.y + NODE_H / 2;
      const c = Math.min(Math.abs(x2 - x1) * 0.42, 160);
      const cx1 = goingRight ? x1 + c : x1 - c;
      const cx2 = goingRight ? x2 - c : x2 + c;
      return { d: `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
    }

    function renderGraph() {
      const stage = document.getElementById("graphStage");
      const laneLayer = document.getElementById("laneLayer");
      const edgeLayer = document.getElementById("edgeLayer");
      const nodeLayer = document.getElementById("nodeLayer");

      stage.style.width = `${currentView.stageW}px`;
      stage.style.height = `${currentView.stageH}px`;
      document.getElementById("graphSvg").setAttribute("viewBox", `0 0 ${currentView.stageW} ${currentView.stageH}`);

      laneLayer.innerHTML = currentView.lanes.map(l =>
        `<div class="lane-header ${l.isBridgeLane ? "bridge-lane" : ""} ${l.isFocusCenter ? "focus-center-lane" : ""} ${l.isParallelLane ? "parallel-lane" : ""}" style="left:${l.x}px;${l.y !== undefined ? `top:${l.y}px;` : ""}${l.w ? `width:${l.w}px;` : ""}" title="${l.label}">${l.label}</div>`
      ).join("");
      edgeLayer.innerHTML = "";
      nodeLayer.innerHTML = "";

      if (currentView.visibleFormulas.length === 0) {
        nodeLayer.innerHTML = `<div class="empty-state">当前筛选条件下暂无匹配对象，请调整阶段、学科、分支或清空搜索词。</div>`;
        return;
      }

      const selId = state.selectedFormulaId;
      const directRels = selId ? getDirectRelations(selId, currentView.visibleDerivations) : { upstream: [], downstream: [], equiv: [], counter: [] };
      const upstreamIds = new Set(directRels.upstream.map(r => r.formula.id));
      const downstreamIds = new Set(directRels.downstream.map(r => r.formula.id));
      const equivIds = new Set(directRels.equiv.map(r => r.formula.id));
      const counterIds = new Set(directRels.counter.map(r => r.formula.id));
      const directDerivIds = new Set([
        ...directRels.upstream.map(r => r.deriv.id),
        ...directRels.downstream.map(r => r.deriv.id),
        ...directRels.equiv.map(r => r.deriv.id),
        ...directRels.counter.map(r => r.deriv.id)
      ]);

      currentView.visibleDerivations.forEach(d => {
        const toPos = currentView.positions[d.to_formula_id];
        if (!toPos) return;
        const isFocusParallel = state.viewMode === "focus" && selId && !state.activePath &&
          (d.relation_type === "equivalent_to" || d.relation_type === "dual_of") &&
          (d.to_formula_id === selId || d.from_formula_ids.includes(selId));

        let edgeClass = d.dependency_site === "application_level" ? "edge-path cross-app" : "edge-path";
        let marker = "url(#arrow-default)";
        let showPill = false;

        if (state.activePath) {
          if (state.activePath.derivIds.has(d.id)) { edgeClass += " highlight-path"; marker = "url(#arrow-path)"; showPill = true; }
          else edgeClass += " dimmed";
        } else if (state.activeTab === "derivation" && state.selectedDerivId === d.id) {
          edgeClass += isFocusParallel ? " highlight-primary" : " highlight-primary";
          marker = isFocusParallel ? "url(#dot-equiv)" : "url(#arrow-primary)";
          showPill = true;
        } else if (selId) {
          if (directDerivIds.has(d.id)) {
            showPill = true;
            if (d.relation_type === "counterexample_to") { edgeClass += " highlight-counter"; marker = "url(#arrow-path)"; }
            else if (isFocusParallel) { edgeClass += " highlight-equiv-parallel"; marker = "url(#dot-equiv)"; }
            else if (d.relation_type === "equivalent_to" || d.relation_type === "dual_of") { edgeClass += " highlight-equiv"; marker = "url(#arrow-equiv)"; }
            else if (d.to_formula_id === selId) { edgeClass += " highlight-upstream"; marker = "url(#arrow-upstream)"; }
            else { edgeClass += " highlight-downstream"; marker = "url(#arrow-downstream)"; }
          } else edgeClass += " dimmed";
        }

        let pillAnchor = null;
        if (isFocusParallel) {
          const selPos = currentView.positions[selId];
          const peerIds = d.to_formula_id === selId ? d.from_formula_ids : [d.to_formula_id];
          peerIds.forEach(pid => {
            const peerPos = currentView.positions[pid];
            if (!selPos || !peerPos) return;
            const x1 = selPos.x + NODE_W / 2;
            const y1 = selPos.y + NODE_H;
            const x2 = peerPos.x + NODE_W / 2;
            const y2 = peerPos.y;
            const midY = Math.round((y1 + y2) / 2);
            const pathD = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathD);
            path.setAttribute("class", edgeClass);
            path.setAttribute("marker-start", marker);
            path.setAttribute("marker-end", marker);
            edgeLayer.appendChild(path);
            if (!pillAnchor) pillAnchor = { x: Math.round((x1 + x2) / 2), y: midY };
          });
        } else {
          d.from_formula_ids.forEach(fid => {
            const fromPos = currentView.positions[fid];
            if (!fromPos) return;
            const curve = computeCurve(fromPos, toPos);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", curve.d);
            path.setAttribute("class", edgeClass);
            path.setAttribute("marker-end", marker);
            if (d.bidirectional && d.from_formula_ids.length === 1) path.setAttribute("marker-start", marker);
            edgeLayer.appendChild(path);
            if (!pillAnchor) pillAnchor = { x: curve.mx, y: curve.my };
          });
        }

        if (showPill && pillAnchor) {
          const pill = document.createElement("button");
          pill.className = `edge-pill ${state.selectedDerivId === d.id && state.activeTab === "derivation" ? "selected" : ""}`;
          pill.style.left = `${pillAnchor.x}px`;
          pill.style.top = `${pillAnchor.y}px`;
          const prefix = d.from_formula_ids.length > 1 ? `组合(${d.from_formula_ids.length})·` : "";
          pill.textContent = `${prefix}${REL_LABELS[d.relation_type]}`;
          pill.onclick = (e) => { e.stopPropagation(); selectDerivation(d.id); };
          nodeLayer.appendChild(pill);
        }
      });

      currentView.visibleFormulas.forEach(f => {
        const pos = currentView.positions[f.id];
        if (!pos) return;
        const isBridge = currentView.bridgeIds.has(f.id);
        const card = document.createElement("div");
        let cls = "formula-node";
        if (isBridge) cls += " bridge-node";
        if (state.activePath) cls += state.activePath.nodeIds.has(f.id) ? " rel-path" : " dimmed";
        else if (selId === f.id) cls += " selected";
        else if (selId) {
          if (counterIds.has(f.id)) cls += " rel-counter";
          else if (equivIds.has(f.id)) cls += " rel-equiv";
          else if (upstreamIds.has(f.id)) cls += " rel-upstream";
          else if (downstreamIds.has(f.id)) cls += " rel-downstream";
          else cls += " dimmed";
        }

        const rel = getDirectRelations(f.id, currentView.visibleDerivations);
        const stageText = f.taxonomy.education_stages.map(s => STAGE_LABELS[s] || s).join("·");
        const dm = getDiscMeta(f);
        const mathLen = f.latex.replace(/\\[a-zA-Z]+/g, "x").length;
        const mathCls = mathLen > 46 ? "node-math xlong-math" : (mathLen > 28 ? "node-math long-math" : "node-math");
        card.className = cls;
        card.style.left = `${pos.x}px`;
        card.style.top = `${pos.y}px`;
        const kindLabel = NODE_KIND_LABELS[f._kind] || "公式";
        card.innerHTML = `
          <div class="node-head">
            <span class="node-title" title="${escapeHTML(f.name)}">${escapeHTML(f.name)}</span>
            <span class="node-badge ${isBridge ? "bridge-tag" : ""}">${isBridge ? "跨界桥梁" : `↑${rel.upstream.length} ↓${rel.downstream.length + rel.equiv.length + rel.counter.length}`}</span>
          </div>
          <div class="${mathCls}">${renderMathHTML(f.latex)}</div>
          <div class="node-foot">
            <span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;">
              <span class="node-tag ${dm.cls}">${dm.label}</span>
              <span class="kind-pill kind-${f._kind}">${kindLabel}</span>
              ${renderLocalBadge(f)}
            </span>
            <span>${stageText}</span>
          </div>
        `;
        card.onclick = () => selectFormula(f.id);
        nodeLayer.appendChild(card);
      });
    }

    function scrollToRelSection(anchorId) {
      const target = document.getElementById(anchorId);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderDrawer() {
      const body = document.getElementById("drawerBody");
      document.querySelectorAll(".drawer-tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === state.activeTab));

      const f = formulaById[state.selectedFormulaId] || currentView.visibleFormulas[0] || MASTER_GRAPH.formulas[0];
      if (f && state.navHistory.length === 0) recordFormulaVisit(f.id);
      else renderNavHistoryBar();

      let pathBannerHTML = "";
      if (state.activePath) {
        const chainText = state.activePath.orderedFormulaIds.map(id => formulaById[id].name).join(" → ");
        const stepBtns = (state.activePath.orderedDerivIds || []).map((did, i) =>
          `<button class="cite-link" onclick="selectDerivation('${did}')">第 ${i + 1} 步推导</button>`
        ).join(" ");
        const modeNote = state.activePath.undirected ? "（无向连通路径）" : "";
        pathBannerHTML = `<div class="path-banner"><strong>最短推导路径（${state.activePath.orderedFormulaIds.length - 1} 跳）${modeNote}：</strong><br/>${chainText}<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;">${stepBtns}</div></div>`;
      }

      if (state.activeTab === "formula") {
        const rel = getDirectRelations(f.id, MASTER_GRAPH.derivations);
        const branchTags = [...f._branches].map(bid => BRANCH_BY_ID[bid]?.label || bid);
        const topicTags = [...f._canonicalTopics].map(tid => TOPIC_BY_ID[tid]?.label || tid);

        const renderRelGroup = (items, kindCls, kindText, anchorId) => {
          if (!items.length) return "";
          return `<div id="${anchorId}">` + items.map(item => `
            <div class="rel-card">
              <div class="rel-card-top">
                <strong style="font-size:12.5px">${escapeHTML(item.formula.name)}</strong>
                <span class="rel-kind ${kindCls}">${kindText} · ${REL_LABELS[item.deriv.relation_type]}</span>
              </div>
              <div style="font-size:12.5px; color:var(--ink-secondary);">${renderMathHTML(item.formula.latex)}</div>
              <div class="rel-actions">
                <button class="mini-btn primary" onclick="selectDerivation('${item.deriv.id}')">查看 L1/L2/L3 推导</button>
                <button class="mini-btn" onclick="jumpToFormula('${item.formula.id}')">聚焦该对象</button>
              </div>
            </div>
          `).join("") + `</div>`;
        };

        const varsRows = f.variables.map(v => `
          <tr>
            <td>${renderMathHTML(v.symbol)}</td>
            <td>${v.name}</td>
            <td><code>${v.quantity_kind || "-"}</code></td>
            <td><code>${v.dimension || "-"}</code></td>
            <td><strong>${v.si_unit || "-"}</strong></td>
          </tr>
        `).join("");

        const totalRelCnt = rel.upstream.length + rel.downstream.length + rel.equiv.length + rel.counter.length;
        const overviewPills = [
          rel.upstream.length ? `<button type="button" class="overview-pill" onclick="scrollToRelSection('rel-sec-up')"><span class="dot" style="background:var(--upstream)"></span>前置 ${rel.upstream.length}</button>` : "",
          rel.downstream.length ? `<button type="button" class="overview-pill" onclick="scrollToRelSection('rel-sec-down')"><span class="dot" style="background:var(--downstream)"></span>衍生 ${rel.downstream.length}</button>` : "",
          rel.equiv.length ? `<button type="button" class="overview-pill" onclick="scrollToRelSection('rel-sec-equiv')"><span class="dot" style="background:var(--equiv)"></span>等价/对偶 ${rel.equiv.length}</button>` : "",
          rel.counter.length ? `<button type="button" class="overview-pill" onclick="scrollToRelSection('rel-sec-counter')"><span class="dot" style="background:var(--counter)"></span>反例 ${rel.counter.length}</button>` : ""
        ].filter(Boolean).join("");

        body.innerHTML = `
          ${pathBannerHTML}
          <div class="hero-card">
            <h2 class="hero-title">${escapeHTML(f.name)}</h2>
            <div class="hero-aliases">别名：${escapeHTML(f.aliases.join(" / ") || "无")}</div>
            <div class="hero-math">${renderMathHTML(f.latex)}</div>
            <div style="font-size:12.5px; color:var(--ink-secondary);">${escapeHTML(f.statement)}</div>
            <div class="meta-row">
              ${renderLocalBadge(f)}
              <span class="chip">类型：${NODE_KIND_LABELS[f._kind] || "公式"}</span>
              ${f.taxonomy.education_stages.map(s => `<span class="chip">阶段：${STAGE_LABELS[s] || s}</span>`).join("")}
              ${branchTags.map(b => `<span class="chip">分支：${b}</span>`).join("")}
              ${topicTags.map(t => `<span class="chip">专题：${t}</span>`).join("")}
              <span class="chip verified">✓ 已核验</span>
              <span class="chip">出处：${escapeHTML((f.review && f.review.source) || "本地工作区")}</span>
            </div>
            <div class="meta-row" style="margin-top:8px;">
              <button class="mini-btn" onclick="openLocalEditorModal('${f.id}')">✎ 本地编辑</button>
              ${f._local_status === "modified" ? `<button class="mini-btn danger" onclick="restoreOfficialFormula('${f.id}')">↺ 还原官方版</button>` : ""}
              ${f._local_status === "custom" ? `<button class="mini-btn danger" onclick="deleteCustomLocalFormula('${f.id}')">🗑 删除本地对象</button>` : ""}
            </div>
          </div>

          ${overviewPills ? `<div class="overview-strip"><span class="overview-label">关联速览</span>${overviewPills}</div>` : ""}

          <div class="section-label">变量与物理量纲（MathModDB 跨学科标准）</div>
          <table class="var-table">
            <thead>
              <tr><th>符号</th><th>物理/数学量</th><th>量类</th><th>量纲</th><th>SI 单位</th></tr>
            </thead>
            <tbody>${varsRows}</tbody>
          </table>

          <div class="section-label">适用条件</div>
          <div style="font-size:12.5px; color:var(--ink-secondary);">${escapeHTML(f.conditions.join("；"))}</div>

          ${f.intuition ? `<div class="section-label">直觉理解</div><div class="summary-box" style="font-size:12.5px; padding:10px 12px;">${escapeHTML(f.intuition)}</div>` : ""}
          ${f.worked_example ? `<div class="section-label">极简数值算例</div><div class="step-card" style="font-size:12.5px; color:var(--ink-secondary); margin-bottom:0;">${escapeHTML(f.worked_example)}</div>` : ""}
          ${f.applications && f.applications.length ? `<div class="section-label">典型应用场景</div><div class="meta-row">${f.applications.map(a => `<span class="chip">${escapeHTML(a)}</span>`).join("")}</div>` : ""}

          <div class="section-label">全库直接关联对象（共 ${totalRelCnt} 条）</div>
          ${renderRelGroup(rel.upstream, "upstream", "前置依赖", "rel-sec-up")}
          ${renderRelGroup(rel.downstream, "downstream", "直接衍生", "rel-sec-down")}
          ${renderRelGroup(rel.equiv, "equiv", "等价/对偶", "rel-sec-equiv")}
          ${renderRelGroup(rel.counter, "counter", "反例/失效", "rel-sec-counter")}
        `;
      } else {
        const d = derivById[state.selectedDerivId] || currentView.visibleDerivations[0] || MASTER_GRAPH.derivations[0];
        const fromCards = d.from_formula_ids.map(id => {
          const item = formulaById[id];
          return `<button class="cite-link" onclick="jumpToFormula('${item.id}')">${escapeHTML(item.name)}</button>`;
        }).join(" + ");
        const toF = formulaById[d.to_formula_id];

        let levelContent = "";
        if (state.level === "L1") {
          levelContent = `<div class="summary-box"><strong>核心变换思路：</strong><br/>${escapeHTML(d.levels.L1_summary)}</div>`;
        } else {
          const steps = state.level === "L2" ? d.levels.L2_standard : d.levels.L3_detailed;
          levelContent = steps.map(st => `
            <div class="step-card">
              <div class="step-head">
                <span class="step-num">${st.step}</span>
                <span class="step-note">${escapeHTML(st.note)}</span>
              </div>
              <div class="step-math">${renderMathHTML(st.latex)}</div>
              ${st.cited_formula_ids && st.cited_formula_ids.length ? `
                <div class="step-cites">
                  <span>引用对象：</span>
                  ${st.cited_formula_ids.map(cid => `<button class="cite-link" onclick="jumpToFormula('${cid}')">${escapeHTML(formulaById[cid]?.name || cid)}</button>`).join("")}
                </div>
              ` : ""}
              ${st.pitfall ? `<div class="pitfall-box"><strong>易错提醒：</strong>${escapeHTML(st.pitfall)}</div>` : ""}
            </div>
          `).join("");
        }

        body.innerHTML = `
          ${pathBannerHTML}
          <div class="hero-card">
            <div style="font-size:12px; color:var(--ink-muted); margin-bottom:6px;">推导关系 · ${d.from_formula_ids.length > 1 ? `多对一组合推导（${d.from_formula_ids.length} 条前提）` : "二元推导"}</div>
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px;">
              ${fromCards}
              <span style="font-weight:700; color:var(--primary);">${d.bidirectional ? "⇄" : "→"}</span>
              <button class="cite-link" onclick="jumpToFormula('${toF.id}')">${escapeHTML(toF.name)}</button>
            </div>
            <div class="meta-row">
              <span class="chip">关系：${REL_LABELS[d.relation_type]}</span>
              <span class="chip">层级：${SITE_LABELS[d.dependency_site]}</span>
              ${d.inference_rules.map(r => `<span class="chip rule">${escapeHTML(r)}</span>`).join("")}
            </div>
          </div>

          <div class="level-switcher">
            <button class="level-btn ${state.level === "L1" ? "active" : ""}" onclick="setLevel('L1')">L1 摘要级</button>
            <button class="level-btn ${state.level === "L2" ? "active" : ""}" onclick="setLevel('L2')">L2 标准级</button>
            <button class="level-btn ${state.level === "L3" ? "active" : ""}" onclick="setLevel('L3')">L3 详细级</button>
          </div>

          ${levelContent}
        `;
      }
    }

    // 浏览历史栈（40 步）+ 最近浏览（15 项去重）+ 一键查与上项推导路径（参考 finlex-site）
    function recordFormulaVisit(fid, opts = {}) {
      if (!fid || !formulaById[fid]) return;
      if (!opts.keepRecentOrder) {
        state.recentFormulaIds = [fid, ...state.recentFormulaIds.filter(x => x !== fid)].slice(0, 15);
      }
      if (!opts.fromBack && state.navHistory[state.navIndex] !== fid) {
        state.navHistory = state.navHistory.slice(0, state.navIndex + 1);
        state.navHistory.push(fid);
        if (state.navHistory.length > 40) state.navHistory.shift();
        state.navIndex = state.navHistory.length - 1;
      }
      renderNavHistoryBar();
    }

    function getPreviousDistinctFormulaId() {
      const cur = state.selectedFormulaId;
      if (state.navIndex > 0 && state.navHistory[state.navIndex - 1] !== cur) {
        return state.navHistory[state.navIndex - 1];
      }
      return state.recentFormulaIds.find(id => id !== cur) || null;
    }

    function renderNavHistoryBar() {
      const backBtn = document.getElementById("navBackBtn");
      const sel = document.getElementById("recentFormulasSelect");
      const cmpBtn = document.getElementById("comparePrevBtn");
      if (!backBtn || !sel || !cmpBtn) return;

      const canBack = state.navIndex > 0 && Boolean(formulaById[state.navHistory[state.navIndex - 1]]);
      backBtn.disabled = !canBack;
      backBtn.title = canBack
        ? `返回上一项：${formulaById[state.navHistory[state.navIndex - 1]].name}`
        : "暂无上一个浏览记录";

      const recent = state.recentFormulaIds.filter(id => formulaById[id]);
      sel.innerHTML = `<option value="">🕒 最近浏览（${recent.length} 项）</option>` + recent.map((id, idx) => {
        const item = formulaById[id];
        const tag = id === state.selectedFormulaId ? "[当前] " : "";
        return `<option value="${id}">${idx + 1}. ${tag}${escapeHTML(item.name)}</option>`;
      }).join("");
      sel.value = "";

      const prevId = getPreviousDistinctFormulaId();
      if (prevId && formulaById[prevId] && state.selectedFormulaId && formulaById[state.selectedFormulaId]) {
        cmpBtn.style.display = "inline-flex";
        cmpBtn.title = `查找「${formulaById[prevId].name}」与当前对象的推导路径`;
      } else {
        cmpBtn.style.display = "none";
      }
    }

    function goBackFormula() {
      if (state.navIndex <= 0) return;
      state.navIndex -= 1;
      const targetId = state.navHistory[state.navIndex];
      if (!formulaById[targetId]) return;
      state.selectedFormulaId = targetId;
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      if (!currentView.coreIds.has(targetId)) {
        state.stageFilter = "all"; state.discFilter = "all"; state.branchFilter = "all"; state.topicFilter = "all"; state.kindFilter = "all";
        state.searchQuery = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("searchClearBtn").style.display = "none";
        syncCascadingDropdowns();
      }
      recordFormulaVisit(targetId, { fromBack: true, keepRecentOrder: true });
      generateDynamicView(true, { keepSelected: true });
    }

    function jumpToRecentFormula(fid) {
      const sel = document.getElementById("recentFormulasSelect");
      if (sel) sel.value = "";
      if (!fid || !formulaById[fid] || fid === state.selectedFormulaId) return;
      jumpToFormula(fid);
    }

    function checkPathWithPrevFormula() {
      const prevId = getPreviousDistinctFormulaId();
      const curId = state.selectedFormulaId;
      if (!prevId || !curId || prevId === curId || !formulaById[prevId] || !formulaById[curId]) return;
      const res = findShortestPath(prevId, curId, MASTER_GRAPH.derivations, true);
      if (!res) {
        alert(`「${formulaById[prevId].name}」与「${formulaById[curId].name}」之间暂未找到连通推导路径。`);
        return;
      }
      if (!currentView.coreIds.has(prevId) || !currentView.coreIds.has(curId)) {
        state.stageFilter = "all"; state.discFilter = "all"; state.branchFilter = "all"; state.topicFilter = "all"; state.kindFilter = "all";
        state.searchQuery = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("searchClearBtn").style.display = "none";
        syncCascadingDropdowns();
      }
      state.viewMode = "global";
      state.pathBarOpen = true;
      state.activePath = res;
      document.getElementById("clearPathBtn").style.display = "inline-block";
      syncPathBarUI();
      generateDynamicView(true, { keepSelected: true });
      document.getElementById("pathStart").value = prevId;
      document.getElementById("pathEnd").value = curId;
    }

    function selectFormula(id) {
      state.selectedFormulaId = id;
      recordFormulaVisit(id);
      state.viewMode = "focus";
      state.focusRelFilter = "all";
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      syncPathBarUI();
      generateDynamicView(true, { keepSelected: true });
    }

    function jumpToFormula(id) {
      state.selectedFormulaId = id;
      recordFormulaVisit(id);
      state.viewMode = "focus";
      state.focusRelFilter = "all";
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      syncPathBarUI();
      if (!currentView.coreIds.has(id)) {
        state.stageFilter = "all";
        state.discFilter = "all";
        state.branchFilter = "all";
        state.topicFilter = "all";
        state.kindFilter = "all";
        state.searchQuery = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("searchClearBtn").style.display = "none";
        syncCascadingDropdowns();
      }
      generateDynamicView(true, { keepSelected: true });
    }

    function selectDerivation(id) {
      state.selectedDerivId = id;
      state.activeTab = "derivation";
      if (state.viewMode !== "directory") renderGraph();
      renderDrawer();
    }

    function setLevel(lvl) {
      state.level = lvl;
      renderDrawer();
    }

    function applyDrawerWidth() {
      const ws = document.querySelector(".workspace");
      if (!ws) return;
      if (state.customDrawerW != null) {
        ws.style.setProperty("--drawer-w", `${state.customDrawerW}px`);
      } else {
        ws.style.removeProperty("--drawer-w");
      }
    }

    function initPaneResizer() {
      const resizer = document.getElementById("paneResizer");
      const ws = document.querySelector(".workspace");
      if (!resizer || !ws) return;
      let dragging = false;
      resizer.addEventListener("mousedown", (e) => {
        e.preventDefault();
        dragging = true;
        resizer.classList.add("dragging");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const rect = ws.getBoundingClientRect();
        const rawW = rect.right - e.clientX;
        const maxW = Math.min(Math.floor(rect.width * 0.56), rect.width - 420);
        state.customDrawerW = Math.round(Math.max(320, Math.min(maxW, rawW)));
        applyDrawerWidth();
      });
      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        try { localStorage.setItem("fg_drawer_w", String(state.customDrawerW)); } catch (err) {}
        if (state.viewMode === "focus") generateDynamicView(true, { keepSelected: true });
        else if (state.viewMode === "global") fitViewToCanvas();
      });
      resizer.addEventListener("dblclick", () => {
        state.customDrawerW = null;
        try { localStorage.removeItem("fg_drawer_w"); } catch (err) {}
        applyDrawerWidth();
        if (state.viewMode === "focus") generateDynamicView(true, { keepSelected: true });
        else if (state.viewMode === "global") fitViewToCanvas();
      });
    }

    function syncPathBarUI() {
      const bar = document.getElementById("pathBar");
      const btn = document.getElementById("pathToggleBtn");
      if (bar) bar.classList.toggle("open", state.pathBarOpen);
      if (btn) btn.classList.toggle("active", state.pathBarOpen || Boolean(state.activePath));
    }

    function initControls() {
      document.getElementById("discSelect").onchange = (e) => {
        state.discFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("branchSelect").onchange = (e) => {
        state.branchFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("topicSelect").onchange = (e) => {
        state.topicFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("kindSelect").onchange = (e) => {
        state.kindFilter = e.target.value;
        generateDynamicView(true);
      };

      const searchInputEl = document.getElementById("searchInput");
      const searchClearBtn = document.getElementById("searchClearBtn");
      let searchTimer = null;

      searchInputEl.onfocus = () => {
        if (searchInputEl.value.trim()) renderSearchSuggestions(searchInputEl.value);
      };
      searchInputEl.oninput = (e) => {
        state.searchQuery = e.target.value;
        searchClearBtn.style.display = state.searchQuery ? "inline-flex" : "none";
        if (!state.searchQuery.trim()) closeSearchSuggestions();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          // 聚焦模式下输入搜索词仅弹出 Top-8 联想下拉，不粗暴切走当前聚焦画布；全局/目录模式实时过滤
          if (state.viewMode === "focus") {
            const q = state.searchQuery.trim();
            if (q) renderSearchSuggestions(q);
            else generateDynamicView(false, { keepSelected: true });
          } else {
            generateDynamicView(state.viewMode === "global");
            if (state.searchQuery.trim()) renderSearchSuggestions(state.searchQuery);
          }
        }, 90);
      };
      searchInputEl.onkeydown = (e) => {
        const pop = document.getElementById("searchSuggestPop");
        const isOpen = pop && pop.classList.contains("open") && activeSuggestList.length > 0;
        if (e.key === "ArrowDown" && isOpen) {
          e.preventDefault();
          activeSuggestIdx = (activeSuggestIdx + 1) % activeSuggestList.length;
          updateSuggestHighlight();
        } else if (e.key === "ArrowUp" && isOpen) {
          e.preventDefault();
          activeSuggestIdx = (activeSuggestIdx - 1 + activeSuggestList.length) % activeSuggestList.length;
          updateSuggestHighlight();
        } else if (e.key === "Escape") {
          closeSearchSuggestions();
        } else if (e.key === "Enter") {
          e.preventDefault();
          clearTimeout(searchTimer);
          if (isOpen) {
            const target = activeSuggestList[activeSuggestIdx >= 0 ? activeSuggestIdx : 0];
            if (target) { pickSearchSuggestion(target.formula.id); return; }
          }
          const { items } = computeFuzzySuggestions(searchInputEl.value, 1);
          if (items.length) pickSearchSuggestion(items[0].formula.id);
          else { closeSearchSuggestions(); generateDynamicView(true); }
        }
      };
      document.addEventListener("click", (e) => {
        const wrap = document.getElementById("heroSearchWrap");
        if (wrap && !wrap.contains(e.target)) closeSearchSuggestions();
      });
      searchClearBtn.onclick = () => {
        state.searchQuery = "";
        searchInputEl.value = "";
        searchClearBtn.style.display = "none";
        closeSearchSuggestions();
        searchInputEl.focus();
        generateDynamicView(true, { keepSelected: true });
      };

      document.getElementById("focusModeBtn").onclick = () => {
        if (state.viewMode === "focus") return;
        state.viewMode = "focus";
        generateDynamicView(true, { keepSelected: true });
      };
      document.getElementById("globalModeBtn").onclick = () => {
        if (state.viewMode === "global") return;
        state.viewMode = "global";
        generateDynamicView(true, { keepSelected: true });
      };
      document.getElementById("dirModeBtn").onclick = () => {
        if (state.viewMode === "directory") return;
        state.viewMode = "directory";
        generateDynamicView(false, { keepSelected: true });
      };
      document.getElementById("dirSortSelect").onchange = (e) => {
        state.dirSort = e.target.value;
        renderDirectoryView(currentView.matchedFormulas);
        syncStateToURL();
      };

      document.getElementById("layoutModeSelect").onchange = (e) => {
        state.layoutMode = e.target.value;
        state.viewMode = "global";
        generateDynamicView(true);
      };
      document.getElementById("densitySelect").onchange = (e) => {
        state.density = e.target.value;
        generateDynamicView(true);
      };

      const bridgeBtn = document.getElementById("bridgeBtn");
      bridgeBtn.onclick = () => {
        state.includeBridges = !state.includeBridges;
        bridgeBtn.classList.toggle("active", state.includeBridges);
        generateDynamicView(true);
      };

      document.getElementById("pathToggleBtn").onclick = () => {
        state.pathBarOpen = !state.pathBarOpen;
        syncPathBarUI();
      };
      document.getElementById("closePathBarBtn").onclick = () => {
        state.pathBarOpen = false;
        syncPathBarUI();
      };

      document.getElementById("resetBtn").onclick = () => {
        state.stageFilter = "all";
        state.discFilter = "all";
        state.branchFilter = "all";
        state.topicFilter = "all";
        state.kindFilter = "all";
        state.searchQuery = "";
        state.layoutMode = "auto";
        state.includeBridges = false;
        state.focusRelFilter = "all";
        state.viewMode = "focus";
        state.activePath = null;
        searchInputEl.value = "";
        searchClearBtn.style.display = "none";
        closeSearchSuggestions();
        document.getElementById("layoutModeSelect").value = "auto";
        bridgeBtn.classList.remove("active");
        document.getElementById("clearPathBtn").style.display = "none";
        syncPathBarUI();
        syncCascadingDropdowns();
        generateDynamicView(true);
      };

      document.querySelectorAll(".drawer-tab").forEach(btn => {
        btn.onclick = () => {
          state.activeTab = btn.dataset.tab;
          if (state.viewMode !== "directory") renderGraph();
          renderDrawer();
        };
      });

      document.getElementById("findPathBtn").onclick = () => {
        const res = findShortestPath(
          document.getElementById("pathStart").value,
          document.getElementById("pathEnd").value,
          MASTER_GRAPH.derivations,
          true
        );
        if (!res) { alert("未找到这两个对象之间的连通推导路径。"); return; }
        state.viewMode = "global";
        state.activePath = res;
        document.getElementById("clearPathBtn").style.display = "inline-block";
        syncPathBarUI();
        generateDynamicView(true, { keepSelected: true });
      };
      document.getElementById("clearPathBtn").onclick = () => {
        state.activePath = null;
        document.getElementById("clearPathBtn").style.display = "none";
        syncPathBarUI();
        if (state.viewMode !== "directory") renderGraph();
        renderDrawer();
      };

      document.getElementById("zoomOutBtn").onclick = () => { state.zoom = Math.max(0.32, +(state.zoom - 0.1).toFixed(2)); applyZoom(); };
      document.getElementById("zoomInBtn").onclick = () => { state.zoom = Math.min(1.25, +(state.zoom + 0.1).toFixed(2)); applyZoom(); };
      document.getElementById("zoomFitBtn").onclick = () => fitViewToCanvas();
    }

    // URL 状态双向同步
    function buildShareURL() {
      const params = new URLSearchParams();
      if (state.stageFilter !== "all") params.set("stage", state.stageFilter);
      if (state.discFilter !== "all") params.set("disc", state.discFilter);
      if (state.branchFilter !== "all") params.set("branch", state.branchFilter);
      if (state.topicFilter !== "all") params.set("topic", state.topicFilter);
      if (state.kindFilter !== "all") params.set("kind", state.kindFilter);
      if (state.searchQuery.trim()) params.set("q", state.searchQuery.trim());
      if (state.viewMode !== "focus") params.set("view", state.viewMode);
      if (state.layoutMode !== "auto") params.set("layout", state.layoutMode);
      if (state.density !== "standard") params.set("density", state.density);
      if (state.includeBridges) params.set("bridges", "1");
      if (state.selectedFormulaId) params.set("formula", state.selectedFormulaId);
      if (state.activeTab === "derivation" && state.selectedDerivId) {
        params.set("tab", "derivation");
        params.set("deriv", state.selectedDerivId);
      }
      if (state.level !== "L2") params.set("level", state.level);
      if (state.deviceMode !== "auto") params.set("ui", state.deviceMode);
      const qs = params.toString();
      const base = window.location.origin === "null"
        ? window.location.href.split("?")[0]
        : window.location.origin + window.location.pathname;
      return qs ? `${base}?${qs}` : base;
    }

    function syncStateToURL() {
      if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
      try { window.history.replaceState(null, "", buildShareURL()); } catch (e) {}
    }

    function restoreStateFromURL() {
      const params = new URLSearchParams(window.location.search);
      if (!params.toString()) return;
      if (params.get("stage")) state.stageFilter = params.get("stage");
      if (params.get("disc")) state.discFilter = params.get("disc");
      if (params.get("branch")) state.branchFilter = params.get("branch");
      if (params.get("topic")) state.topicFilter = params.get("topic");
      if (params.get("kind")) state.kindFilter = params.get("kind");
      if (params.get("q")) {
        state.searchQuery = params.get("q");
        document.getElementById("searchInput").value = state.searchQuery;
        document.getElementById("searchClearBtn").style.display = "inline-flex";
      }
      if (["focus", "global", "directory"].includes(params.get("view"))) {
        state.viewMode = params.get("view");
      } else if (params.get("focus") === "0") {
        state.viewMode = "global";
      }
      if (["auto", "topo", "topic", "branch", "stage"].includes(params.get("layout"))) {
        state.layoutMode = params.get("layout");
        document.getElementById("layoutModeSelect").value = state.layoutMode;
      }
      if (["compact", "standard", "spacious"].includes(params.get("density"))) {
        state.density = params.get("density");
        document.getElementById("densitySelect").value = state.density;
      }
      if (params.get("bridges") === "1") {
        state.includeBridges = true;
        document.getElementById("bridgeBtn").classList.add("active");
      }
      if (params.get("formula") && formulaById[params.get("formula")]) {
        state.selectedFormulaId = params.get("formula");
      }
      if (params.get("tab") === "derivation" && params.get("deriv") && derivById[params.get("deriv")]) {
        state.activeTab = "derivation";
        state.selectedDerivId = params.get("deriv");
      }
      if (["L1", "L2", "L3"].includes(params.get("level"))) {
        state.level = params.get("level");
      }
      if (["auto", "desktop", "tablet", "mobile"].includes(params.get("ui"))) {
        state.deviceMode = params.get("ui");
      }
    }

    // 分享当前动态视图按钮
    document.getElementById("shareViewBtn").onclick = async () => {
      const url = buildShareURL();
      const btn = document.getElementById("shareViewBtn");
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = "✓ 已复制链接";
        btn.classList.add("active");
        setTimeout(() => { btn.textContent = "🔗 分享视图"; btn.classList.remove("active"); }, 1800);
      } catch (e) {
        window.prompt("复制下方链接即可直达当前动态视图：", url);
      }
    };

    // PWA 安装提示与 Service Worker 注册
    let deferredInstallPrompt = null;
    const installBtn = document.getElementById("installPwaBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.style.display = "inline-flex";
    });

      if (!deferredInstallPrompt) return;

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
