<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公式知识图谱 · 交互原型（25 公式完整种子库）</title>
  <!-- 在线时自动加载 KaTeX 渲染出版级数学公式；离线时无缝回退到内置原生公式渲染器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.__katexReady && window.__katexReady()"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-subtle: #f1f4f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --upstream: #d97706;
      --upstream-soft: #fffbeb;
      --upstream-border: #fcd34d;
      --downstream: #059669;
      --downstream-soft: #ecfdf5;
      --downstream-border: #6ee7b7;
      --equiv: #7c3aed;
      --equiv-soft: #f5f3ff;
      --equiv-border: #c4b5fd;
      --pitfall-bg: #fff7ed;
      --pitfall-border: #fdba74;
      --pitfall-ink: #9a3412;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 13px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-family: var(--font-math);
      font-size: 16px;
    }
    .brand-title { font-size: 15px; font-weight: 600; color: var(--ink); }
    .brand-sub { font-size: 11.5px; color: var(--ink-muted); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }
    .search-box {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      font-size: 12px;
      width: 170px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
    }
    .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14); }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--surface-subtle);
      padding: 3px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 11px;
      color: var(--ink-muted);
      padding: 0 5px 0 7px;
      user-select: none;
    }
    .pill-btn {
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn:hover { color: var(--ink); background: rgba(255,255,255,0.7); }
    .pill-btn.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink-secondary);
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 430px;
      flex: 1;
      min-height: 0;
    }

    .canvas-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background:
        radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0) 0 0 / 24px 24px,
        var(--bg);
    }
    .canvas-subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-secondary);
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    .right-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .path-finder {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .path-finder select {
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 12px;
      background: var(--surface);
      color: var(--ink);
      max-width: 148px;
    }
    .zoom-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      overflow: hidden;
    }
    .zoom-btn {
      border: none;
      background: transparent;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      color: var(--ink-secondary);
    }
    .zoom-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .zoom-val {
      font-size: 11px;
      color: var(--ink-muted);
      padding: 0 5px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-width: 42px;
      text-align: center;
    }
    .action-btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }
    .action-btn:hover { opacity: 0.92; }
    .action-btn.ghost {
      background: var(--surface);
      color: var(--ink-secondary);
      border-color: var(--border-strong);
    }

    .graph-scroll {
      flex: 1;
      overflow: auto;
      padding: 18px;
    }
    .graph-zoom-wrap {
      transform-origin: top left;
      transition: transform 0.12s ease;
    }
    .graph-stage {
      position: relative;
      width: 1640px;
      height: 850px;
      flex-shrink: 0;
    }
    .lane-header {
      position: absolute;
      top: 4px;
      width: 224px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px 10px;
      letter-spacing: 0.02em;
    }

    .graph-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .edge-path {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 1.6;
      opacity: 0.35;
      transition: stroke 0.18s ease, opacity 0.18s ease, stroke-width 0.18s ease;
    }
    .edge-path.dimmed { opacity: 0.08; }
    .edge-path.hidden { opacity: 0; }
    .edge-path.highlight-primary { stroke: var(--primary); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-upstream { stroke: var(--upstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-downstream { stroke: var(--downstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-equiv { stroke: var(--equiv); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-path { stroke: #e11d48; stroke-width: 3.1; opacity: 1; stroke-dasharray: 7 4; }

    .formula-node {
      position: absolute;
      width: 224px;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 9px 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
      user-select: none;
      z-index: 3;
    }
    .formula-node:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      z-index: 8;
    }
    .formula-node.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      z-index: 7;
    }
    .formula-node.rel-upstream { border-color: var(--upstream); background: var(--upstream-soft); z-index: 5; }
    .formula-node.rel-downstream { border-color: var(--downstream); background: var(--downstream-soft); z-index: 5; }
    .formula-node.rel-equiv { border-color: var(--equiv); background: var(--equiv-soft); z-index: 5; }
    .formula-node.rel-path { border-color: #e11d48; background: #fff1f2; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14); z-index: 6; }
    .formula-node.dimmed { opacity: 0.2; }
    .formula-node.hidden { opacity: 0; pointer-events: none; }

    .node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 4px;
    }
    .node-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      color: var(--ink-muted);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .node-math {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 2px;
      font-size: 13.5px;
      color: var(--ink);
      overflow-x: auto;
    }
    .node-foot {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--ink-muted);
    }
    .node-tag {
      background: rgba(15, 23, 42, 0.05);
      padding: 1px 5px;
      border-radius: 5px;
    }

    .edge-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--surface);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-pill);
      padding: 2px 9px;
      font-size: 11px;
      color: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      z-index: 9;
      transition: all 0.15s ease;
    }
    .edge-pill:hover { background: var(--primary); color: #fff; transform: translate(-50%, -50%) scale(1.05); }
    .edge-pill.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .canvas-hint {
      position: absolute;
      left: 14px;
      bottom: 12px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      font-size: 11.5px;
      color: var(--ink-muted);
      box-shadow: var(--shadow-sm);
      z-index: 12;
    }

    /* 右侧抽屉 */
    .drawer {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .drawer-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
      padding: 6px 12px 0;
      gap: 6px;
    }
    .drawer-tab {
      border: none;
      background: transparent;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .drawer-tab.active {
      color: var(--primary);
      font-weight: 600;
      border-bottom-color: var(--primary);
      background: var(--surface);
      border-radius: 8px 8px 0 0;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 15px 0 7px;
    }
    .section-label:first-child { margin-top: 0; }

    .hero-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
    }
    .hero-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
    .hero-aliases { font-size: 12px; color: var(--ink-muted); margin-bottom: 9px; }
    .hero-math {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      text-align: center;
      font-size: 17px;
      overflow-x: auto;
      margin-bottom: 9px;
    }
    .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink-secondary);
    }
    .chip.verified { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .chip.rule { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-family: var(--font-mono); }

    .var-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .var-table th, .var-table td {
      padding: 6px 7px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .var-table th { background: var(--surface-subtle); color: var(--ink-muted); font-weight: 600; font-size: 11px; }
    .var-table tr:last-child td { border-bottom: none; }

    .rel-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 11px;
      margin-bottom: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .rel-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rel-kind { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); }
    .rel-kind.upstream { background: var(--upstream-soft); color: var(--upstream); border: 1px solid var(--upstream-border); }
    .rel-kind.downstream { background: var(--downstream-soft); color: var(--downstream); border: 1px solid var(--downstream-border); }
    .rel-kind.equiv { background: var(--equiv-soft); color: var(--equiv); border: 1px solid var(--equiv-border); }
    .rel-actions { display: flex; gap: 6px; }
    .mini-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink-secondary);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
    .mini-btn.primary { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); font-weight: 600; }

    .level-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--surface-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin: 12px 0 14px;
    }
    .level-btn {
      border: none;
      background: transparent;
      padding: 7px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
    }
    .level-btn.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-sm); }

    .summary-box {
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-md);
      padding: 13px;
      color: #1e3a8a;
      font-size: 13.5px;
      line-height: 1.65;
    }
    .step-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px;
      margin-bottom: 9px;
      background: var(--surface);
    }
    .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .step-num {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .step-note { font-size: 12.5px; color: var(--ink); }
    .step-math {
      background: var(--surface-subtle);
      border-radius: 7px;
      padding: 8px 10px;
      text-align: center;
      font-size: 14.5px;
      overflow-x: auto;
    }
    .step-cites { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); }
    .cite-link {
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: var(--radius-pill);
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .cite-link:hover { background: var(--primary); color: #fff; }
    .pitfall-box {
      margin-top: 7px;
      background: var(--pitfall-bg);
      border: 1px solid var(--pitfall-border);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--pitfall-ink);
    }
    .path-banner {
      background: #fff1f2;
      border: 1px solid #fda4af;
      color: #9f1239;
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12.5px;
    }

    .math-fallback { font-family: var(--font-math); font-size: 1.03em; }
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      font-size: 0.88em;
      line-height: 1.15;
    }
    .math-frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 4px 1px; }
    .math-frac > span:last-child { padding: 1px 4px 0; }

    @media (max-width: 1080px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; }
      .drawer { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">∑</div>
        <div>
          <div class="brand-title">公式知识图谱 · 高中三角函数种子库</div>
          <div class="brand-sub" id="statsSubtitle">25 个核心公式 · 24 条多级推导链 · 支持领域筛选与 L1/L2/L3 详略切换</div>
        </div>
      </div>
      <div class="toolbar">
        <input class="search-box" id="searchInput" type="search" placeholder="搜索公式名或别名..." />
        <div class="filter-group" id="stageFilters">
          <span class="filter-label">学段</span>
          <button class="pill-btn active" data-stage="all">全部</button>
          <button class="pill-btn" data-stage="senior_high">高中</button>
          <button class="pill-btn" data-stage="undergraduate">本科前置</button>
        </div>
        <div class="filter-group" id="topicFilters">
          <span class="filter-label">专题</span>
          <button class="pill-btn active" data-topic="all">全部</button>
          <button class="pill-btn" data-topic="trigonometric_identities">同角</button>
          <button class="pill-btn" data-topic="induction_formulas">诱导</button>
          <button class="pill-btn" data-topic="angle_sum_and_difference">和差角</button>

            "cited_formula_ids": []

            "latex": "\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R",

    function renderMathHTML(latex) {
      if (window.katex && typeof window.katex.renderToString === "function") {
        try {
          return window.katex.renderToString(latex, { throwOnError: false, displayMode: false });
        } catch (e) {}
      }
      let s = latex
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\mathbb\{R\}/g, "ℝ")
        .replace(/\\setminus/g, "\\")
        .replace(/\\left|\\right/g, "")
        .replace(/\\implies/g, "⇒")
        .replace(/\\xrightarrow\{([^}]*)\}/g, " → ")
        .replace(/\\quad|\\ /g, "&nbsp;")
        .replace(/\\cdot/g, "·")
        .replace(/\\neq/g, "≠")
        .replace(/\\le/g, "≤")
        .replace(/\\infty/g, "∞")
        .replace(/\\alpha/g, "α")
        .replace(/\\beta/g, "β")
        .replace(/\\varphi/g, "φ")
        .replace(/\\pi/g, "π")
        .replace(/\\sin/g, "sin")
        .replace(/\\cos/g, "cos")
        .replace(/\\tan/g, "tan")
        .replace(/\\sqrt\{([^}]+)\}/g, "√($1)")
        .replace(/\^2/g, "²")
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '<span class="math-frac"><span>$1</span><span>$2</span></span>');
      return `<span class="math-fallback">${s}</span>`;
    }

    function getDirectRelations(formulaId) {
      const upstream = [];
      const downstream = [];
      const equiv = [];
      GRAPH_DATA.derivations.forEach(d => {
        const isFrom = d.from_formula_ids.includes(formulaId);
        const isTo = d.to_formula_id === formulaId;
        if (!isFrom && !isTo) return;
        if (d.relation_type === "equivalent_to") {
          const others = isTo ? d.from_formula_ids : [d.to_formula_id];
          others.forEach(oid => equiv.push({ formula: formulaById[oid], deriv: d }));
        } else if (isTo) {
          d.from_formula_ids.forEach(oid => upstream.push({ formula: formulaById[oid], deriv: d }));
        } else if (isFrom) {
          downstream.push({ formula: formulaById[d.to_formula_id], deriv: d });
        }
      });
      return { upstream, downstream, equiv };
    }

    function findShortestPath(startId, endId) {
      if (startId === endId) return { nodeIds: new Set([startId]), derivIds: new Set(), orderedFormulaIds: [startId], orderedDerivIds: [] };
      const queue = [{ id: startId, pathNodes: [startId], pathDerivs: [] }];
      const visited = new Set([startId]);
      while (queue.length > 0) {
        const cur = queue.shift();
        for (const d of GRAPH_DATA.derivations) {
          const nextCandidates = [];
          if (d.from_formula_ids.includes(cur.id)) nextCandidates.push(d.to_formula_id);
          if (d.bidirectional && d.to_formula_id === cur.id) d.from_formula_ids.forEach(fid => nextCandidates.push(fid));
          for (const nxt of nextCandidates) {
            if (visited.has(nxt)) continue;
            const newNodes = [...cur.pathNodes, nxt];
            const newDerivs = [...cur.pathDerivs, d.id];
            if (nxt === endId) {
              return { nodeIds: new Set(newNodes), derivIds: new Set(newDerivs), orderedFormulaIds: newNodes, orderedDerivIds: newDerivs };
            }
            visited.add(nxt);
            queue.push({ id: nxt, pathNodes: newNodes, pathDerivs: newDerivs });
          }
        }
      }
      return null;
    }

    function matchesFilters(formula) {
      const stageOk = state.stageFilter === "all" || formula.taxonomy.education_stages.includes(state.stageFilter);
      const topicOk = state.topicFilter === "all" || formula.taxonomy.topics.includes(state.topicFilter);
      const q = state.searchQuery.trim().toLowerCase();
      const searchOk = !q ||
        formula.name.toLowerCase().includes(q) ||
        formula.aliases.some(a => a.toLowerCase().includes(q)) ||
        formula.latex.toLowerCase().includes(q);
      return stageOk && topicOk && searchOk;
    }

    function computeCurve(fromPos, toPos) {
      const sameCol = Math.abs(fromPos.x - toPos.x) < 10;
      if (sameCol) {
        const goingDown = toPos.y > fromPos.y;
        const x1 = fromPos.x + NODE_W / 2;
        const y1 = goingDown ? fromPos.y + NODE_H : fromPos.y;
        const x2 = toPos.x + NODE_W / 2;
        const y2 = goingDown ? toPos.y : toPos.y + NODE_H;
        const offset = Math.abs(y2 - y1) > 170 ? 52 : 0;
        const cx = x1 + offset;
        const cy = (y1 + y2) / 2;
        return { d: `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, mx: (x1 + cx) / 2, my: cy };
      }
      const goingRight = toPos.x > fromPos.x;
      const x1 = goingRight ? fromPos.x + NODE_W : fromPos.x;
      const y1 = fromPos.y + NODE_H / 2;
      const x2 = goingRight ? toPos.x : toPos.x + NODE_W;
      const y2 = toPos.y + NODE_H / 2;
      const dx = Math.abs(x2 - x1);
      const c = Math.min(dx * 0.45, 160);
      const cx1 = goingRight ? x1 + c : x1 - c;
      const cx2 = goingRight ? x2 - c : x2 + c;
      return { d: `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
    }

    function renderGraph() {
      const edgeLayer = document.getElementById("edgeLayer");
      const nodeLayer = document.getElementById("nodeLayer");
      edgeLayer.innerHTML = "";
      nodeLayer.innerHTML = "";

      const selId = state.selectedFormulaId;
      const directRels = selId ? getDirectRelations(selId) : { upstream: [], downstream: [], equiv: [] };
      const upstreamIds = new Set(directRels.upstream.map(r => r.formula.id));
      const downstreamIds = new Set(directRels.downstream.map(r => r.formula.id));
      const equivIds = new Set(directRels.equiv.map(r => r.formula.id));
      const directDerivIds = new Set([
        ...directRels.upstream.map(r => r.deriv.id),
        ...directRels.downstream.map(r => r.deriv.id),
        ...directRels.equiv.map(r => r.deriv.id)
      ]);

      const visibleNodeIds = new Set();
      GRAPH_DATA.formulas.forEach(f => {
        if (!matchesFilters(f)) return;
        if (state.focusOnly && selId) {
          if (f.id === selId || upstreamIds.has(f.id) || downstreamIds.has(f.id) || equivIds.has(f.id)) visibleNodeIds.add(f.id);
        } else {
          visibleNodeIds.add(f.id);
        }
      });

      // 渲染边与高亮推导标签
      GRAPH_DATA.derivations.forEach(d => {
        const toVisible = visibleNodeIds.has(d.to_formula_id);
        let edgeClass = "edge-path";
        let marker = "url(#arrow-default)";
        let showPill = false;

        if (state.activePath) {
          if (state.activePath.derivIds.has(d.id)) {
            edgeClass += " highlight-path";
            marker = "url(#arrow-path)";
            showPill = true;
          } else {
            edgeClass += " dimmed";
          }
        } else if (state.activeTab === "derivation" && state.selectedDerivId === d.id) {
          edgeClass += " highlight-primary";
          marker = "url(#arrow-primary)";
          showPill = true;
        } else if (selId) {
          if (directDerivIds.has(d.id)) {
            showPill = true;
            if (d.relation_type === "equivalent_to") {
              edgeClass += " highlight-equiv";
              marker = "url(#arrow-equiv)";
            } else if (d.to_formula_id === selId) {
              edgeClass += " highlight-upstream";
              marker = "url(#arrow-upstream)";
            } else {
              edgeClass += " highlight-downstream";
              marker = "url(#arrow-downstream)";
            }
          } else {
            edgeClass += " dimmed";
          }
        }

        const toPos = NODE_POS[d.to_formula_id];
        let pillAnchor = null;

        d.from_formula_ids.forEach((fid, idx) => {
          const visible = toVisible && visibleNodeIds.has(fid);
          const curve = computeCurve(NODE_POS[fid], toPos);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", curve.d);
          path.setAttribute("class", visible ? edgeClass : "edge-path hidden");
          path.setAttribute("marker-end", marker);
          if (d.bidirectional && d.from_formula_ids.length === 1) path.setAttribute("marker-start", marker);
          edgeLayer.appendChild(path);
          if (visible && idx === 0) pillAnchor = { x: curve.mx, y: curve.my };
        });

        if (showPill && pillAnchor) {
          const pill = document.createElement("button");
          pill.className = `edge-pill ${state.selectedDerivId === d.id && state.activeTab === "derivation" ? "selected" : ""}`;
          pill.style.left = `${pillAnchor.x}px`;
          pill.style.top = `${pillAnchor.y}px`;
          const prefix = d.from_formula_ids.length > 1 ? `组合(${d.from_formula_ids.length})·` : "";
          pill.textContent = `${prefix}${REL_LABELS[d.relation_type]}`;
          pill.onclick = (e) => { e.stopPropagation(); selectDerivation(d.id); };
          nodeLayer.appendChild(pill);
        }
      });

      // 渲染节点卡片
      GRAPH_DATA.formulas.forEach(f => {
        const pos = NODE_POS[f.id];
        const card = document.createElement("div");
        const isVisible = visibleNodeIds.has(f.id);
        let cls = "formula-node";

        if (!isVisible) {
          cls += " hidden";
        } else if (state.activePath) {
          cls += state.activePath.nodeIds.has(f.id) ? " rel-path" : " dimmed";
        } else if (selId === f.id) {
          cls += " selected";
        } else if (selId) {
          if (equivIds.has(f.id)) cls += " rel-equiv";
          else if (upstreamIds.has(f.id)) cls += " rel-upstream";
          else if (downstreamIds.has(f.id)) cls += " rel-downstream";
          else cls += " dimmed";
        }

        const rel = getDirectRelations(f.id);
        const primaryTopic = TOPIC_LABELS[f.taxonomy.topics[1] || f.taxonomy.topics[0]] || "三角函数";

        card.className = cls;
        card.style.left = `${pos.x}px`;
        card.style.top = `${pos.y}px`;
        card.innerHTML = `
          <div class="node-head">
            <span class="node-title" title="${f.name}">${f.name}</span>
            <span class="node-badge">↑${rel.upstream.length} ↓${rel.downstream.length + rel.equiv.length}</span>
          </div>
          <div class="node-math">${renderMathHTML(f.latex)}</div>
          <div class="node-foot">
            <span class="node-tag">${primaryTopic}</span>
            <span>${f.taxonomy.disciplines.includes("physics") ? "数学 · 物理" : (f.taxonomy.education_stages.includes("undergraduate") ? "高中 · 本科前置" : "高中必修")}</span>
          </div>
        `;
        card.onclick = () => selectFormula(f.id);
        nodeLayer.appendChild(card);
      });
    }

      startSel.value = "math.trig.unit_circle_def";
      endSel.value = "math.trig.power_reduction_cos";

      document.getElementById("searchInput").oninput = (e) => {
        state.searchQuery = e.target.value;
        renderGraph();
      };

      document.querySelectorAll("#stageFilters .pill-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#stageFilters .pill-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.stageFilter = btn.dataset.stage;
          renderGraph();
        };
      });

      document.querySelectorAll("#topicFilters .pill-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#topicFilters .pill-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.topicFilter = btn.dataset.topic;
          renderGraph();
        };
      });

      const focusBtn = document.getElementById("focusOnlyBtn");
      focusBtn.onclick = () => {
        state.focusOnly = !state.focusOnly;
        focusBtn.classList.toggle("active", state.focusOnly);
        renderGraph();
      };

      document.getElementById("resetBtn").onclick = () => {
        state.stageFilter = "all";
        state.topicFilter = "all";
        state.searchQuery = "";
        state.focusOnly = false;
        state.activePath = null;
        document.getElementById("searchInput").value = "";
        focusBtn.classList.remove("active");
        document.getElementById("clearPathBtn").style.display = "none";
        document.querySelectorAll("#stageFilters .pill-btn, #topicFilters .pill-btn").forEach(b => {
          b.classList.toggle("active", b.dataset.stage === "all" || b.dataset.topic === "all");
        });
        renderGraph();
        renderDrawer();
      };

      document.querySelectorAll(".drawer-tab").forEach(btn => {
        btn.onclick = () => {
          state.activeTab = btn.dataset.tab;
          renderGraph();
          renderDrawer();
        };
      });

      document.getElementById("findPathBtn").onclick = () => {
        const res = findShortestPath(startSel.value, endSel.value);
        if (!res) {
          alert("当前数据中未找到这两个公式之间的推导路径。");
          return;
        }
        state.activePath = res;
        document.getElementById("clearPathBtn").style.display = "inline-block";
        renderGraph();
        renderDrawer();
      };

      document.getElementById("clearPathBtn").onclick = () => {
        state.activePath = null;
        document.getElementById("clearPathBtn").style.display = "none";
        renderGraph();
        renderDrawer();
      };

      document.getElementById("zoomOutBtn").onclick = () => {
        state.zoom = Math.max(0.45, +(state.zoom - 0.1).toFixed(2));
        applyZoom();
      };
      document.getElementById("zoomInBtn").onclick = () => {
        state.zoom = Math.min(1.25, +(state.zoom + 0.1).toFixed(2));
        applyZoom();
      };
      document.getElementById("zoomFitBtn").onclick = () => {
        state.zoom = 0.78;
        applyZoom();
      };
    }

    window.__katexReady = () => {
      renderGraph();
      renderDrawer();
    };

    initControls();
    applyZoom();
    renderGraph();
    renderDrawer();
  </script>
</body>
</html>
