<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="公式图谱" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>公式知识图谱 · 动态视图生成系统</title>
  <!-- 在线时自动加载 KaTeX 渲染出版级数学公式；离线时无缝回退到内置原生公式渲染器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.__katexReady && window.__katexReady()"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-subtle: #f1f4f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --upstream: #d97706;
      --upstream-soft: #fffbeb;
      --upstream-border: #fcd34d;
      --downstream: #059669;
      --downstream-soft: #ecfdf5;
      --downstream-border: #6ee7b7;
      --equiv: #7c3aed;
      --equiv-soft: #f5f3ff;
      --equiv-border: #c4b5fd;
      --counter: #e11d48;
      --counter-soft: #fff1f2;
      --counter-border: #fda4af;
      --pitfall-bg: #fff7ed;
      --pitfall-border: #fdba74;
      --pitfall-ink: #9a3412;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 13px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    }
    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* 顶部栏：严格按 学段 → 学科 → 分支 → 专题 自顶向下联动筛选 */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--primary); color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-family: var(--font-math); font-size: 16px;
    }
    .brand-title { font-size: 15px; font-weight: 600; color: var(--ink); }
    .brand-sub { font-size: 11.5px; color: var(--ink-muted); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .step-arrow { color: var(--border-strong); font-size: 12px; user-select: none; }
    .select-field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 3px 8px;
    }
    .select-field.active-filter {
      background: var(--primary-soft);
      border-color: var(--primary-border);
    }
    .select-field label {
      font-size: 11px;
      color: var(--ink-muted);
      user-select: none;
      white-space: nowrap;
    }
    .select-field.active-filter label { color: #1d4ed8; font-weight: 600; }
    .select-field select {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      padding: 2px 1px;
      max-width: 175px;
    }
    .select-field.active-filter select { color: #1e40af; font-weight: 600; }

    .search-box {
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      width: 148px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
    }
    .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14); }

    .toggle-btn {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
      padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }

    .workspace { display: grid; grid-template-columns: 1fr 436px; flex: 1; min-height: 0; }

    .canvas-pane {
      position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0) 0 0 / 24px 24px, var(--bg);
    }
    /* 动态视图调节栏 */
    .canvas-subbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 7px 14px;
      background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .view-controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    }
    .view-badge {
      font-size: 11px; font-weight: 600; color: #1d4ed8;
      background: var(--primary-soft); border: 1px solid var(--primary-border);
      padding: 2px 8px; border-radius: var(--radius-pill);
    }

    .right-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .path-finder { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .path-finder select {
      border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 6px;
      font-size: 12px; background: var(--surface); color: var(--ink); max-width: 140px;
    }
    .zoom-controls {
      display: inline-flex; align-items: center;
      border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); overflow: hidden;
    }
    .zoom-btn { border: none; background: transparent; padding: 4px 8px; font-size: 12px; cursor: pointer; color: var(--ink-secondary); }
    .zoom-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .zoom-val { font-size: 11px; color: var(--ink-muted); padding: 0 5px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-width: 42px; text-align: center; }
    .action-btn { border: 1px solid var(--primary); background: var(--primary); color: #fff; padding: 4px 9px; border-radius: 7px; font-size: 12px; cursor: pointer; }
    .action-btn.ghost { background: var(--surface); color: var(--ink-secondary); border-color: var(--border-strong); }

    .legend-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 5px 14px;
      background: rgba(248, 250, 252, 0.9);
      border-bottom: 1px solid var(--border);
      font-size: 11.5px; color: var(--ink-secondary);
    }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .graph-scroll { flex: 1; overflow: auto; padding: 18px; }
    .graph-zoom-wrap { transform-origin: top left; transition: transform 0.12s ease; }
    .graph-stage { position: relative; flex-shrink: 0; }
    .lane-header {
      position: absolute; top: 4px; width: 258px; text-align: center;
      font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.94); border: 1px solid var(--border);
      border-radius: var(--radius-pill); padding: 3px 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lane-header.bridge-lane {
      background: #f8fafc; border-style: dashed; border-color: #94a3b8; color: #475569;
    }

    .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge-path { fill: none; stroke: #94a3b8; stroke-width: 1.6; opacity: 0.3; transition: stroke 0.18s ease, opacity 0.18s ease, stroke-width 0.18s ease; }
    .edge-path.cross-app { stroke-dasharray: 5 4; }
    .edge-path.dimmed { opacity: 0.06; }
    .edge-path.highlight-primary { stroke: var(--primary); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-upstream { stroke: var(--upstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-downstream { stroke: var(--downstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-equiv { stroke: var(--equiv); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-counter { stroke: var(--counter); stroke-width: 2.6; opacity: 1; stroke-dasharray: 6 3; }
    .edge-path.highlight-path { stroke: #e11d48; stroke-width: 3.1; opacity: 1; stroke-dasharray: 7 4; }

    .formula-node {
      position: absolute; width: 258px; background: var(--surface);
      border: 1.5px solid var(--border-strong); border-radius: var(--radius-lg);
      padding: 9px 12px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
      user-select: none; z-index: 3;
    }
    .formula-node.bridge-node {
      border-style: dashed; background: #f8fafc; opacity: 0.88;
    }
    .formula-node:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); z-index: 8; opacity: 1; }
    .formula-node.selected { border-color: var(--primary); border-style: solid; background: var(--primary-soft); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); z-index: 7; opacity: 1; }
    .formula-node.rel-upstream { border-color: var(--upstream); background: var(--upstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-downstream { border-color: var(--downstream); background: var(--downstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-equiv { border-color: var(--equiv); background: var(--equiv-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-path { border-color: #e11d48; background: #fff1f2; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14); z-index: 6; opacity: 1; }
    .formula-node.dimmed { opacity: 0.18; }

    .node-head { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 4px; }
    .node-title { font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-badge { font-size: 10px; padding: 1px 5px; border-radius: var(--radius-pill); background: var(--surface-subtle); color: var(--ink-muted); border: 1px solid var(--border); flex-shrink: 0; }
    .node-badge.bridge-tag { background: #e2e8f0; color: #334155; }
    .node-math { min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 3px 2px; font-size: 13px; color: var(--ink); overflow-x: auto; scrollbar-width: none; }
    .node-math::-webkit-scrollbar { display: none; }
    .node-math.long-math { font-size: 11.4px; }
    .node-math.xlong-math { font-size: 10.2px; }
    .node-foot { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--ink-muted); }
    .node-tag { background: rgba(15, 23, 42, 0.05); padding: 1px 6px; border-radius: 5px; }
    .disc-math { background: #e0e7ff; color: #3730a3; }
    .disc-phys { background: #dcfce7; color: #166534; }
    .disc-chem { background: #fef3c7; color: #92400e; }
    .kind-pill { font-size: 10px; padding: 1px 5px; border-radius: 5px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; margin-right: 4px; }
    .kind-axiom { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .kind-distribution { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .kind-theorem { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .kind-inequality { background: #ffe4e6; color: #be123c; border-color: #fda4af; }
    .kind-law { background: #dcfce7; color: #166534; border-color: #86efac; }
    .kind-definition { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

    .edge-pill {
      position: absolute; transform: translate(-50%, -50%);
      background: var(--surface); border: 1px solid var(--primary-border);
      border-radius: var(--radius-pill); padding: 2px 9px; font-size: 11px; color: var(--primary);
      cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap; z-index: 9;
    }
    .edge-pill:hover, .edge-pill.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .empty-state {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--ink-muted); font-size: 14px; text-align: center; padding: 24px;
    }

    .drawer { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .drawer-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); background: var(--surface-subtle); padding: 6px 12px 0; gap: 6px; }
    .drawer-tab { border: none; background: transparent; padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .drawer-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); background: var(--surface); border-radius: 8px 8px 0 0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 15px 0 7px; }
    .section-label:first-child { margin-top: 0; }

    .hero-card { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px; }
    .hero-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
    .hero-aliases { font-size: 12px; color: var(--ink-muted); margin-bottom: 9px; }
    .hero-math { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; font-size: 17px; overflow-x: auto; margin-bottom: 9px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--ink-secondary); }
    .chip.verified { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .chip.rule { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-family: var(--font-mono); }

    .var-table { width: 100%; border-collapse: collapse; font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .var-table th, .var-table td { padding: 6px 7px; border-bottom: 1px solid var(--border); text-align: left; }
    .var-table th { background: var(--surface-subtle); color: var(--ink-muted); font-weight: 600; font-size: 11px; }
    .var-table tr:last-child td { border-bottom: none; }

    .rel-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; margin-bottom: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
    .rel-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rel-kind { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); }
    .rel-kind.upstream { background: var(--upstream-soft); color: var(--upstream); border: 1px solid var(--upstream-border); }
    .rel-kind.downstream { background: var(--downstream-soft); color: var(--downstream); border: 1px solid var(--downstream-border); }
    .rel-kind.equiv { background: var(--equiv-soft); color: var(--equiv); border: 1px solid var(--equiv-border); }
    .rel-actions { display: flex; gap: 6px; }
    .mini-btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary); padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
    .mini-btn.primary { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); font-weight: 600; }

    .level-switcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-subtle); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin: 12px 0 14px; }
    .level-btn { border: none; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--ink-secondary); cursor: pointer; }
    .level-btn.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-sm); }

    .summary-box { background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: var(--radius-md); padding: 13px; color: #1e3a8a; font-size: 13.5px; line-height: 1.65; }
    .step-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px; margin-bottom: 9px; background: var(--surface); }
    .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .step-num { width: 21px; height: 21px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
    .step-note { font-size: 12.5px; color: var(--ink); }
    .step-math { background: var(--surface-subtle); border-radius: 7px; padding: 8px 10px; text-align: center; font-size: 14.5px; overflow-x: auto; }
    .step-cites { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); }
    .cite-link { border: 1px solid var(--primary-border); background: var(--primary-soft); color: var(--primary); border-radius: var(--radius-pill); padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .cite-link:hover { background: var(--primary); color: #fff; }
    .pitfall-box { margin-top: 7px; background: var(--pitfall-bg); border: 1px solid var(--pitfall-border); border-radius: 7px; padding: 7px 10px; font-size: 12px; color: var(--pitfall-ink); }
    .path-banner { background: #fff1f2; border: 1px solid #fda4af; color: #9f1239; border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; }

    .math-fallback { font-family: var(--font-math); font-size: 1.03em; }
    .math-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; font-size: 0.88em; line-height: 1.15; }
    .math-frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 4px 1px; }
    .math-frac > span:last-child { padding: 1px 4px 0; }

    /* 桌面 / 平板 / 手机三端界面适配与预览框架 */
    body.preview-framed {
      background: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 10px 0;
    }
    .app { width: 100%; height: 100dvh; }
    body.preview-framed .app.mode-mobile {
      max-width: 430px;
      height: calc(100dvh - 20px);
      border-radius: 22px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
      background: var(--bg);
    }
    body.preview-framed .app.mode-tablet {
      max-width: 920px;
      height: calc(100dvh - 20px);
      border-radius: 18px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.16);
      background: var(--bg);
    }

    .topbar-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex: 0 1 auto;
    }
    .device-controls { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .mobile-or-tablet-only { display: none; }
    .tablet-only { display: none; }
    .mobile-nav { display: none; }
    .mobile-selected-pill { display: none; }

    /* 平板端（iPad 触控优化，支持一键收起/展开侧边详情抽屉与筛选栏） */
    .app.mode-tablet .topbar { padding: 8px 12px; gap: 8px; }
    .app.mode-tablet .topbar-head { width: 100%; }
    .app.mode-tablet .mobile-or-tablet-only,
    .app.mode-tablet .tablet-only { display: inline-flex; }
    .app.mode-tablet .toolbar { display: none; width: 100%; padding-top: 6px; border-top: 1px solid var(--border); }
    .app.mode-tablet.filters-open .toolbar { display: flex; }
    .app.mode-tablet .step-arrow { display: none; }
    .app.mode-tablet .select-field,
    .app.mode-tablet .toggle-btn,
    .app.mode-tablet .zoom-btn { min-height: 34px; }
    .app.mode-tablet .workspace { grid-template-columns: 1fr 356px; }
    .app.mode-tablet.tablet-drawer-closed .workspace { grid-template-columns: 1fr; }
    .app.mode-tablet.tablet-drawer-closed .drawer { display: none; }
    .app.mode-tablet .path-finder { display: none; }

            "cited_formula_ids": [

              "math.alg.diff_of_squares"

          },
          {
            "step": 2,
            "latex": "= \\frac{b^2 - b^2 + 4ac}{4a^2} = \\frac{c}{a}",
            "note": "抵消 b² 并约去 4a（a ≠ 0）",
            "cited_formula_ids": [],
            "pitfall": "两根之积是 +c/a（无负号），两根之和是 -b/a（带负号）。"

    function getDirectRelations(formulaId, derivPool = MASTER_GRAPH.derivations) {
      const upstream = [], downstream = [], equiv = [];
      derivPool.forEach(d => {
        const isFrom = d.from_formula_ids.includes(formulaId);
        const isTo = d.to_formula_id === formulaId;
        if (!isFrom && !isTo) return;
        if (d.relation_type === "equivalent_to" || d.relation_type === "dual_of") {
          (isTo ? d.from_formula_ids : [d.to_formula_id]).forEach(oid => equiv.push({ formula: formulaById[oid], deriv: d }));
        } else if (isTo) {
          d.from_formula_ids.forEach(oid => upstream.push({ formula: formulaById[oid], deriv: d }));
        } else if (isFrom) {
          downstream.push({ formula: formulaById[d.to_formula_id], deriv: d });
        }
      });
      return { upstream, downstream, equiv };
    }

    function findShortestPath(startId, endId, derivPool) {
      if (startId === endId) return { nodeIds: new Set([startId]), derivIds: new Set(), orderedFormulaIds: [startId], orderedDerivIds: [] };
      const queue = [{ id: startId, pathNodes: [startId], pathDerivs: [] }];
      const visited = new Set([startId]);
      while (queue.length > 0) {
        const cur = queue.shift();
        for (const d of derivPool) {
          const nextCandidates = [];
          if (d.from_formula_ids.includes(cur.id)) nextCandidates.push(d.to_formula_id);
          if (d.bidirectional && d.to_formula_id === cur.id) d.from_formula_ids.forEach(fid => nextCandidates.push(fid));
          for (const nxt of nextCandidates) {
            if (visited.has(nxt)) continue;
            const newNodes = [...cur.pathNodes, nxt];
            const newDerivs = [...cur.pathDerivs, d.id];
            if (nxt === endId) return { nodeIds: new Set(newNodes), derivIds: new Set(newDerivs), orderedFormulaIds: newNodes, orderedDerivIds: newDerivs };
            visited.add(nxt);
            queue.push({ id: nxt, pathNodes: newNodes, pathDerivs: newDerivs });
          }
        }
      }
      return null;
    }

    // 计算子图内每个节点的拓扑深度（带环路保护的最长前置路径层级）
    function computeTopoDepths(nodeIds, derivations) {
      const indeg = {};
      const adj = {};
      nodeIds.forEach(id => { indeg[id] = 0; adj[id] = new Set(); });
      derivations.forEach(d => {
        if (!nodeIds.has(d.to_formula_id)) return;
        d.from_formula_ids.forEach(fid => {
          if (nodeIds.has(fid) && fid !== d.to_formula_id && !adj[fid].has(d.to_formula_id)) {
            adj[fid].add(d.to_formula_id);
            indeg[d.to_formula_id] += 1;
          }
        });
      });

      const depth = {};
      const q = [];
      nodeIds.forEach(id => {
        if (indeg[id] === 0) { depth[id] = 0; q.push(id); }
      });

      while (q.length > 0) {
        const u = q.shift();
        adj[u].forEach(v => {
          depth[v] = Math.max(depth[v] || 0, (depth[u] || 0) + 1);
          indeg[v] -= 1;
          if (indeg[v] === 0) q.push(v);
        });
      }
      // 环路或等价双向边兜底
      nodeIds.forEach(id => { if (depth[id] === undefined) depth[id] = 1; });
      return depth;
    }

      }

      const coreIds = new Set(matched.map(f => f.id));
      const bridgeIds = new Set();
      const isSubset = coreIds.size > 0 && coreIds.size < MASTER_GRAPH.formulas.length;

      // 可选：动态带出 1 跳跨界桥梁节点（前置来源 + 直接延伸）
      if (state.includeBridges && isSubset) {
        MASTER_GRAPH.derivations.forEach(d => {
          const toIn = coreIds.has(d.to_formula_id);
          const fromIn = d.from_formula_ids.some(fid => coreIds.has(fid));
          if (toIn) {
            d.from_formula_ids.forEach(fid => { if (!coreIds.has(fid)) bridgeIds.add(fid); });
          }
          if (fromIn && !toIn) {
            bridgeIds.add(d.to_formula_id);
          }
        });
      }

      let activeIds = new Set([...coreIds, ...bridgeIds]);

      // 仅看直接关联模式：基于当前选中节点再做一轮局部收敛
      if (state.focusOnly && state.selectedFormulaId && activeIds.has(state.selectedFormulaId)) {
        const rel = getDirectRelations(state.selectedFormulaId, MASTER_GRAPH.derivations);
        const focusSet = new Set([state.selectedFormulaId]);
        [...rel.upstream, ...rel.downstream, ...rel.equiv].forEach(r => {
          if (activeIds.has(r.formula.id)) focusSet.add(r.formula.id);
        });
        activeIds = focusSet;
      }

      const visibleFormulas = MASTER_GRAPH.formulas.filter(f => activeIds.has(f.id));
      const visibleDerivations = MASTER_GRAPH.derivations.filter(d =>
        activeIds.has(d.to_formula_id) && d.from_formula_ids.some(fid => activeIds.has(fid))
      );

      // 若选中公式不在新视图内，自动选择当前视图中连接度最高的核心公式
      if (visibleFormulas.length > 0 && !activeIds.has(state.selectedFormulaId)) {
        const deg = {};
        visibleFormulas.forEach(f => { deg[f.id] = 0; });
        visibleDerivations.forEach(d => {
          if (deg[d.to_formula_id] !== undefined) deg[d.to_formula_id] += 1;
          d.from_formula_ids.forEach(fid => { if (deg[fid] !== undefined) deg[fid] += 1; });
        });
        const best = visibleFormulas.slice().sort((a, b) => (deg[b.id] - deg[a.id]))[0];
        state.selectedFormulaId = best.id;
        state.activePath = null;
        document.getElementById("clearPathBtn").style.display = "none";
      }

      // 决定生效布局模式
      let effectiveMode = state.layoutMode;
      if (effectiveMode === "auto") {
        if (state.topicFilter !== "all" || visibleFormulas.length <= 14) effectiveMode = "topo";
        else if (state.branchFilter !== "all") effectiveMode = "topic";
        else effectiveMode = "branch";
      }

      const depths = computeTopoDepths(activeIds, visibleDerivations);
      const columnsMap = new Map();

      const addToCol = (key, label, sortOrder, formula, isBridgeLane = false) => {
        if (!columnsMap.has(key)) columnsMap.set(key, { key, label, sortOrder, isBridgeLane, items: [] });
        columnsMap.get(key).items.push(formula);
      };

      visibleFormulas.forEach(f => {
        const isBridge = bridgeIds.has(f.id);
        if (effectiveMode === "topo") {
          const lvl = depths[f.id] || 0;
          const lbl = lvl === 0 ? "第 1 层 · 公理 / 定义起点" : `第 ${lvl + 1} 层 · 推导层`;
          addToCol(`topo_${lvl}`, lbl, lvl, f, false);
        } else if (effectiveMode === "topic") {
          if (isBridge) {
            addToCol("bridge_ext", "跨界桥梁 · 外部关联", 9999, f, true);
          } else {
            const tp = TOPIC_BY_ID[f._primaryTopic];
            addToCol(f._primaryTopic, tp ? tp.label : "其他专题", tp ? tp.order : 999, f, false);
          }
        } else if (effectiveMode === "stage") {
          const st = f._primaryStage;
          addToCol(st, `${STAGE_LABELS[st] || st}阶段`, STAGE_ORDER[st] ?? 99, f, isBridge);
        } else {
          // branch
          if (isBridge) {
            addToCol("bridge_ext", "跨界桥梁 · 外部关联", 9999, f, true);
          } else {
            const br = BRANCH_BY_ID[f._primaryBranch];
            const lbl = br ? `${br.disciplineLabel} · ${br.label}` : "其他分支";
            addToCol(f._primaryBranch, lbl, br ? br.order : 999, f, false);
          }
        }
      });

      const sortedCols = [...columnsMap.values()].sort((a, b) => a.sortOrder - b.sortOrder);
      const { colGap, rowGap } = DENSITY_CFG[state.density] || DENSITY_CFG.standard;

      const positions = {};
      const lanes = [];
      let colX = 24;
      let maxRows = 1;

      sortedCols.forEach(col => {
        col.items.sort((a, b) => {
          const da = depths[a.id] || 0, db = depths[b.id] || 0;
          if (da !== db) return da - db;
          const ta = TOPIC_BY_ID[a._primaryTopic]?.order ?? 999;
          const tb = TOPIC_BY_ID[b._primaryTopic]?.order ?? 999;
          return ta - tb;
        });

        // 若单列超过 11 个节点，自动拆分为双列以保持画布纵横比协调
        const MAX_PER_COL = 11;
        const chunks = [];
        for (let i = 0; i < col.items.length; i += MAX_PER_COL) {
          chunks.push(col.items.slice(i, i + MAX_PER_COL));
        }
        chunks.forEach((chunk, cIdx) => {
          const suffix = chunks.length > 1 ? ` (${cIdx + 1}/${chunks.length})` : "";
          lanes.push({ x: colX, label: `${col.label}${suffix} · ${chunk.length}`, isBridgeLane: col.isBridgeLane });
          maxRows = Math.max(maxRows, chunk.length);
          chunk.forEach((f, r) => {
            positions[f.id] = { x: colX, y: 46 + r * rowGap };
          });
          colX += colGap;
        });
      });

      const stageW = Math.max(540, colX + 20);
      const stageH = Math.max(360, 46 + maxRows * rowGap + 44);

      currentView = {
        coreIds, bridgeIds, visibleFormulas, visibleDerivations,
        positions, lanes, stageW, stageH, effectiveMode
      };

      // 更新动态视图面包屑与统计信息
      const crumbs = [];
      if (state.stageFilter !== "all") crumbs.push(STAGE_LABELS[state.stageFilter]);
      if (state.discFilter !== "all") crumbs.push(DISC_BY_ID[state.discFilter]?.label || state.discFilter);
      if (state.branchFilter !== "all") crumbs.push(BRANCH_BY_ID[state.branchFilter]?.label || state.branchFilter);
      if (state.topicFilter !== "all") crumbs.push(TOPIC_BY_ID[state.topicFilter]?.label || state.topicFilter);
      const scopeText = crumbs.length ? crumbs.join(" › ") : "全学段全学科总图";
      const bridgeNote = bridgeIds.size > 0 ? ` + ${bridgeIds.size} 跨界桥梁` : "";

      document.getElementById("statsSubtitle").textContent =
        `${scopeText} · ${coreIds.size} 核心公式${bridgeNote} · ${visibleDerivations.length} 条推导`;
      document.getElementById("viewBadge").textContent =
        `已生成：${crumbs.length ? crumbs[crumbs.length - 1] : "全量"}视图`;
      document.getElementById("layoutHint").textContent =
        `当前布局：${LAYOUT_LABELS[effectiveMode]}（${lanes.length} 列）`;

      // 同步最短路径下拉框为当前动态视图内的公式
      const startSel = document.getElementById("pathStart");
      const endSel = document.getElementById("pathEnd");
      const prevStart = startSel.value;
      const prevEnd = endSel.value;
      startSel.innerHTML = "";
      endSel.innerHTML = "";
      visibleFormulas.forEach(f => {
        startSel.add(new Option(f.name, f.id));
        endSel.add(new Option(f.name, f.id));
      });
      if (visibleFormulas.length > 0) {
        startSel.value = activeIds.has(prevStart) ? prevStart : visibleFormulas[0].id;
        endSel.value = activeIds.has(prevEnd) ? prevEnd : visibleFormulas[visibleFormulas.length - 1].id;
      }

      if (autoFit) fitViewToCanvas();
      else applyZoom();
      renderGraph();
      renderDrawer();
    }

    function fitViewToCanvas() {
      const scroller = document.getElementById("graphScroll");
      const availW = Math.max(320, scroller.clientWidth - 40);
      const availH = Math.max(260, scroller.clientHeight - 40);
      const ratio = Math.min(availW / currentView.stageW, availH / currentView.stageH);
      state.zoom = +Math.max(0.38, Math.min(1.0, ratio)).toFixed(2);
      applyZoom();
    }

    function applyZoom() {
      const wrap = document.getElementById("zoomWrap");
      wrap.style.transform = `scale(${state.zoom})`;
      wrap.style.width = `${currentView.stageW * state.zoom}px`;
      wrap.style.height = `${currentView.stageH * state.zoom}px`;
      document.getElementById("zoomVal").textContent = `${Math.round(state.zoom * 100)}%`;
    }

    function computeCurve(fromPos, toPos) {
      const sameCol = Math.abs(fromPos.x - toPos.x) < 10;
      if (sameCol) {
        const goingDown = toPos.y > fromPos.y;
        const x1 = fromPos.x + NODE_W / 2;
        const y1 = goingDown ? fromPos.y + NODE_H : fromPos.y;
        const x2 = toPos.x + NODE_W / 2;
        const y2 = goingDown ? toPos.y : toPos.y + NODE_H;
        const offset = Math.abs(y2 - y1) > 160 ? 52 : 0;
        const cx = x1 + offset;
        const cy = (y1 + y2) / 2;
        return { d: `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, mx: (x1 + cx) / 2, my: cy };
      }
      const goingRight = toPos.x > fromPos.x;
      const x1 = goingRight ? fromPos.x + NODE_W : fromPos.x;
      const y1 = fromPos.y + NODE_H / 2;
      const x2 = goingRight ? toPos.x : toPos.x + NODE_W;
      const y2 = toPos.y + NODE_H / 2;
      const c = Math.min(Math.abs(x2 - x1) * 0.42, 160);
      const cx1 = goingRight ? x1 + c : x1 - c;
      const cx2 = goingRight ? x2 - c : x2 + c;
      return { d: `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
    }

    function renderGraph() {
      const stage = document.getElementById("graphStage");
      const laneLayer = document.getElementById("laneLayer");
      const edgeLayer = document.getElementById("edgeLayer");
      const nodeLayer = document.getElementById("nodeLayer");

      stage.style.width = `${currentView.stageW}px`;
      stage.style.height = `${currentView.stageH}px`;
      document.getElementById("graphSvg").setAttribute("viewBox", `0 0 ${currentView.stageW} ${currentView.stageH}`);

      laneLayer.innerHTML = currentView.lanes.map(l =>
        `<div class="lane-header ${l.isBridgeLane ? "bridge-lane" : ""}" style="left:${l.x}px" title="${l.label}">${l.label}</div>`
      ).join("");
      edgeLayer.innerHTML = "";
      nodeLayer.innerHTML = "";

      if (currentView.visibleFormulas.length === 0) {
        nodeLayer.innerHTML = `<div class="empty-state">当前筛选条件下暂无匹配公式，请调整学段、学科、分支或清空搜索词。</div>`;
        return;
      }

      const selId = state.selectedFormulaId;
      const directRels = selId ? getDirectRelations(selId, currentView.visibleDerivations) : { upstream: [], downstream: [], equiv: [] };
      const upstreamIds = new Set(directRels.upstream.map(r => r.formula.id));
      const downstreamIds = new Set(directRels.downstream.map(r => r.formula.id));
      const equivIds = new Set(directRels.equiv.map(r => r.formula.id));
      const directDerivIds = new Set([
        ...directRels.upstream.map(r => r.deriv.id),
        ...directRels.downstream.map(r => r.deriv.id),
        ...directRels.equiv.map(r => r.deriv.id)
      ]);

      currentView.visibleDerivations.forEach(d => {
        const toPos = currentView.positions[d.to_formula_id];
        if (!toPos) return;
        let edgeClass = d.dependency_site === "application_level" ? "edge-path cross-app" : "edge-path";
        let marker = "url(#arrow-default)";
        let showPill = false;

        if (state.activePath) {
          if (state.activePath.derivIds.has(d.id)) { edgeClass += " highlight-path"; marker = "url(#arrow-path)"; showPill = true; }
          else edgeClass += " dimmed";
        } else if (state.activeTab === "derivation" && state.selectedDerivId === d.id) {
          edgeClass += " highlight-primary"; marker = "url(#arrow-primary)"; showPill = true;
        } else if (selId) {
          if (directDerivIds.has(d.id)) {
            showPill = true;
            if (d.relation_type === "counterexample_to") { edgeClass += " highlight-counter"; marker = "url(#arrow-path)"; }
            else if (d.relation_type === "equivalent_to" || d.relation_type === "dual_of") { edgeClass += " highlight-equiv"; marker = "url(#arrow-equiv)"; }
            else if (d.to_formula_id === selId) { edgeClass += " highlight-upstream"; marker = "url(#arrow-upstream)"; }
            else { edgeClass += " highlight-downstream"; marker = "url(#arrow-downstream)"; }
          } else edgeClass += " dimmed";
        }

        let pillAnchor = null;
        d.from_formula_ids.forEach(fid => {
          const fromPos = currentView.positions[fid];
          if (!fromPos) return;
          const curve = computeCurve(fromPos, toPos);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", curve.d);
          path.setAttribute("class", edgeClass);
          path.setAttribute("marker-end", marker);
          if (d.bidirectional && d.from_formula_ids.length === 1) path.setAttribute("marker-start", marker);
          edgeLayer.appendChild(path);
          if (!pillAnchor) pillAnchor = { x: curve.mx, y: curve.my };
        });

        if (showPill && pillAnchor) {
          const pill = document.createElement("button");
          pill.className = `edge-pill ${state.selectedDerivId === d.id && state.activeTab === "derivation" ? "selected" : ""}`;
          pill.style.left = `${pillAnchor.x}px`;
          pill.style.top = `${pillAnchor.y}px`;
          const prefix = d.from_formula_ids.length > 1 ? `组合(${d.from_formula_ids.length})·` : "";
          pill.textContent = `${prefix}${REL_LABELS[d.relation_type]}`;
          pill.onclick = (e) => { e.stopPropagation(); selectDerivation(d.id); };
          nodeLayer.appendChild(pill);
        }
      });

      currentView.visibleFormulas.forEach(f => {
        const pos = currentView.positions[f.id];
        const isBridge = currentView.bridgeIds.has(f.id);
        const card = document.createElement("div");
        let cls = "formula-node";
        if (isBridge) cls += " bridge-node";
        if (state.activePath) cls += state.activePath.nodeIds.has(f.id) ? " rel-path" : " dimmed";
        else if (selId === f.id) cls += " selected";
        else if (selId) {
          if (equivIds.has(f.id)) cls += " rel-equiv";
          else if (upstreamIds.has(f.id)) cls += " rel-upstream";
          else if (downstreamIds.has(f.id)) cls += " rel-downstream";
          else cls += " dimmed";
        }

        const rel = getDirectRelations(f.id, currentView.visibleDerivations);
        const stageText = f.taxonomy.education_stages.map(s => STAGE_LABELS[s] || s).join("·");
        const dList = f.taxonomy.disciplines;
        const hasMath = dList.includes("mathematics"), hasPhys = dList.includes("physics"), hasChem = dList.includes("chemistry");
        let discLabel = "数学", discCls = "disc-math";
        if (hasPhys && hasChem) { discLabel = "物理 ↔ 化学"; discCls = "disc-chem"; }
        else if (hasMath && hasPhys) { discLabel = "数学 ↔ 物理"; discCls = "disc-math"; }
        else if (hasChem) { discLabel = "化学"; discCls = "disc-chem"; }
        else if (hasPhys) { discLabel = "物理"; discCls = "disc-phys"; }

        const mathLen = f.latex.replace(/\\[a-zA-Z]+/g, "x").length;
        const mathCls = mathLen > 46 ? "node-math xlong-math" : (mathLen > 28 ? "node-math long-math" : "node-math");
        card.className = cls;
        card.style.left = `${pos.x}px`;
        card.style.top = `${pos.y}px`;
        const nKind = f.node_kind || "formula";
        const kindTag = nKind !== "formula" ? `<span class="kind-pill kind-${nKind}">${NODE_KIND_LABELS[nKind] || nKind}</span>` : "";
        card.innerHTML = `
          <div class="node-head">
            <span class="node-title" title="${f.name}">${kindTag}${f.name}</span>
            <span class="node-badge ${isBridge ? "bridge-tag" : ""}">${isBridge ? "跨界桥梁" : `↑${rel.upstream.length} ↓${rel.downstream.length + rel.equiv.length}`}</span>
          </div>
          <div class="${mathCls}">${renderMathHTML(f.latex)}</div>
          <div class="node-foot">
            <span class="node-tag ${discCls}">${discLabel}</span>
            <span>${stageText}</span>
          </div>
        `;
        card.onclick = () => selectFormula(f.id);
        nodeLayer.appendChild(card);
      });
    }

    function renderDrawer() {
      const body = document.getElementById("drawerBody");
      document.querySelectorAll(".drawer-tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === state.activeTab));

      let pathBannerHTML = "";
      if (state.activePath) {
        const chainText = state.activePath.orderedFormulaIds.map(id => formulaById[id].name).join(" → ");
        const stepBtns = (state.activePath.orderedDerivIds || []).map((did, i) =>
          `<button class="cite-link" onclick="selectDerivation('${did}')">第 ${i + 1} 步推导</button>`
        ).join(" ");
        pathBannerHTML = `<div class="path-banner"><strong>最短推导路径（${state.activePath.orderedFormulaIds.length - 1} 跳）：</strong><br/>${chainText}<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;">${stepBtns}</div></div>`;
      }

      if (state.activeTab === "formula") {
        const f = formulaById[state.selectedFormulaId] || currentView.visibleFormulas[0] || MASTER_GRAPH.formulas[0];
        const rel = getDirectRelations(f.id, MASTER_GRAPH.derivations);
        const branchTags = [...f._branches].map(bid => BRANCH_BY_ID[bid]?.label || bid);
        const topicTags = [...f._canonicalTopics].map(tid => TOPIC_BY_ID[tid]?.label || tid);

        const renderRelGroup = (items, kindCls, kindText) => items.map(item => `
          <div class="rel-card">
            <div class="rel-card-top">
              <strong style="font-size:12.5px">${item.formula.name}</strong>
              <span class="rel-kind ${kindCls}">${kindText} · ${REL_LABELS[item.deriv.relation_type]}</span>
            </div>
            <div style="font-size:12.5px; color:var(--ink-secondary);">${renderMathHTML(item.formula.latex)}</div>
            <div class="rel-actions">
              <button class="mini-btn primary" onclick="selectDerivation('${item.deriv.id}')">查看 L1/L2/L3 推导</button>
              <button class="mini-btn" onclick="jumpToFormula('${item.formula.id}')">聚焦该公式</button>
            </div>
          </div>
        `).join("");

        const varsRows = f.variables.map(v => `
          <tr>
            <td>${renderMathHTML(v.symbol)}</td>
            <td>${v.name}</td>
            <td><code>${v.quantity_kind || "-"}</code></td>
            <td><code>${v.dimension || "-"}</code></td>
            <td><strong>${v.si_unit || "-"}</strong></td>
          </tr>
        `).join("");

        body.innerHTML = `
          ${pathBannerHTML}
          <div class="hero-card">
            <h2 class="hero-title">${f.name}</h2>
            <div class="hero-aliases">别名：${f.aliases.join(" / ") || "无"}</div>
            <div class="hero-math">${renderMathHTML(f.latex)}</div>
            <div style="font-size:12.5px; color:var(--ink-secondary);">${f.statement}</div>
            <div class="meta-row">
              <span class="chip">类型：${NODE_KIND_LABELS[f.node_kind || "formula"] || "公式"}</span>
              ${f.taxonomy.education_stages.map(s => `<span class="chip">学段：${STAGE_LABELS[s] || s}</span>`).join("")}
              ${branchTags.map(b => `<span class="chip">分支：${b}</span>`).join("")}
              ${topicTags.map(t => `<span class="chip">专题：${t}</span>`).join("")}
              <span class="chip verified">✓ 已核验</span>
              <span class="chip">出处：${f.review.source}</span>
            </div>
          </div>

          <div class="section-label">变量与物理量纲（MathModDB 跨学科标准）</div>
          <table class="var-table">
            <thead>
              <tr><th>符号</th><th>物理/数学量</th><th>量类</th><th>量纲</th><th>SI 单位</th></tr>
            </thead>
            <tbody>${varsRows}</tbody>
          </table>

          <div class="section-label">适用条件</div>
          <div style="font-size:12.5px; color:var(--ink-secondary);">${f.conditions.join("；")}</div>

          ${f.intuition ? `<div class="section-label">直觉理解</div><div class="summary-box" style="font-size:12.5px; padding:10px 12px;">${f.intuition}</div>` : ""}
          ${f.worked_example ? `<div class="section-label">极简数值算例</div><div class="step-card" style="font-size:12.5px; color:var(--ink-secondary); margin-bottom:0;">${f.worked_example}</div>` : ""}
          ${f.applications && f.applications.length ? `<div class="section-label">典型应用场景</div><div class="meta-row">${f.applications.map(a => `<span class="chip">${a}</span>`).join("")}</div>` : ""}

          <div class="section-label">全库直接关联公式（共 ${rel.upstream.length + rel.downstream.length + rel.equiv.length} 条）</div>
          ${renderRelGroup(rel.upstream, "upstream", "前置依赖")}
          ${renderRelGroup(rel.downstream, "downstream", "直接衍生")}
          ${renderRelGroup(rel.equiv, "equiv", "双向等价")}
        `;
      } else {
        const d = derivById[state.selectedDerivId] || currentView.visibleDerivations[0] || MASTER_GRAPH.derivations[0];
        const fromCards = d.from_formula_ids.map(id => {
          const f = formulaById[id];
          return `<button class="cite-link" onclick="jumpToFormula('${f.id}')">${f.name}</button>`;
        }).join(" + ");
        const toF = formulaById[d.to_formula_id];

        let levelContent = "";
        if (state.level === "L1") {
          levelContent = `<div class="summary-box"><strong>核心变换思路：</strong><br/>${d.levels.L1_summary}</div>`;
        } else {
          const steps = state.level === "L2" ? d.levels.L2_standard : d.levels.L3_detailed;
          levelContent = steps.map(st => `
            <div class="step-card">
              <div class="step-head">
                <span class="step-num">${st.step}</span>
                <span class="step-note">${st.note}</span>
              </div>
              <div class="step-math">${renderMathHTML(st.latex)}</div>
              ${st.cited_formula_ids && st.cited_formula_ids.length ? `
                <div class="step-cites">
                  <span>引用公式：</span>
                  ${st.cited_formula_ids.map(cid => `<button class="cite-link" onclick="jumpToFormula('${cid}')">${formulaById[cid]?.name || cid}</button>`).join("")}
                </div>
              ` : ""}
              ${st.pitfall ? `<div class="pitfall-box"><strong>易错提醒：</strong>${st.pitfall}</div>` : ""}
            </div>
          `).join("");
        }

        body.innerHTML = `
          ${pathBannerHTML}
          <div class="hero-card">
            <div style="font-size:12px; color:var(--ink-muted); margin-bottom:6px;">推导关系 · ${d.from_formula_ids.length > 1 ? `多对一组合推导（${d.from_formula_ids.length} 条前提）` : "二元推导"}</div>
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px;">
              ${fromCards}
              <span style="font-weight:700; color:var(--primary);">${d.bidirectional ? "⇄" : "→"}</span>
              <button class="cite-link" onclick="jumpToFormula('${toF.id}')">${toF.name}</button>
            </div>
            <div class="meta-row">
              <span class="chip">关系：${REL_LABELS[d.relation_type]}</span>
              <span class="chip">层级：${SITE_LABELS[d.dependency_site]}</span>
              ${d.inference_rules.map(r => `<span class="chip rule">${r}</span>`).join("")}
            </div>
          </div>

          <div class="level-switcher">
            <button class="level-btn ${state.level === "L1" ? "active" : ""}" onclick="setLevel('L1')">L1 摘要级</button>
            <button class="level-btn ${state.level === "L2" ? "active" : ""}" onclick="setLevel('L2')">L2 标准级</button>
            <button class="level-btn ${state.level === "L3" ? "active" : ""}" onclick="setLevel('L3')">L3 详细级</button>
          </div>

          ${levelContent}
        `;
      }
    }

    function selectFormula(id) {
      state.selectedFormulaId = id;
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      if (state.focusOnly) generateDynamicView(false);
      else { renderGraph(); renderDrawer(); }
    }

    // 若点击的跨界公式不在当前筛选视图中，自动开启跨界桥梁或放宽筛选以平滑定位
    function jumpToFormula(id) {
      state.selectedFormulaId = id;
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      if (!currentView.positions[id]) {
        state.stageFilter = "all";
        state.discFilter = "all";
        state.branchFilter = "all";
        state.topicFilter = "all";
        state.searchQuery = "";
        document.getElementById("searchInput").value = "";
        syncCascadingDropdowns();
        generateDynamicView(true);
      } else {
        renderGraph();
        renderDrawer();
      }
    }

    function selectDerivation(id) {
      state.selectedDerivId = id;
      state.activeTab = "derivation";
      renderGraph();
      renderDrawer();
    }

    function setLevel(lvl) {
      state.level = lvl;
      renderDrawer();
    }

    function initControls() {
      document.getElementById("stageSelect").onchange = (e) => {
        state.stageFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("discSelect").onchange = (e) => {
        state.discFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("branchSelect").onchange = (e) => {
        state.branchFilter = e.target.value;
        syncCascadingDropdowns();
        generateDynamicView(true);
      };
      document.getElementById("topicSelect").onchange = (e) => {
        state.topicFilter = e.target.value;
        generateDynamicView(true);
      };
      document.getElementById("searchInput").oninput = (e) => {
        state.searchQuery = e.target.value;
        generateDynamicView(false);
      };

      document.getElementById("layoutModeSelect").onchange = (e) => {
        state.layoutMode = e.target.value;
        generateDynamicView(true);
      };
      document.getElementById("densitySelect").onchange = (e) => {
        state.density = e.target.value;
        generateDynamicView(false);
      };

      const bridgeBtn = document.getElementById("bridgeBtn");
      bridgeBtn.onclick = () => {
        state.includeBridges = !state.includeBridges;
        bridgeBtn.classList.toggle("active", state.includeBridges);
        generateDynamicView(true);
      };

      const focusBtn = document.getElementById("focusOnlyBtn");
      focusBtn.onclick = () => {
        state.focusOnly = !state.focusOnly;
        focusBtn.classList.toggle("active", state.focusOnly);
        generateDynamicView(true);
      };

      document.getElementById("resetBtn").onclick = () => {
        state.stageFilter = "all";
        state.discFilter = "all";
        state.branchFilter = "all";
        state.topicFilter = "all";
        state.searchQuery = "";
        state.layoutMode = "auto";
        state.includeBridges = false;
        state.focusOnly = false;
        state.activePath = null;
        document.getElementById("searchInput").value = "";
        document.getElementById("layoutModeSelect").value = "auto";
        bridgeBtn.classList.remove("active");
        focusBtn.classList.remove("active");
        document.getElementById("clearPathBtn").style.display = "none";
        syncCascadingDropdowns();
        generateDynamicView(true);
      };

      document.querySelectorAll(".drawer-tab").forEach(btn => {
        btn.onclick = () => { state.activeTab = btn.dataset.tab; renderGraph(); renderDrawer(); };
      });

      document.getElementById("findPathBtn").onclick = () => {
        const res = findShortestPath(
          document.getElementById("pathStart").value,
          document.getElementById("pathEnd").value,
          currentView.visibleDerivations
        );
        if (!res) { alert("当前动态视图中未找到这两个公式之间的推导路径（可尝试开启「带出跨界桥梁」或放宽筛选范围）。"); return; }
        state.activePath = res;
        document.getElementById("clearPathBtn").style.display = "inline-block";
        renderGraph();
        renderDrawer();
      };
      document.getElementById("clearPathBtn").onclick = () => {
        state.activePath = null;
        document.getElementById("clearPathBtn").style.display = "none";
        renderGraph();
        renderDrawer();
      };

      document.getElementById("zoomOutBtn").onclick = () => { state.zoom = Math.max(0.32, +(state.zoom - 0.1).toFixed(2)); applyZoom(); };
      document.getElementById("zoomInBtn").onclick = () => { state.zoom = Math.min(1.25, +(state.zoom + 0.1).toFixed(2)); applyZoom(); };
      document.getElementById("zoomFitBtn").onclick = () => fitViewToCanvas();
    }

    // URL 状态双向同步（支持将任意动态视图以链接形式分享）
    function buildShareURL() {
      const params = new URLSearchParams();
      if (state.stageFilter !== "all") params.set("stage", state.stageFilter);
      if (state.discFilter !== "all") params.set("disc", state.discFilter);
      if (state.branchFilter !== "all") params.set("branch", state.branchFilter);
      if (state.topicFilter !== "all") params.set("topic", state.topicFilter);
      if (state.searchQuery.trim()) params.set("q", state.searchQuery.trim());
      if (state.layoutMode !== "auto") params.set("layout", state.layoutMode);
      if (state.density !== "standard") params.set("density", state.density);
      if (state.includeBridges) params.set("bridges", "1");
      if (state.focusOnly) params.set("focus", "1");
      if (state.selectedFormulaId) params.set("formula", state.selectedFormulaId);
      if (state.activeTab === "derivation" && state.selectedDerivId) {
        params.set("tab", "derivation");
        params.set("deriv", state.selectedDerivId);
      }
      if (state.level !== "L2") params.set("level", state.level);
      if (state.deviceMode !== "auto") params.set("ui", state.deviceMode);
      const qs = params.toString();
      const base = window.location.origin === "null"
        ? window.location.href.split("?")[0]
        : window.location.origin + window.location.pathname;
      return qs ? `${base}?${qs}` : base;
    }

    function syncStateToURL() {
      if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
      try { window.history.replaceState(null, "", buildShareURL()); } catch (e) {}
    }

    function restoreStateFromURL() {
      const params = new URLSearchParams(window.location.search);
      if (!params.toString()) return;
      if (params.get("stage")) state.stageFilter = params.get("stage");
      if (params.get("disc")) state.discFilter = params.get("disc");
      if (params.get("branch")) state.branchFilter = params.get("branch");
      if (params.get("topic")) state.topicFilter = params.get("topic");
      if (params.get("q")) {
        state.searchQuery = params.get("q");
        document.getElementById("searchInput").value = state.searchQuery;
      }
      if (["auto", "topo", "topic", "branch", "stage"].includes(params.get("layout"))) {
        state.layoutMode = params.get("layout");
        document.getElementById("layoutModeSelect").value = state.layoutMode;
      }
      if (["compact", "standard", "spacious"].includes(params.get("density"))) {
        state.density = params.get("density");
        document.getElementById("densitySelect").value = state.density;
      }
      if (params.get("bridges") === "1") {
        state.includeBridges = true;
        document.getElementById("bridgeBtn").classList.add("active");
      }
      if (params.get("focus") === "1") {
        state.focusOnly = true;
        document.getElementById("focusOnlyBtn").classList.add("active");
      }
      if (params.get("formula") && formulaById[params.get("formula")]) {
        state.selectedFormulaId = params.get("formula");
      }
      if (params.get("tab") === "derivation" && params.get("deriv") && derivById[params.get("deriv")]) {
        state.activeTab = "derivation";
        state.selectedDerivId = params.get("deriv");
      }
      if (["L1", "L2", "L3"].includes(params.get("level"))) {
        state.level = params.get("level");
      }
      if (["auto", "desktop", "tablet", "mobile"].includes(params.get("ui"))) {
        state.deviceMode = params.get("ui");
      }
    }

    // 分享当前动态视图按钮
    document.getElementById("shareViewBtn").onclick = async () => {
      const url = buildShareURL();
      const btn = document.getElementById("shareViewBtn");
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = "✓ 已复制链接";
        btn.classList.add("active");
        setTimeout(() => { btn.textContent = "🔗 分享视图"; btn.classList.remove("active"); }, 1800);
      } catch (e) {
        window.prompt("复制下方链接即可直达当前动态视图：", url);
      }
    };

    // PWA 安装提示与 Service Worker 注册（仅在 http/https 环境下启用）
    let deferredInstallPrompt = null;
    const installBtn = document.getElementById("installPwaBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.style.display = "inline-flex";
    });
    installBtn.onclick = async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = "none";
    };
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // 设备界面模式管理：auto（按视口自动识别）/ desktop / tablet / mobile
    function getEffectiveDevice() {
      if (state.deviceMode !== "auto") return state.deviceMode;
      const w = window.innerWidth;
      if (w <= 680) return "mobile";
      if (w <= 1080) return "tablet";
      return "desktop";
    }

    function applyDeviceMode(reFit = true) {
      const eff = getEffectiveDevice();
      const appEl = document.getElementById("appRoot");
      document.body.classList.toggle("preview-framed", state.deviceMode !== "auto" && (
        (state.deviceMode === "mobile" && window.innerWidth > 560) ||
        (state.deviceMode === "tablet" && window.innerWidth > 1020)
      ));
      appEl.classList.remove("mode-desktop", "mode-tablet", "mode-mobile");
      appEl.classList.add(`mode-${eff}`);

      if (eff === "mobile") {
        appEl.classList.toggle("filters-open", state.filtersOpen);
        appEl.dataset.mobilePane = state.mobilePane;
      } else if (eff === "tablet") {
        appEl.classList.toggle("filters-open", state.filtersOpen);
        appEl.classList.toggle("tablet-drawer-closed", !state.tabletDrawerOpen);
      } else {
        appEl.classList.remove("filters-open", "tablet-drawer-closed");
      }

      document.querySelectorAll(".mobile-nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.pane === state.mobilePane);
      });
      const drawerBtn = document.getElementById("tabletDrawerBtn");
      if (drawerBtn) {
        drawerBtn.classList.toggle("active", state.tabletDrawerOpen);
        drawerBtn.textContent = state.tabletDrawerOpen ? "◧ 收起详情" : "◧ 展开详情";
      }
      const filterBtn = document.getElementById("filterToggleBtn");
      if (filterBtn) filterBtn.classList.toggle("active", state.filtersOpen);

      updateMobileSelectedPill();
      if (reFit) setTimeout(() => fitViewToCanvas(), 40);
    }

    function updateMobileSelectedPill() {
      const pill = document.getElementById("mobileSelectedPill");
      if (!pill) return;
      const f = formulaById[state.selectedFormulaId];
      if (!f) { pill.style.display = "none"; return; }
      pill.style.display = "";
      document.getElementById("mobilePillTitle").textContent = f.name;
    }

    function setMobilePane(pane) {
      state.mobilePane = pane;
      if (pane === "formula") { state.activeTab = "formula"; renderDrawer(); }
      else if (pane === "derivation") { state.activeTab = "derivation"; renderDrawer(); }
      applyDeviceMode(pane === "canvas");
    }

    document.getElementById("deviceModeSelect").onchange = (e) => {
      state.deviceMode = e.target.value;
      try { localStorage.setItem("fg_device_mode", state.deviceMode); } catch (err) {}
      if (state.deviceMode === "mobile") { state.filtersOpen = false; state.mobilePane = "canvas"; }
      else if (state.deviceMode === "tablet") { state.filtersOpen = false; state.tabletDrawerOpen = true; }
      applyDeviceMode(true);
      syncStateToURL();
    };
    document.getElementById("filterToggleBtn").onclick = () => {
      state.filtersOpen = !state.filtersOpen;
      applyDeviceMode(false);
    };
    document.getElementById("tabletDrawerBtn").onclick = () => {
      state.tabletDrawerOpen = !state.tabletDrawerOpen;
      applyDeviceMode(true);
    };
    document.querySelectorAll(".mobile-nav-btn").forEach(btn => {
      btn.onclick = () => setMobilePane(btn.dataset.pane);
    });
    document.getElementById("mobilePillAction").onclick = () => setMobilePane("formula");
    window.addEventListener("resize", () => {
      if (state.deviceMode === "auto") applyDeviceMode(false);
    });

    const _origSelectFormula = selectFormula;
    selectFormula = (id) => {
      _origSelectFormula(id);
      updateMobileSelectedPill();
    };
    const _origSelectDerivation = selectDerivation;
    selectDerivation = (id) => {
      _origSelectDerivation(id);
      if (getEffectiveDevice() === "mobile") setMobilePane("derivation");
    };

    const _baseRenderDrawer = renderDrawer;
    renderDrawer = () => { _baseRenderDrawer(); updateMobileSelectedPill(); syncStateToURL(); };

    window.__katexReady = () => { renderGraph(); renderDrawer(); };
    initControls();
    try {
      const savedMode = localStorage.getItem("fg_device_mode");
      if (["auto", "desktop", "tablet", "mobile"].includes(savedMode)) {
        state.deviceMode = savedMode;
        document.getElementById("deviceModeSelect").value = savedMode;
      }
    } catch (err) {}
    restoreStateFromURL();
    document.getElementById("deviceModeSelect").value = state.deviceMode;
    syncCascadingDropdowns();
    generateDynamicView(false);
    applyDeviceMode(true);
  </script>
</body>
</html>
