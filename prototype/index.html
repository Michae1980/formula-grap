<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="数理图谱" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>数理知识图谱 · 动态视图引擎</title>
  <!-- 在线时自动加载 KaTeX 渲染出版级数学公式；离线时无缝回退到内置原生公式渲染器 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.__katexReady && window.__katexReady()"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-subtle: #f1f4f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --ink-secondary: #475569;
      --ink-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #93c5fd;
      --upstream: #d97706;
      --upstream-soft: #fffbeb;
      --upstream-border: #fcd34d;
      --downstream: #059669;
      --downstream-soft: #ecfdf5;
      --downstream-border: #6ee7b7;
      --equiv: #7c3aed;
      --equiv-soft: #f5f3ff;
      --equiv-border: #c4b5fd;
      --counter: #e11d48;
      --counter-soft: #fff1f2;
      --counter-border: #fda4af;
      --pitfall-bg: #fff7ed;
      --pitfall-border: #fdba74;
      --pitfall-ink: #9a3412;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 13px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    }
    .app { display: flex; flex-direction: column; width: 100%; height: 100dvh; overflow: hidden; }

    /* 1. 两层结构化顶栏：第一行 品牌 + 智能模糊检索 + 界面工具；第二行 阶段分段标签 + 学科/分支/专题/类型筛选 */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 20;
    }
    .topbar-main {
      padding: 10px 18px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-family: var(--font-math); font-size: 17px;
      flex-shrink: 0;
    }
    .brand-title { font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
    .brand-sub { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

    /* 核心智能检索框 + 模糊联想下拉面板 */
    .hero-search {
      position: relative;
      flex: 1; max-width: 560px; min-width: 220px; height: 38px;
      display: flex; align-items: center; gap: 7px;
      padding: 0 8px 0 13px;
      background: #f8fafc; border: 1.5px solid var(--border-strong); border-radius: 10px;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .hero-search:hover { border-color: #94a3b8; }
    .hero-search:focus-within {
      background: var(--surface); border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .hero-search-icon { font-size: 14px; color: var(--ink-muted); user-select: none; flex-shrink: 0; }
    .hero-search-input {
      flex: 1; min-width: 0; border: none; background: transparent;
      font-size: 13.5px; color: var(--ink); outline: none; padding: 0;
    }
    .hero-search-input::placeholder { color: #94a3b8; }
    .search-clear-btn {
      border: none; background: #e2e8f0; color: var(--ink-secondary);
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1; cursor: pointer; flex-shrink: 0;
    }
    .search-clear-btn:hover { background: #cbd5e1; color: var(--ink); }
    .search-count-badge {
      font-size: 10.5px; color: var(--ink-muted); padding: 2px 8px;
      border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border);
      white-space: nowrap; flex-shrink: 0;
    }
    .search-count-badge.filtered { color: #1d4ed8; background: var(--primary-soft); border-color: var(--primary-border); font-weight: 600; }

    .search-suggest-pop {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 11px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.15); z-index: 60;
      display: none; overflow: hidden; max-height: 460px; overflow-y: auto;
    }
    .search-suggest-pop.open { display: block; }
    .suggest-item {
      padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; transition: background 0.12s ease;
    }
    .suggest-item:last-of-type { border-bottom: none; }
    .suggest-item:hover, .suggest-item.active { background: var(--primary-soft); }
    .suggest-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .suggest-item-title {
      font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-item-title mark, .suggest-item-sub mark, .dir-card mark {
      background: #fef08a; padding: 0 2px; border-radius: 3px; color: var(--ink);
    }
    .suggest-item-tags { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .suggest-reason {
      font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius-pill);
      background: #f1f5f9; color: var(--ink-secondary); border: 1px solid var(--border); white-space: nowrap;
    }
    .suggest-reason.fuzzy { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
    .suggest-reason.hit { background: #fef9c3; color: #854d0e; border-color: #fde047; }
    .suggest-item-sub {
      font-size: 11.5px; color: var(--ink-muted); line-height: 1.4;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-foot {
      padding: 6px 12px; background: #f8fafc; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11px; color: var(--ink-muted);
    }

    .device-controls { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* 第二行：阶段分段标签 + 学科/分支/专题/类型级联筛选 */
    .filterbar {
      padding: 7px 18px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px;
    }
    .stage-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .stage-pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
      padding: 4px 11px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.14s ease;
    }
    .stage-pill:hover { border-color: var(--primary-border); color: var(--primary); }
    .stage-pill.active {
      background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.25);
    }
    .stage-pill-cnt {
      font-size: 11px; opacity: 0.78;
      background: rgba(15, 23, 42, 0.06); padding: 0 5px; border-radius: 99px;
    }
    .stage-pill.active .stage-pill-cnt { background: rgba(255, 255, 255, 0.22); opacity: 1; }

    .filter-selects { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    .select-field {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 8px; padding: 3px 8px;
    }
    .select-field.active-filter { background: var(--primary-soft); border-color: var(--primary-border); }
    .select-field label { font-size: 11px; color: var(--ink-muted); user-select: none; white-space: nowrap; }
    .select-field.active-filter label { color: #1d4ed8; font-weight: 600; }
    .select-field select {
      border: none; background: transparent; color: var(--ink);
      font-size: 12px; font-weight: 500; outline: none; cursor: pointer;
      padding: 2px 1px; max-width: 165px;
    }
    .select-field.active-filter select { color: #1e40af; font-weight: 600; }

    .toggle-btn {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary);
      padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }

    /* 2. 主工作区：左侧公式推导图谱占主导（flex: 1）+ 可拖拽分隔条 + 右侧详情推导框（默认 410px，支持拖拽调宽） */
    .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
    .canvas-pane {
      position: relative; display: flex; flex-direction: column;
      flex: 1; min-width: 420px; min-height: 0;
      background: radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0) 0 0 / 24px 24px, var(--bg);
    }
    .canvas-pane[data-view="directory"] { background: var(--bg); }
    .pane-resizer {
      width: 6px; flex-shrink: 0; cursor: col-resize;
      background: var(--border); position: relative; z-index: 15;
      transition: background 0.15s ease;
    }
    .pane-resizer:hover, .pane-resizer.dragging { background: var(--primary); }
    .pane-resizer::after {
      content: ""; position: absolute; top: 50%; left: 2px; transform: translateY(-50%);
      width: 2px; height: 34px; border-radius: 2px; background: rgba(100, 116, 139, 0.45);
    }
    .pane-resizer:hover::after, .pane-resizer.dragging::after { background: #fff; }

    .drawer {
      width: var(--drawer-w, 410px); min-width: 320px; flex-shrink: 0;
      background: var(--surface); display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
    }
    .app.drawer-collapsed .pane-resizer,
    .app.drawer-collapsed .drawer { display: none; }

    /* 精简上下文视图控制条 */
    .canvas-subbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 7px 14px;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .view-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .right-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

    .mode-switch {
      display: inline-flex; padding: 3px; border-radius: 9px;
      background: var(--surface-subtle); border: 1px solid var(--border); gap: 3px;
    }
    .mode-switch-btn {
      border: none; background: transparent; color: var(--ink-secondary);
      padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .mode-switch-btn:hover { color: var(--ink); }
    .mode-switch-btn.active {
      background: var(--surface); color: var(--primary); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .view-badge {
      font-size: 11px; font-weight: 600; color: #1d4ed8;
      background: var(--primary-soft); border: 1px solid var(--primary-border);
      padding: 2px 9px; border-radius: var(--radius-pill);
      max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 按需展开的最短路径查询条 */
    .path-bar {
      display: none; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 14px;
      background: #fffbeb; border-bottom: 1px solid var(--upstream-border);
      font-size: 12px; color: var(--ink-secondary);
    }
    .path-bar.open { display: flex; }
    .path-finder { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
    .path-finder select {
      border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 8px;
      font-size: 12px; background: var(--surface); color: var(--ink); max-width: 210px;
    }

    .zoom-controls {
      display: inline-flex; align-items: center;
      border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); overflow: hidden;
    }
    .zoom-btn { border: none; background: transparent; padding: 4px 8px; font-size: 12px; cursor: pointer; color: var(--ink-secondary); }
    .zoom-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .zoom-val { font-size: 11px; color: var(--ink-muted); padding: 0 5px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-width: 42px; text-align: center; }
    .action-btn { border: 1px solid var(--primary); background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; }
    .action-btn.ghost { background: var(--surface); color: var(--ink-secondary); border-color: var(--border-strong); }

    /* 图例与聚焦模式可点击筛选条 */
    .legend-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 14px;
      background: rgba(248, 250, 252, 0.94);
      border-bottom: 1px solid var(--border);
      font-size: 11.5px; color: var(--ink-secondary);
    }
    .canvas-pane[data-view="directory"] .legend-bar { display: none; }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; margin-right: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .focus-filter-pill {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
      padding: 2px 9px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.14s ease;
    }
    .focus-filter-pill:hover { border-color: var(--primary-border); color: var(--primary); }
    .focus-filter-pill.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .focus-filter-pill .dot { width: 6px; height: 6px; }

    /* 画布与卡片目录双容器显隐 */
    .graph-scroll { flex: 1; overflow: auto; padding: 18px; }
    .dir-scroll { flex: 1; overflow: auto; padding: 16px 18px 28px; display: none; }
    .canvas-pane[data-view="directory"] .graph-scroll { display: none; }
    .canvas-pane[data-view="directory"] .dir-scroll { display: block; }

    .dir-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
      gap: 12px;
    }
    .dir-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
      padding: 12px 14px; box-shadow: var(--shadow-sm); cursor: pointer;
      display: flex; flex-direction: column; gap: 7px;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .dir-card:hover { transform: translateY(-1px); border-color: var(--primary-border); box-shadow: var(--shadow-md); }
    .dir-card.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
    .dir-card-math {
      background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 8px;
      min-height: 48px; padding: 6px 8px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; overflow-x: auto; scrollbar-width: none;
    }
    .dir-card-math::-webkit-scrollbar { display: none; }
    .dir-card-stmt {
      font-size: 12px; color: var(--ink-secondary); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dir-card-foot {
      margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      font-size: 11px; color: var(--ink-muted);
    }

    .graph-zoom-wrap { transform-origin: top left; transition: transform 0.12s ease; }
    .graph-stage { position: relative; flex-shrink: 0; }
    .lane-header {
      position: absolute; top: 4px; width: 286px; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.94); border: 1px solid var(--border);
      border-radius: var(--radius-pill); padding: 4px 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lane-header.bridge-lane {
      background: #f8fafc; border-style: dashed; border-color: #94a3b8; color: #475569;
    }
    .lane-header.focus-center-lane {
      background: var(--primary-soft); border-color: var(--primary-border); color: #1d4ed8;
    }
    .lane-header.parallel-lane {
      background: var(--equiv-soft); border-color: var(--equiv-border); color: var(--equiv);
    }

    .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge-path { fill: none; stroke: #94a3b8; stroke-width: 1.7; opacity: 0.34; transition: stroke 0.18s ease, opacity 0.18s ease, stroke-width 0.18s ease; }
    .edge-path.cross-app { stroke-dasharray: 5 4; }
    .edge-path.dimmed { opacity: 0.06; }
    .edge-path.highlight-primary { stroke: var(--primary); stroke-width: 2.8; opacity: 1; }
    .edge-path.highlight-upstream { stroke: var(--upstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-downstream { stroke: var(--downstream); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-equiv { stroke: var(--equiv); stroke-width: 2.6; opacity: 1; }
    .edge-path.highlight-equiv-parallel { stroke: var(--equiv); stroke-width: 2.4; stroke-dasharray: 6 4; opacity: 1; }
    .edge-path.highlight-counter { stroke: var(--counter); stroke-width: 2.6; opacity: 1; stroke-dasharray: 6 3; }
    .edge-path.highlight-path { stroke: #e11d48; stroke-width: 3.1; opacity: 1; stroke-dasharray: 7 4; }

    .formula-node {
      position: absolute; width: 286px; background: var(--surface);
      border: 1.5px solid var(--border-strong); border-radius: var(--radius-lg);
      padding: 10px 14px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.18s ease;
      user-select: none; z-index: 3;
    }
    .formula-node.bridge-node {
      border-style: dashed; background: #f8fafc; opacity: 0.92;
    }
    .formula-node:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); z-index: 8; opacity: 1; }
    .formula-node.selected { border-color: var(--primary); border-width: 2px; border-style: solid; background: var(--primary-soft); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16); z-index: 7; opacity: 1; }
    .formula-node.rel-upstream { border-color: var(--upstream); background: var(--upstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-downstream { border-color: var(--downstream); background: var(--downstream-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-equiv { border-color: var(--equiv); background: var(--equiv-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-counter { border-color: var(--counter); background: var(--counter-soft); z-index: 5; opacity: 1; }
    .formula-node.rel-path { border-color: #e11d48; background: #fff1f2; box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.14); z-index: 6; opacity: 1; }
    .formula-node.dimmed { opacity: 0.18; }

    .node-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
    .node-title { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-badge { font-size: 10.5px; padding: 1px 6px; border-radius: var(--radius-pill); background: var(--surface-subtle); color: var(--ink-muted); border: 1px solid var(--border); flex-shrink: 0; }
    .node-badge.bridge-tag { background: #e2e8f0; color: #334155; }
    .node-math { min-height: 46px; display: flex; align-items: center; justify-content: center; padding: 4px 2px; font-size: 14.8px; color: var(--ink); overflow-x: auto; scrollbar-width: none; }
    .node-math::-webkit-scrollbar { display: none; }
    .node-math.long-math { font-size: 12.8px; }
    .node-math.xlong-math { font-size: 11.4px; }
    .node-foot { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--ink-muted); }
    .node-tag { background: rgba(15, 23, 42, 0.05); padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 600; }
    .disc-math { background: #e0e7ff; color: #3730a3; }
    .disc-phys { background: #dcfce7; color: #166534; }
    .disc-chem { background: #fef3c7; color: #92400e; }
    .kind-pill { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; white-space: nowrap; }
    .kind-formula { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .kind-axiom { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .kind-distribution { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .kind-theorem { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .kind-inequality { background: #ffe4e6; color: #be123c; border-color: #fda4af; }
    .kind-law { background: #dcfce7; color: #166534; border-color: #86efac; }
    .kind-definition { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

    .edge-pill {
      position: absolute; transform: translate(-50%, -50%);
      background: var(--surface); border: 1px solid var(--primary-border);
      border-radius: var(--radius-pill); padding: 2px 9px; font-size: 11px; color: var(--primary);
      cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap; z-index: 9;
    }
    .edge-pill:hover, .edge-pill.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .empty-state {
      display: grid; place-items: center; min-height: 220px;
      color: var(--ink-muted); font-size: 14px; text-align: center; padding: 24px;
    }

    /* 3. 右侧详情与分级推导抽屉（保持紧凑 410px，支持拖拽调宽 + 浏览历史栏） */
    .drawer-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); background: var(--surface-subtle); padding: 6px 12px 0; gap: 6px; }
    .drawer-tab { border: none; background: transparent; padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .drawer-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); background: var(--surface); border-radius: 8px 8px 0 0; }
    .drawer-history-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 6px 12px; background: #f8fafc; border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .history-select {
      flex: 1; min-width: 120px;
      border: 1px solid var(--border-strong); border-radius: 6px;
      background: var(--surface); color: var(--ink);
      font-size: 11.5px; padding: 3px 7px; outline: none; cursor: pointer;
    }
    .history-select:focus { border-color: var(--primary); }
    .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--border); color: var(--ink-muted); }
    .mini-btn:disabled:hover { border-color: var(--border); color: var(--ink-muted); }

    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 15px 0 7px; }
    .section-label:first-child { margin-top: 0; }

    .hero-card { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px; }
    .hero-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
    .hero-aliases { font-size: 12px; color: var(--ink-muted); margin-bottom: 9px; }
    .hero-math { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; font-size: 17px; overflow-x: auto; margin-bottom: 9px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--ink-secondary); }
    .chip.verified { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .chip.rule { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; font-family: var(--font-mono); }

    /* 全貌速览胶囊条（参考 finlex-site，一眼掌握前置/衍生/等价/反例数量并快捷定位） */
    .overview-strip {
      margin-top: 10px; padding: 9px 11px; border-radius: var(--radius-md);
      background: #f8fafc; border: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .overview-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); margin-right: 2px; }
    .overview-pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
      padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500;
      cursor: pointer; transition: all 0.14s ease;
    }
    .overview-pill:hover { border-color: var(--primary-border); color: var(--primary); background: var(--primary-soft); }
    .overview-pill .dot { width: 6px; height: 6px; }

    .var-table { width: 100%; border-collapse: collapse; font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .var-table th, .var-table td { padding: 6px 7px; border-bottom: 1px solid var(--border); text-align: left; }
    .var-table th { background: var(--surface-subtle); color: var(--ink-muted); font-weight: 600; font-size: 11px; }
    .var-table tr:last-child td { border-bottom: none; }

    .rel-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 11px; margin-bottom: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
    .rel-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rel-kind { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); }
    .rel-kind.upstream { background: var(--upstream-soft); color: var(--upstream); border: 1px solid var(--upstream-border); }
    .rel-kind.downstream { background: var(--downstream-soft); color: var(--downstream); border: 1px solid var(--downstream-border); }
    .rel-kind.equiv { background: var(--equiv-soft); color: var(--equiv); border: 1px solid var(--equiv-border); }
    .rel-kind.counter { background: var(--counter-soft); color: var(--counter); border: 1px solid var(--counter-border); }
    .rel-actions { display: flex; gap: 6px; }
    .mini-btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-secondary); padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
    .mini-btn.primary { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); font-weight: 600; }

    .level-switcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-subtle); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin: 12px 0 14px; }
    .level-btn { border: none; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--ink-secondary); cursor: pointer; }
    .level-btn.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-sm); }

    .summary-box { background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: var(--radius-md); padding: 13px; color: #1e3a8a; font-size: 13.5px; line-height: 1.65; }
    .step-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 11px; margin-bottom: 9px; background: var(--surface); }
    .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .step-num { width: 21px; height: 21px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
    .step-note { font-size: 12.5px; color: var(--ink); }
    .step-math { background: var(--surface-subtle); border-radius: 7px; padding: 8px 10px; text-align: center; font-size: 14.5px; overflow-x: auto; }
    .step-cites { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); }
    .cite-link { border: 1px solid var(--primary-border); background: var(--primary-soft); color: var(--primary); border-radius: var(--radius-pill); padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .cite-link:hover { background: var(--primary); color: #fff; }
    .pitfall-box { margin-top: 7px; background: var(--pitfall-bg); border: 1px solid var(--pitfall-border); border-radius: 7px; padding: 7px 10px; font-size: 12px; color: var(--pitfall-ink); }
    .path-banner { background: #fff1f2; border: 1px solid #fda4af; color: #9f1239; border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; }

    .math-fallback { font-family: var(--font-math); font-size: 1.03em; }
    .math-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; font-size: 0.88em; line-height: 1.15; }
    .math-frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 4px 1px; }
    .math-frac > span:last-child { padding: 1px 4px 0; }

    /* 桌面 / 平板 / 手机三端界面适配与预览框架 */
    body.preview-framed {
      background: #e2e8f0;
      display: flex; justify-content: center; align-items: stretch;
      padding: 10px 0;
    }
    body.preview-framed .app.mode-mobile {
      max-width: 430px; height: calc(100dvh - 20px);
      border-radius: 22px; border: 1px solid var(--border-strong);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
      background: var(--bg);
    }
    body.preview-framed .app.mode-tablet {
      max-width: 920px; height: calc(100dvh - 20px);
      border-radius: 18px; border: 1px solid var(--border-strong);
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.16);
      background: var(--bg);
    }

    .mobile-or-tablet-only { display: none; }
    .desktop-or-tablet-only { display: inline-flex; }
    .app.mode-mobile .desktop-or-tablet-only { display: none; }
    .mobile-nav { display: none; }
    .mobile-selected-pill { display: none; }

    /* 平板端 */
    .app.mode-tablet .topbar-main { padding: 8px 12px; gap: 10px; flex-wrap: wrap; }
    .app.mode-tablet .hero-search { order: 3; flex: 1 1 100%; max-width: none; height: 36px; }
    .app.mode-tablet .mobile-or-tablet-only { display: inline-flex; }
    .app.mode-tablet .filterbar { display: none; padding: 8px 12px; }
    .app.mode-tablet.filters-open .filterbar { display: flex; }
    .app.mode-tablet .select-field,
    .app.mode-tablet .toggle-btn,
    .app.mode-tablet .zoom-btn { min-height: 34px; }
    .app.mode-tablet .canvas-pane { min-width: 320px; }
    .app.mode-tablet .drawer { width: var(--drawer-w, 356px); min-width: 280px; }
    .app.mode-tablet.tablet-drawer-closed .pane-resizer,
    .app.mode-tablet.tablet-drawer-closed .drawer { display: none; }
    .app.mode-tablet .graph-scroll { -webkit-overflow-scrolling: touch; padding: 12px; }

    /* 手机端 */
    .app.mode-mobile .topbar-main { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
    .app.mode-mobile .hero-search { order: 3; flex: 1 1 100%; max-width: none; height: 36px; }
    .app.mode-mobile .hero-search .search-count-badge { display: none; }
    .app.mode-mobile .brand-title { font-size: 14px; }
    .app.mode-mobile .brand-sub { font-size: 11px; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app.mode-mobile .mobile-or-tablet-only { display: inline-flex; }
    .app.mode-mobile .filterbar { display: none; padding: 8px 12px; gap: 8px; }
    .app.mode-mobile.filters-open .filterbar { display: flex; flex-direction: column; align-items: stretch; }
    .app.mode-mobile .filter-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .app.mode-mobile .filter-selects .select-field { width: 100%; justify-content: space-between; min-height: 36px; }
    .app.mode-mobile .filter-selects .select-field select { flex: 1; max-width: none; }
    .app.mode-mobile .canvas-subbar { padding: 6px 10px; gap: 6px; }
    .app.mode-mobile .view-badge,
    .app.mode-mobile .legend-bar,
    .app.mode-mobile #pathToggleBtn,
    .app.mode-mobile .path-bar,
    .app.mode-mobile #densityField { display: none !important; }
    .app.mode-mobile .view-controls { gap: 5px; }
    .app.mode-mobile .select-field,
    .app.mode-mobile .toggle-btn,
    .app.mode-mobile .zoom-btn { min-height: 34px; font-size: 12px; }
    .app.mode-mobile .workspace { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .app.mode-mobile .pane-resizer { display: none; }
    .app.mode-mobile .canvas-pane { flex: 1; min-width: 0; min-height: 0; }
    .app.mode-mobile .drawer { width: 100% !important; min-width: 0; flex: 1; min-height: 0; border-left: none; }
    .app.mode-mobile .drawer-tabs { display: none; }
    .app.mode-mobile .drawer-body { padding: 12px; }
    .app.mode-mobile .graph-scroll { -webkit-overflow-scrolling: touch; padding: 10px; }
    .app.mode-mobile[data-mobile-pane="canvas"] .drawer { display: none; }
    .app.mode-mobile[data-mobile-pane="formula"] .canvas-pane,
    .app.mode-mobile[data-mobile-pane="derivation"] .canvas-pane { display: none; }

    .app.mode-mobile .mobile-selected-pill {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 15;
      background: rgba(15, 23, 42, 0.92); color: #fff;
      padding: 8px 12px; border-radius: 12px; box-shadow: var(--shadow-md);
      font-size: 12.5px;
    }
    .mobile-pill-btn {
      border: none; background: var(--primary); color: #fff;
      padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }

    .app.mode-mobile .mobile-nav {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
      gap: 4px; z-index: 25;
    }
    .mobile-nav-btn {
      border: none; background: transparent; color: var(--ink-muted);
      padding: 8px 4px; border-radius: 9px; font-size: 12px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .mobile-nav-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; place-items: center; z-index: 100; padding: 16px; }
    .modal-backdrop.open { display: grid; }
    .modal-card { background: var(--surface); border-radius: 14px; max-width: 560px; width: 100%; padding: 18px 20px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25); max-height: 85vh; overflow-y: auto; }
    .modal-card.wide { max-width: 860px; width: min(860px, 95vw); max-height: 90vh; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .pill.local-mod { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; font-size: 11px; background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; font-weight: 600; }
    .pill.local-new { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; font-size: 11px; background: #d1fae5; color: #065f46; border: 1px solid #10b981; font-weight: 600; }
    .local-badge-cnt { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px; }
    .mini-btn.danger { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
    .mini-btn.danger:hover { background: #fee2e2; border-color: #f87171; }
    .local-summary-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-subtle); border: 1px solid var(--border); margin-bottom: 12px; font-size: 12.5px; color: var(--ink-secondary); }
    .local-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .local-item-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow: auto; }
    .local-item-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .local-item-main { min-width: 0; flex: 1; }
    .local-item-title { font-weight: 600; font-size: 13.5px; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .local-item-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }
    .local-item-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .local-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
    .local-field { display: flex; flex-direction: column; gap: 4px; }
    .local-field.full { grid-column: 1 / -1; }
    .local-field label { font-size: 12px; font-weight: 600; color: var(--ink-secondary); }
    .local-field input, .local-field select, .local-field textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; font-family: inherit; }
    .local-field textarea { min-height: 58px; resize: vertical; line-height: 1.5; }
    .local-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .local-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .local-section-head h4 { margin: 0; font-size: 13.5px; color: var(--ink); }
    .local-link-row { display: grid; grid-template-columns: 120px 1.4fr 120px 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
    .local-link-row input, .local-link-row select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12.5px; }
    .local-editor-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .local-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(14px); background: rgba(15, 23, 42, 0.92); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 12.5px; z-index: 220; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22); }
    .local-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) { .local-form-grid, .local-link-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app mode-desktop" id="appRoot" data-mobile-pane="canvas">
    <!-- 1. 结构化两层顶栏：第一行 品牌 + 智能模糊检索 + 视图工具；第二行 阶段分段标签 + 学科/分支/专题/类型筛选 -->
    <header class="topbar">
      <div class="topbar-main">
        <div class="brand">
          <div class="brand-badge">∑</div>
          <div>
            <div class="brand-title">数理知识图谱 · 动态视图引擎</div>
            <div class="brand-sub" id="statsSubtitle">加载中...</div>
          </div>
        </div>

        <div class="hero-search" id="heroSearchWrap" role="search">
          <span class="hero-search-icon" aria-hidden="true">🔍</span>
          <input class="hero-search-input" id="searchInput" type="search" autocomplete="off" placeholder="检索公式、简称或多词组合（如 CLT / 柯西 不存在 / 正弦 求导）..." />
          <button class="search-clear-btn" id="searchClearBtn" type="button" title="清空搜索" style="display:none">×</button>
          <span class="search-count-badge" id="searchCountBadge">237 项</span>
          <div class="search-suggest-pop" id="searchSuggestPop" role="listbox" aria-label="模糊检索联想建议"></div>
        </div>

        <div class="device-controls">
          <button class="toggle-btn mobile-or-tablet-only" id="filterToggleBtn">筛选</button>
          <button class="toggle-btn desktop-or-tablet-only active" id="tabletDrawerBtn" title="收起右侧详情推导栏，横向全屏浏览图谱">◧ 收起详情</button>
          <button class="toggle-btn" id="localAddBtn" onclick="openLocalEditorModal(null)" title="新增仅保存在本机的自定义公式或定理">＋ 新增</button>
          <button class="toggle-btn" id="localWsBtn" onclick="openLocalWorkspaceModal()" title="管理本地修订、新增公式与 JSON 补丁包">📦 工作区<span class="local-badge-cnt" id="localWsCnt" style="display:none">0</span></button>
          <div class="select-field" title="切换桌面端、平板端或手机端适配界面">
            <label for="deviceModeSelect">界面</label>
            <select id="deviceModeSelect">
              <option value="auto">自动适配</option>

  <script src="./data/graph-data.js"></script>
  <script>
    const PAYLOAD = window.FORMULA_GRAPH_DATA || { taxonomy: { stages: [], disciplines: [] }, graph: { formulas: [], derivations: [] } };
    const TAXONOMY = PAYLOAD.taxonomy;
    const MASTER_GRAPH = PAYLOAD.graph;
    const NODE_W = 286;
    const NODE_H = 122;

    const DENSITY_CFG = {
      compact:  { colGap: 318, rowGap: 136 },
      standard: { colGap: 344, rowGap: 150 },
      spacious: { colGap: 378, rowGap: 168 }
    };

    const STAGE_LIST = TAXONOMY.stages || [
      { id: "junior_high", label: "初中" },
      { id: "senior_high", label: "高中" },
      { id: "undergraduate", label: "大学" }
    ];
    const STAGE_LABELS = Object.fromEntries(STAGE_LIST.map(s => [s.id, s.label]));
    const STAGE_ORDER = Object.fromEntries(STAGE_LIST.map((s, idx) => [s.id, idx]));

    const RAW_TO_CANONICAL = {};
    const DISC_BY_ID = {};
    const BRANCH_BY_ID = {};
    const TOPIC_BY_ID = {};
    let branchOrderIdx = 0;
    let topicOrderIdx = 0;

    TAXONOMY.disciplines.forEach((disc, dIdx) => {
      DISC_BY_ID[disc.id] = { ...disc, order: dIdx };
      disc.branches.forEach(br => {
        BRANCH_BY_ID[br.id] = { ...br, disciplineId: disc.id, disciplineLabel: disc.label, order: branchOrderIdx++ };
        br.topics.forEach(tp => {
          TOPIC_BY_ID[tp.id] = { ...tp, branchId: br.id, branchLabel: br.label, disciplineId: disc.id, order: topicOrderIdx++ };
          (tp.raw_topics || [tp.id]).forEach(rt => {
            if (!RAW_TO_CANONICAL[rt]) RAW_TO_CANONICAL[rt] = [];
            RAW_TO_CANONICAL[rt].push({ disciplineId: disc.id, branchId: br.id, topicId: tp.id });
          });
        });
      });
    });

    const REL_LABELS = {
      derives_to: "直接推导", special_case_of: "特例化", generalizes: "推广",
      equivalent_to: "等价变形", simplifies: "化简工具", applies_in: "跨学科/跨段应用",
      counterexample_to: "反例/失效边界", dual_of: "对偶关系"
    };
    const NODE_KIND_LIST = [
      { id: "formula", label: "公式" },
      { id: "definition", label: "定义" },
      { id: "theorem", label: "定理" },
      { id: "law", label: "定律" },
      { id: "distribution", label: "分布" },
      { id: "inequality", label: "不等式" },
      { id: "axiom", label: "公理" }
    ];
    const NODE_KIND_LABELS = Object.fromEntries(NODE_KIND_LIST.map(x => [x.id, x.label]));
    const NODE_KIND_ORDER = Object.fromEntries(NODE_KIND_LIST.map((x, idx) => [x.id, idx]));

    const SITE_LABELS = {
      definition_level: "定义级 (definition_level)",
      proof_level: "推导级 (proof_level)",
      application_level: "应用级 (application_level)"
    };
    const LAYOUT_LABELS = {
      focus: "聚焦关联视图",
      topo: "按拓扑推导层",
      topic: "按专题泳道",
      branch: "按分支泳道",
      stage: "按阶段泳道"
    };

    const formulaById = Object.fromEntries(MASTER_GRAPH.formulas.map(f => [f.id, f]));
    const derivById = Object.fromEntries(MASTER_GRAPH.derivations.map(d => [d.id, d]));

    // 预计算每个节点的连接度、规范分类与全字段检索文本
    const globalDegree = {};
    MASTER_GRAPH.formulas.forEach(f => { globalDegree[f.id] = 0; });
    MASTER_GRAPH.derivations.forEach(d => {
      if (globalDegree[d.to_formula_id] !== undefined) globalDegree[d.to_formula_id] += 1;
      d.from_formula_ids.forEach(fid => { if (globalDegree[fid] !== undefined) globalDegree[fid] += 1; });
    });

    MASTER_GRAPH.formulas.forEach(f => {
      const branches = new Set();
      const canonicalTopics = new Set();
      let primaryBranch = null;
      let primaryTopic = null;
      f.taxonomy.topics.forEach(rt => {
        (RAW_TO_CANONICAL[rt] || []).forEach(m => {
          branches.add(m.branchId);
          canonicalTopics.add(m.topicId);
          if (!primaryBranch) primaryBranch = m.branchId;
          if (!primaryTopic) primaryTopic = m.topicId;
        });
      });
      f._branches = branches;
      f._canonicalTopics = canonicalTopics;
      f._primaryBranch = primaryBranch || "other";
      f._primaryTopic = primaryTopic || "other";
      f._primaryStage = f.taxonomy.education_stages[0] || "junior_high";
      f._kind = f.node_kind || "formula";
      f._degree = globalDegree[f.id] || 0;

      const stageLbls = f.taxonomy.education_stages.map(s => STAGE_LABELS[s] || s).join(" ");
      const brLbls = [...branches].map(bid => BRANCH_BY_ID[bid]?.label || "").join(" ");
      const tpLbls = [...canonicalTopics].map(tid => TOPIC_BY_ID[tid]?.label || "").join(" ");
      const varTxt = (f.variables || []).map(v => `${v.symbol} ${v.name} ${v.si_unit || ""}`).join(" ");
      f._titleSearch = `${f.name} ${(f.aliases || []).join(" ")} ${NODE_KIND_LABELS[f._kind] || ""}`.toLowerCase();
      f._bodySearch = `${f.latex} ${f.statement || ""} ${f.intuition || ""} ${f.worked_example || ""} ${(f.applications || []).join(" ")} ${(f.conditions || []).join(" ")} ${varTxt} ${stageLbls} ${brLbls} ${tpLbls}`.toLowerCase();
      f._fullSearch = `${f._titleSearch} ${f._bodySearch}`;
    });

    const state = {
      stageFilter: "all",
      discFilter: "all",
      branchFilter: "all",
      topicFilter: "all",
      kindFilter: "all",
      searchQuery: "",
      viewMode: "focus",      // "focus" | "global" | "directory"
      focusRelFilter: "all",  // "all" | "upstream" | "downstream" | "equiv" | "counter"
      dirSort: "curriculum",  // "curriculum" | "degree" | "kind"
      layoutMode: "auto",
      density: "standard",
      includeBridges: false,
      pathBarOpen: false,
      selectedFormulaId: "math.calc.derivative_def",
      selectedDerivId: null,
      activeTab: "formula",
      level: "L2",
      zoom: 1.0,
      activePath: null,
      navHistory: [],
      navIndex: -1,
      recentFormulaIds: [],
      deviceMode: "auto",
      filtersOpen: false,
      tabletDrawerOpen: true,
      customDrawerW: null,
      mobilePane: "canvas"
    };

    let currentView = {
      matchedFormulas: [],
      coreIds: new Set(),
      bridgeIds: new Set(),
      visibleFormulas: [],
      visibleDerivations: [],
      positions: {},
      lanes: [],
      stageW: 800,
      stageH: 600,
      effectiveMode: "focus"
    };

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 40+ 数理化高频简称与英文缩写扩展词典（参照 finlex-site 检索架构）
    const SEARCH_SYNONYMS = {
      "clt": ["中心极限定理"],

    // 模糊概念家族扩展词典：帮助用户从宽泛主题一键联想关联对象家族

    let _cachedQueryRaw = null;
    let _cachedQueryParsed = null;

    function parseSearchQuery(rawQuery) {
      const raw = String(rawQuery || "").trim();
      if (raw === _cachedQueryRaw && _cachedQueryParsed) return _cachedQueryParsed;
      if (!raw) {
        _cachedQueryRaw = "";
        _cachedQueryParsed = { raw: "", groups: [], allMask: 0, flatVariants: [], highlightRegex: null, expandedHints: [] };
        return _cachedQueryParsed;
      }
      const tokens = raw.split(/\s+/).filter(Boolean).slice(0, 10);
      const groups = [];
      const expandedHints = [];
      const allVariantSet = new Set();

      tokens.forEach(tok => {
        const lower = tok.toLowerCase();
        const vSet = new Set([lower]);
        if (SEARCH_SYNONYMS[lower]) {
          SEARCH_SYNONYMS[lower].forEach(syn => vSet.add(syn.toLowerCase()));
          expandedHints.push(`${tok}→${SEARCH_SYNONYMS[lower][0]}`);
        }
        const variants = [...vSet];
        variants.forEach(v => allVariantSet.add(v));
        groups.push({ raw: tok, variants });
      });

      const flatVariants = [...allVariantSet].sort((a, b) => b.length - a.length);
      const highlightRegex = flatVariants.length
        ? new RegExp(`(${flatVariants.map(v => escapeHTML(v).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi")
        : null;
      const allMask = groups.length ? ((1 << groups.length) - 1) : 0;

      _cachedQueryRaw = raw;
      _cachedQueryParsed = { raw, groups, allMask, flatVariants, highlightRegex, expandedHints };
      return _cachedQueryParsed;
    }

    function getMatchMask(haystackLower, groups) {
      let mask = 0;
      for (let g = 0; g < groups.length; g++) {
        const variants = groups[g].variants;
        for (let k = 0; k < variants.length; k++) {
          if (haystackLower.includes(variants[k])) {
            mask |= (1 << g);
            break;
          }
        }
      }
      return mask;
    }

    function countBits(n) {
      let c = 0;
      while (n) { n &= (n - 1); c += 1; }
      return c;
    }

    function highlightText(text, q) {
      const safe = escapeHTML(text);
      if (!q) return safe;
      const parsed = parseSearchQuery(q);
      if (!parsed.highlightRegex) return safe;
      return safe.replace(parsed.highlightRegex, "<mark>$1</mark>");
    }

    function getBigrams(str) {
      const s = String(str || "").toLowerCase().replace(/[\s（）()·\-_,，。]/g, "");
      const set = new Set();
      if (s.length <= 1) { if (s) set.add(s); return set; }
      for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2));
      return set;
    }

    let activeSuggestList = [];
    let activeSuggestIdx = -1;

    function computeFuzzySuggestions(rawQuery, limit = 8) {
      const q = String(rawQuery || "").trim();
      if (!q) return { items: [], total: 0 };
      const qLower = q.toLowerCase();
      const parsed = parseSearchQuery(q);
      const qBigrams = getBigrams(q);

      const fuzzyTerms = new Set();
      Object.entries(FUZZY_CONCEPT_HINTS).forEach(([k, arr]) => {
        const kl = k.toLowerCase();
        if (qLower.includes(kl) || (qLower.length >= 2 && kl.includes(qLower))) {
          arr.forEach(t => fuzzyTerms.add(t.toLowerCase()));
        }
      });

      const scorePool = (pool) => {
        const out = [];
        for (let i = 0; i < pool.length; i++) {
          const f = pool[i];
          const nameL = f.name.toLowerCase();
          const aliasL = (f.aliases || []).join(" ").toLowerCase();
          let score = 0;
          let reason = "";
          let reasonCls = "";

          const titleMask = getMatchMask(f._titleSearch, parsed.groups);
          const fullMask = getMatchMask(f._fullSearch, parsed.groups);

          if (nameL.includes(qLower)) {
            score += 180 + (nameL === qLower ? 50 : 0);
            reason = "标题匹配";
          } else if (aliasL.includes(qLower)) {
            score += 145;
            reason = "别名匹配";
          } else if (titleMask > 0) {
            const hits = countBits(titleMask);
            score += hits * 80 + (titleMask === parsed.allMask ? 50 : 0);
            reason = "标题匹配";
          } else if (fullMask === parsed.allMask && parsed.allMask > 0) {
            score += 95;
            reason = "公式/说明匹配";
            reasonCls = "hit";
          } else if (fullMask > 0) {
            score += countBits(fullMask) * 34;
            reason = "局部匹配";
            reasonCls = "hit";
          }

          if (fuzzyTerms.size > 0) {
            let fHit = false;
            for (const ft of fuzzyTerms) {
              if (nameL.includes(ft) || aliasL.includes(ft)) { fHit = true; break; }
            }
            if (fHit) {
              score += 72;
              if (!reason) { reason = "概念关联"; reasonCls = "fuzzy"; }
            }
          }

          if (qBigrams.size > 0 && score < 80) {
            const tBigrams = getBigrams(`${f.name} ${(f.aliases || []).join(" ")}`);
            let overlap = 0;
            qBigrams.forEach(bg => { if (tBigrams.has(bg)) overlap += 1; });
            const ratio = overlap / qBigrams.size;
            if (ratio >= 0.45) {
              score += Math.round(ratio * 65);
              if (!reason) { reason = "模糊匹配"; reasonCls = "fuzzy"; }
            }
          }

          if (score <= 0) continue;
          score += Math.min(20, f._degree * 2);

          out.push({
            formula: f,
            score,
            reason: reason || "相关匹配",
            reasonCls,
            snippet: f.statement || (f.aliases || []).join(" / ") || f.latex
          });
        }
        out.sort((a, b) => b.score - a.score || b.formula._degree - a.formula._degree);
        return out;
      };

      const stagePool = filterByStage(MASTER_GRAPH.formulas);
      let ranked = scorePool(stagePool);
      if (ranked.length < 5 && state.stageFilter !== "all") {
        const allRanked = scorePool(MASTER_GRAPH.formulas);
        const seen = new Set(ranked.map(x => x.formula.id));
        allRanked.forEach(item => {
          if (!seen.has(item.formula.id)) { ranked.push(item); seen.add(item.formula.id); }
        });
      }
      return { items: ranked.slice(0, limit), total: ranked.length };
    }

    function getDiscMeta(f) {
      const dList = f.taxonomy.disciplines;
      const hasMath = dList.includes("mathematics"), hasPhys = dList.includes("physics"), hasChem = dList.includes("chemistry");
      if (hasPhys && hasChem) return { label: "物理 ↔ 化学", cls: "disc-chem" };
      if (hasMath && hasPhys) return { label: "数学 ↔ 物理", cls: "disc-math" };
      if (hasChem) return { label: "化学", cls: "disc-chem" };
      if (hasPhys) return { label: "物理", cls: "disc-phys" };
      return { label: "数学", cls: "disc-math" };
    }

    function renderSearchSuggestions(rawQuery) {
      const pop = document.getElementById("searchSuggestPop");
      if (!pop) return;
      const q = String(rawQuery || "").trim();
      if (!q) { closeSearchSuggestions(); return; }
      const { items, total } = computeFuzzySuggestions(q, 8);
      activeSuggestList = items;
      activeSuggestIdx = -1;
      if (!items.length) {
        pop.innerHTML = `<div class="suggest-foot"><span>未找到与「${escapeHTML(q)}」相关的公式或定理，可尝试精简关键词。</span></div>`;
        pop.classList.add("open");
        return;
      }
      const rowsHTML = items.map((item, idx) => {
        const f = item.formula;
        const dm = getDiscMeta(f);
        const kindLabel = NODE_KIND_LABELS[f._kind] || "公式";
        const stageLbl = STAGE_LABELS[f._primaryStage] || "";
        return `
          <div class="suggest-item" role="option" data-idx="${idx}" onmousedown="event.preventDefault(); pickSearchSuggestion('${f.id}')">
            <div class="suggest-item-top">
              <span class="suggest-item-title" title="${escapeHTML(f.name)}">${highlightText(f.name, q)}</span>
              <span class="suggest-item-tags">
                <span class="node-tag ${dm.cls}">${dm.label}</span>
                <span class="kind-pill kind-${f._kind}">${kindLabel}</span>
                <span class="suggest-reason ${item.reasonCls}">${escapeHTML(item.reason)}</span>
              </span>
            </div>
            <div class="suggest-item-sub">${stageLbl ? `[${stageLbl}] ` : ""}${highlightText(item.snippet, q)}</div>
          </div>
        `;
      }).join("");
      pop.innerHTML = `${rowsHTML}
        <div class="suggest-foot">
          <span>模糊联想前 ${items.length} 条（共 ${total} 项相关 · ↑↓ 选择，回车聚焦）</span>
          <button type="button" class="mini-btn primary" onmousedown="event.preventDefault(); viewAllSearchInDirectory()">在目录中查看全部 →</button>
        </div>`;
      pop.classList.add("open");
    }

    function updateSuggestHighlight() {
      const pop = document.getElementById("searchSuggestPop");
      if (!pop) return;
      pop.querySelectorAll(".suggest-item").forEach((el, idx) => {
        const on = idx === activeSuggestIdx;
        el.classList.toggle("active", on);
        if (on) el.scrollIntoView({ block: "nearest" });

    function pickSearchSuggestion(fid) {
      if (!fid || !formulaById[fid]) return;
      closeSearchSuggestions();
      const f = formulaById[fid];
      // 若选中对象不在当前筛选范围内，自动放宽冲突的筛选条件以确保画布聚焦无障碍
      if (state.stageFilter !== "all" && !f.taxonomy.education_stages.includes(state.stageFilter)) state.stageFilter = "all";
      if (state.discFilter !== "all" && !f.taxonomy.disciplines.includes(state.discFilter)) state.discFilter = "all";
      if (state.branchFilter !== "all" && !f._branches.has(state.branchFilter)) state.branchFilter = "all";
      if (state.topicFilter !== "all" && !f._canonicalTopics.has(state.topicFilter)) state.topicFilter = "all";
      if (state.kindFilter !== "all" && f._kind !== state.kindFilter) state.kindFilter = "all";
      syncCascadingDropdowns();

      state.selectedFormulaId = fid;
      recordFormulaVisit(fid);
      state.viewMode = "focus";
      state.focusRelFilter = "all";
      state.activeTab = "formula";
      state.activePath = null;
      document.getElementById("clearPathBtn").style.display = "none";
      syncPathBarUI();
      generateDynamicView(true, { keepSelected: true });
